      });
      main.appendChild(grid);
    }).catch(function (e) { U.clear(main).appendChild(h('p', { class: 'empty' }, errMsg(e))); });
  }

  /* ───────────────────────── DEBERES ─────────────────────────
     Las actividades de la sección Homework ya están preparadas. Aquí se publican
     para cada grupo; el alumno solo ve las publicadas para su grupo. */
  function renderHomework(main) {
    main.appendChild(UI.loading());
    Promise.all([loadOverview(), CQ.Api.admin('getHomework')]).then(function (x) {
      var hw = x[1];
      U.clear(main);
      var card = h('div', { class: 'card t-card' },
        h('div', { class: 't-toolbar' }, h('h2', { class: 'grow', style: { margin: 0 } }, 'Deberes'),
          h('button', { class: 'btn btn-ghost t-btn', onclick: function () { shell(); } }, 'Recargar')),
        h('div', { class: 't-note' }, 'Los deberes están preparados pero ocultos. Pulsa "Publicar" en el grupo que quieras: sus alumnos los verán en la sección Homework y en su página de inicio. "Hecho" = alumnos que lo han terminado.'));
      if (!hw.courses.length) card.appendChild(h('p', { class: 'empty' }, 'Todavía no hay deberes preparados. Ejecuta setup para añadir los de ejemplo.'));
      hw.courses.forEach(function (c) {
        // Profesor: solo el grupo con el que está trabajando.
        var groups = isTeacherMode() ? c.groups.filter(function (g) { return g === state.group; }) : c.groups;
        if (isTeacherMode() && !groups.length) return;
        card.appendChild(h('h3', { class: 'hw-course' }, c.course.title));
        if (!groups.length) card.appendChild(h('p', { class: 'muted' }, 'Ningún grupo tiene este curso (pestaña Groups).'));
        c.units.forEach(function (u) {
          card.appendChild(h('div', { class: 'hw-unit' }, u.number ? 'Unit ' + u.number + ' - ' + u.title : u.title));
          u.activities.forEach(function (a) {
            card.appendChild(h('div', { class: 'hw-row' },
              h('div', { class: 'hw-title' }, h('b', {}, a.title), h('span', { class: 'muted' }, ' · ' + a.itemsCount + ' preguntas')),
              h('div', { class: 'hw-groups' }, groups.map(function (g) { return hwChip(a, g, a.state[g]); }))));
          });
        });
      });
      main.appendChild(card);
    }).catch(function (e) { U.clear(main).appendChild(h('p', { class: 'empty' }, errMsg(e))); });
  }

  function hwChip(a, g, st) {
    st = st || { published: false, done: 0, total: 0 };
    var btn = h('button', { class: 'btn t-btn ' + (st.published ? 'btn-ghost' : ''), onclick: function () {
      var to = !st.published;
      var go = to ? Promise.resolve(true)
        : UI.confirm('¿Retirar "' + a.title + '" de ' + g + '?', 'Los alumnos dejarán de verlo. Lo que ya hayan hecho se conserva.', 'Retirar', 'Cancelar');
      go.then(function (ok) {
        if (!ok) return;
        btn.disabled = true;
        CQ.Api.admin('setHomework', { activityId: a.activityId, group: g, published: to }).then(function () {
          UI.toast(to ? 'Publicado para ' + g + '.' : 'Retirado de ' + g + '.');
          shell();
        }).catch(function (e) { btn.disabled = false; UI.toast(errMsg(e)); });
      });
    } }, st.published ? 'Retirar' : 'Publicar');
    return h('div', { class: 'hw-chip' + (st.published ? ' on' : '') },
      h('b', {}, g),
      st.published
        ? h('span', { class: 'hw-state' }, '✔ Publicado ' + U.fmtDate(st.publishedAt) + ' · Hecho ' + st.done + '/' + st.total)
        : h('span', { class: 'hw-state muted' }, 'Sin publicar'),
      btn);
  }

  function loadOverview(force) {
    if (state.overview && !force) return Promise.resolve(state.overview);
    return CQ.Api.admin('getOverview').then(function (d) { state.overview = d; return d; });
  }

  function courseName(id) {
    var c = (state.overview ? state.overview.courses : []).filter(function (x) { return x.courseId === id; })[0];
    return c ? (c.subjectId === 'SCI' ? 'Sci' : 'Eng') + ' Y' + c.year : id;
  }

  /* ───────────────────────── ALUMNOS ───────────────────────── */
  function renderStudents(main) {
    main.appendChild(UI.loading());
    loadOverview().then(function (ov) {
      U.clear(main);
      if (isTeacherMode()) { main.appendChild(teacherStudentTable(ov)); return; }
      main.appendChild(h('div', { class: 't-grid2' }, createForm(ov), studentTable(ov)));
    }).catch(function (e) { U.clear(main).appendChild(h('p', { class: 'empty' }, errMsg(e))); });
  }

  function courseChecks(courses, selected, name) {
    return h('div', { class: 'checks' }, courses.map(function (c) {
      return h('label', { class: 'check' },
        h('input', { type: 'checkbox', name: name, value: c.courseId, checked: selected.indexOf(c.courseId) >= 0 }),
        c.subjectName + ' · Y' + c.year);
    }));
  }
  function checkedValues(root, name) {
    return Array.prototype.map.call(root.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; });
  }

  var LINE_RE = /^\s*([A-Za-zÁÉÍÓÚÑÜáéíóúñü]{1,4})[\s,;.\-]*(\d{1,2})\s*$/;

  function groupInfo(id) {
    return ((state.overview && state.overview.groups) || []).filter(function (g) { return g.groupId === id; })[0] || null;
  }
  /** Grupo que junta clases (Science 5º = 5A + 5B): sus alumnos son los de sus clases. */
  function isJoined(g) { return !!(g && g.members && g.members.length); }
  /** Nombre corto: "5A" o, para los grupos de Science, "Science 5º". */
  function gLabel(id, groups) {
    var g = (groups || (state.overview && state.overview.groups) || []).filter(function (x) { return x.groupId === id; })[0];
    return isJoined(g) ? 'Science ' + id.charAt(0) + 'º' : id;
  }
  /** ¿Es un alumno (de la clase `home`) del grupo `gid`? */
  function inGroup(home, gid, groups) {
    var g = (groups || (state.overview && state.overview.groups) || []).filter(function (x) { return x.groupId === gid; })[0];
    return isJoined(g) ? g.members.indexOf(home) >= 0 : home === gid;
  }
  /** Clases donde se crean alumnos (no los grupos de Science). */
  function homeGroups(ov) { return (ov.groups || []).filter(function (g) { return !isJoined(g); }); }
  /** Cursos de una clase: los suyos + los de los grupos de Science que la incluyen. */
  function homeCourses(gid) {
    var out = [];
    ((state.overview && state.overview.groups) || []).forEach(function (g) {
      if (g.groupId === gid || (g.members || []).indexOf(gid) >= 0) g.courseIds.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
    });
    return out;
  }

  function createForm(ov) {
    var groups = homeGroups(ov);
    var ok = function (id) { return groups.some(function (g) { return g.groupId === id; }); };
    var first = (ok(state.newGroup) && state.newGroup) || (ok(state.filterGroup) ? state.filterGroup : (groups[0] ? groups[0].groupId : ''));
    var group = h('select', { class: 't-select', id: 'grp' }, groups.map(function (g) {
      return h('option', { value: g.groupId, selected: g.groupId === first }, g.groupId + ' · ' + g.name);
    }));
    var checks = h('div', {}, courseChecks(ov.courses, homeCourses(first), 'newc'));
    var lines = h('textarea', { class: 't-textarea', id: 'lines', placeholder: 'JM 1\nAL 2\nPR 3' });
    var msg = h('div', { class: 't-help', aria: { live: 'polite' } });
    var btn = h('button', { class: 'btn t-btn', type: 'submit' }, 'Crear y generar PIN');

    group.addEventListener('change', function () {
      state.newGroup = group.value;
      var cs = homeCourses(group.value);
      Array.prototype.forEach.call(checks.querySelectorAll('input'), function (i) {
        i.checked = cs.indexOf(i.value) >= 0;
      });
    });

    var form = h('form', { class: 'card t-card' },
      h('h2', {}, 'Crear alumnos'),
      h('div', { class: 't-note' }, 'Solo iniciales y número de lista. El código de acceso será grupo + iniciales + número (ej. 3AJM07). Los PIN se muestran UNA vez: imprime las tarjetas.'),
      h('div', { class: 't-field' }, h('label', { for: 'grp' }, 'Grupo'), group,
        h('span', { class: 't-help' }, 'Las clases del grupo se marcan solas (5A → Science 5º, que junta 5A y 5B). Para añadir grupos, edita la pestaña Groups de la hoja.')),
      h('div', { class: 't-field' }, h('span', { class: 't-label' }, 'Clases asignadas'), checks),
      h('div', { class: 't-field' }, h('label', { for: 'lines' }, 'Alumnos (uno por línea: iniciales y número)'), lines),
      msg, btn);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var rows = [], bad = [];
      lines.value.split(/\r?\n/).forEach(function (l, i) {
        if (!l.trim()) return;
        var m = l.match(LINE_RE);
        var n = m ? parseInt(m[2], 10) : 0;
        if (m && n >= 1 && n <= 99) rows.push({ initials: m[1], listNumber: n });
        else bad.push(i + 1);
      });
      if (bad.length) { setMsg('Revisa las líneas: ' + bad.join(', ') + '. Formato: iniciales (1–4 letras) y número de lista del 1 al 99, por ejemplo "JM 7".', true); return; }
      if (!rows.length) { setMsg('Escribe al menos un alumno.', true); return; }
      var courseIds = checkedValues(checks, 'newc');
      if (!courseIds.length) { setMsg('Selecciona al menos una clase.', true); return; }
      btn.disabled = true;
      setMsg('Creando…', false);
      CQ.Api.admin('createStudents', { group: group.value, courseIds: courseIds, rows: rows }).then(function (res) {
        var parts = [];
        if (res.created.length) parts.push(res.created.length + (res.created.length === 1 ? ' alumno creado.' : ' alumnos creados.'));
        res.errors.forEach(function (x) {
          parts.push(x.code === 'DUPLICATE'
            ? 'No creado: el código ' + x.loginCode + ' ya existe (línea ' + x.line + ').'
            : 'No creado: línea ' + x.line + ' con datos no válidos (iniciales de 1 a 4 letras y número del 1 al 99).');
        });
        // El mensaje se guarda en el estado para que siga visible tras redibujar el panel.
        state.createMsg = { text: parts.join(' '), bad: res.errors.length > 0 };
        state.overview = null;
        shell();
        if (res.created.length) showCards(res.created, 'Alumnos nuevos');
      }).catch(function (err) { btn.disabled = false; setMsg(errMsg(err), true); });
    });

    function setMsg(text, bad) {
      msg.textContent = text;
      msg.style.color = bad ? 'var(--bad)' : '';
      msg.style.fontWeight = bad ? '600' : '';
    }
    if (state.createMsg) { setMsg(state.createMsg.text, state.createMsg.bad); state.createMsg = null; }
    return form;
  }

  /** Pestañas de grupo: Todos · 2A · 2B · 3A… (+ grupos antiguos sin letra, para reubicarlos). */
  function groupTabs(ov, current, onPick, counts) {
    var defined = (ov.groups || []).map(function (g) { return g.groupId; });
    var legacy = ov.students.map(function (s) { return s.group; })
      .filter(function (g, i, a) { return g && a.indexOf(g) === i && defined.indexOf(g) < 0; }).sort();
    var chip = function (id, label, extraCls) {
      return h('button', { class: 'g-chip' + (current === id ? ' on' : '') + (extraCls ? ' ' + extraCls : ''),
        aria: { pressed: String(current === id) }, onclick: function () { onPick(id); } },
        label, counts ? h('span', { class: 'g-count' }, String(counts(id))) : null);
    };
    // Clases primero; los grupos de Science (que juntan clases) aparte, en verde
    return h('div', { class: 'g-tabs', role: 'group', aria: { label: 'Grupo' } },
      chip('', 'Todos'),
      (ov.groups || []).filter(function (g) { return !isJoined(g); }).map(function (g) { return chip(g.groupId, g.groupId); }),
      (ov.groups || []).filter(isJoined).map(function (g) { return chip(g.groupId, gLabel(g.groupId, ov.groups), 'g-sci'); }),
      legacy.map(function (g) { return chip(g, g + ' ⚠', 'legacy'); }));
  }

  function studentTable(ov) {
    var count = function (g) { return ov.students.filter(function (s) { return !g || inGroup(s.group, g, ov.groups); }).length; };
    var tabs = groupTabs(ov, state.filterGroup, function (g) { state.filterGroup = g; if (groupInfo(g) && !isJoined(groupInfo(g))) state.newGroup = g; shell(); }, count);

    var list = ov.students.filter(function (s) { return !state.filterGroup || inGroup(s.group, state.filterGroup, ov.groups); });
    var printAll = h('button', { class: 'btn btn-ghost t-btn', onclick: function () {
      UI.toast('Los PIN no se guardan: para reimprimir una tarjeta usa "Nuevo PIN".');
    } }, 'Sobre los PIN');

    var legacyCount = ov.students.filter(function (s) { return !s.inGroupList; }).length;

    /* ── Selección múltiple para cambiar de grupo de golpe ── */
    state.selected = state.selected || {};
    var visibleIds = list.map(function (s) { return s.studentId; });
    Object.keys(state.selected).forEach(function (id) { if (visibleIds.indexOf(id) < 0) delete state.selected[id]; });
    var bulk = h('div', { class: 't-bulk' });
    var allBox = h('input', { type: 'checkbox', aria: { label: 'Seleccionar todos' } });
    allBox.addEventListener('change', function () {
      visibleIds.forEach(function (id) { if (allBox.checked) state.selected[id] = true; else delete state.selected[id]; });
      Array.prototype.forEach.call(tbody.querySelectorAll('input.sel'), function (c) { c.checked = allBox.checked; });
      drawBulk();
    });
    function drawBulk() {
      var ids = Object.keys(state.selected);
      U.clear(bulk);
      allBox.checked = ids.length > 0 && ids.length === visibleIds.length;
      allBox.indeterminate = ids.length > 0 && ids.length < visibleIds.length;
      if (!ids.length) {
        bulk.className = 't-bulk empty';
        bulk.appendChild(h('span', { class: 'muted' }, '☑ Marca varios alumnos (o todos con la casilla de arriba) para cambiarlos de grupo de una vez.'));
        return;
      }
      bulk.className = 't-bulk on';
      var dest = h('select', { class: 't-select t-select-sm', aria: { label: 'Grupo de destino' } },
        homeGroups(ov).map(function (g) { return h('option', { value: g.groupId, selected: g.groupId === state.bulkGroup }, g.groupId); }));
      dest.addEventListener('change', function () { state.bulkGroup = dest.value; });
      var go = h('button', { class: 'btn t-btn', onclick: function () { moveStudents(ids, dest.value, go); } }, 'Mover');
      bulk.appendChild(h('b', {}, ids.length + (ids.length === 1 ? ' seleccionado' : ' seleccionados')));
      bulk.appendChild(h('span', {}, '→ Mover al grupo'));
      bulk.appendChild(dest);
      bulk.appendChild(go);
      bulk.appendChild(h('button', { class: 'btn btn-ghost t-btn', onclick: function () {
        state.selected = {};
        Array.prototype.forEach.call(tbody.querySelectorAll('input.sel'), function (c) { c.checked = false; });
        drawBulk();
      } }, 'Quitar selección'));
    }

    var tbody = h('tbody', {}, list.map(function (s) {
      var tr = studentRow(s, ov);
      var box = h('input', { type: 'checkbox', class: 'sel', checked: !!state.selected[s.studentId], aria: { label: 'Seleccionar ' + s.displayName } });
      box.addEventListener('change', function () {
        if (box.checked) state.selected[s.studentId] = true; else delete state.selected[s.studentId];
        drawBulk();
      });
      tr.insertBefore(h('td', { class: 'sel-cell' }, box), tr.firstChild);
      return tr;
    }));
    var table = h('table', { class: 't-table' },
      h('thead', {}, h('tr', {}, h('th', { class: 'sel-cell' }, allBox),
        ['Alumno', 'Código', 'Grupo', 'Clases', 'Super 🌟', 'Último acceso', 'Estado', ''].map(function (t) {
          return h('th', t === 'Super 🌟' ? { title: 'Saldo real de super estrellas. Si es negativo, el alumno ve 0.' } : {}, t);
        }))),
      tbody);
    drawBulk();

    return h('div', { class: 'card t-card' },
      h('div', { class: 't-toolbar' }, h('h2', { class: 'grow', style: { margin: 0 } },
        (state.filterGroup ? (isJoined(groupInfo(state.filterGroup)) ? gLabel(state.filterGroup) + ' (' + groupInfo(state.filterGroup).members.join(' + ') + ')' : 'Grupo ' + state.filterGroup) : 'Alumnos') + ' (' + list.length + ')'), printAll),
      tabs,
      legacyCount ? h('div', { class: 't-note' }, '⚠ ' + legacyCount + ' alumno' + (legacyCount > 1 ? 's' : '') +
        ' sin grupo con letra. Márcalos y usa "Mover al grupo" (su código de acceso no cambia).') : null,
      superClassBar(ov),
      list.length ? bulk : null,
      list.length ? h('div', { class: 't-table-wrap' }, table) : h('p', { class: 'empty' }, 'No hay alumnos en este grupo.'));
  }

  /**
   * Cambia de grupo a uno o varios alumnos con UNA sola llamada y actualiza la tabla
   * con los datos que ya tenemos (sin volver a cargar todo el panel).
   */
  function moveStudents(ids, group, btn) {
    if (!ids.length || !group) return;
    if (btn) btn.disabled = true;
    CQ.Api.admin('setGroup', { studentIds: ids, group: group }).then(function (r) {
      var ov = state.overview;
      ids.forEach(function (id) {
        var s = ov && ov.students.filter(function (x) { return x.studentId === id; })[0];
        if (!s) return;
        s.group = r.group;
        s.inGroupList = true;
        if (r.courses && r.courses[id]) s.courses = r.courses[id];
      });
      state.selected = {};
      state.bulkGroup = r.group;
      state.board.data = null;
      UI.toast(r.count === 1 ? 'Movido al grupo ' + r.group + '.' : r.count + ' alumnos movidos al grupo ' + r.group + '.');
      shell();
    }).catch(function (e) { if (btn) btn.disabled = false; UI.toast(errMsg(e)); });
  }

  /** Profesor: lista de SU grupo (sin crear alumnos ni cambiar PIN/grupo), con super estrellas. */
  function teacherStudentTable(ov) {
    var joined = isJoined(groupInfo(state.group));
    var list = ov.students.filter(function (s) { return inGroup(s.group, state.group, ov.groups); })
      .sort(function (a, b) { return a.group === b.group ? a.listNumber - b.listNumber : (a.group < b.group ? -1 : 1); });
    var table = h('table', { class: 't-table' },
      h('thead', {}, h('tr', {}, ['Nº', 'Alumno', 'Código', 'Super 🌟', 'Último acceso'].map(function (t) { return h('th', {}, t); }))),
      h('tbody', {}, list.map(function (s) {
        return h('tr', {},
          h('td', { class: 'muted' }, (joined ? s.group + '-' : '') + String(s.listNumber)),
          h('td', { style: { fontWeight: 700 } }, s.displayName, s.isTest ? h('span', { class: 'pill pill-test' }, 'prueba') : null),
          h('td', { class: 'code' }, s.loginCode),
          superCell(s),
          h('td', { class: 'muted' }, U.fmtDate(s.lastLoginAt)));
      })));
    var btn = h('button', { class: 'btn btn-ghost t-btn', onclick: function () {
      UI.confirm('¿Quitar 1 super estrella a todo ' + gLabel(state.group) + '?',
        list.filter(function (s) { return !s.isTest; }).length + ' alumnos (sin cuentas de prueba). Quien se quede en negativo verá 0 en su perfil.', 'Quitar', 'Cancelar')
        .then(function (ok) {
          if (!ok) return;

  /* ───────────────────────── PIZARRA ───────────────────────── */
  var KIND_ORDER = ['review', 'game', 'practice', 'challenge', 'extra', 'homework'];
  var KIND_HEAD = { review: 'Review', game: 'Games', practice: 'Practice', challenge: 'Challenges', extra: 'Extra', homework: 'Homework' };
  var LEVEL_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

  /** "1 activity" / "5 activities" (la pizarra va en inglés). */
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  /** Color de cada tipo de actividad (bloques de English en la pizarra). */
  var KIND_STYLE = {
    review: { color: '#10B981', sub: 'Listen and repeat', icon: CQ.Icons.tpl.listen_learn },
    game: { color: '#F97316', sub: 'Play and learn the words', icon: CQ.Icons.gamepad },
    practice: { color: '#3B82F6', sub: 'Practise the grammar', icon: CQ.Icons.puzzle },
    challenge: { color: '#F59E0B', sub: 'Easy · Medium · Hard', icon: CQ.Icons.trophy },
    extra: { color: '#8B5CF6', sub: 'Fun mini-games', icon: CQ.Icons.gamepad },
    homework: { color: '#0F766E', sub: 'Check it together in class', icon: CQ.Icons.homework }
  };

  /** Color muy claro para el fondo de un bloque. */
  function tintOf(hex, k) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    if (isNaN(n)) return '#F8FAFC';
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) { return ('0' + Math.round(255 - (255 - v) * k).toString(16)).slice(-2); }).join('');
  }
  function darken(hex, amt) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    if (isNaN(n)) return hex;
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) { return ('0' + Math.max(0, v - amt).toString(16)).slice(-2); }).join('');
  }

  /**
   * Bloque de color de la pizarra: cabecera con el color del apartado (icono, título, subtítulo y
   * número de actividades) y, debajo, sus actividades sobre un fondo suave del mismo color.
   * Se puede plegar; la pizarra recuerda qué bloques dejaste plegados.
   */
  function secBlock(unitId, id, o, rows, count) {
    var key = unitId + '::' + id;
    var closed = !!(CQ.Store.local.get('cq_board_closed') || {})[key];
    var color = o.color || '#0E9F87';
    var bodyEl = h('div', { class: 'bsec-body', hidden: closed }, rows);
    var headEl = h('button', { class: 'bsec-head' + (closed ? '' : ' open'), aria: { expanded: String(!closed) },
      onclick: function () {
        var nowOpen = bodyEl.hidden;
        bodyEl.hidden = !nowOpen;
        headEl.classList.toggle('open', nowOpen);
        headEl.setAttribute('aria-expanded', String(nowOpen));
        var s = CQ.Store.local.get('cq_board_closed') || {};
        if (nowOpen) delete s[key]; else s[key] = true;
        CQ.Store.local.set('cq_board_closed', s);

  /* ───────────────────────── RULETA (sin equipos) ─────────────────────────
     Números de lista de los alumnos del curso (sin cuentas de prueba).
     Memoria de 1 hora en este ordenador: los números que salen desaparecen
     aunque se cambie de juego. Se reinicia al pasar 1 hora desde el primer
     giro o cuando han salido todos. */
  var Wheel = (function () {
    var HOUR = 60 * 60 * 1000;
    var COLORS = ['#7C5CFC', '#FF7A45', '#16A34A', '#2D8CFF', '#E8A100', '#EC4899', '#0EA5E9', '#DC2626'];
    var rotation = 0;

    function key() { return 'cq_wheel_' + state.board.courseId + (state.board.group ? '_' + state.board.group : ''); }
    function entries() {
      var list = (state.board.data && state.board.data.wheel) || [];
      var groups = list.map(function (e) { return e.group; }).filter(function (g, i, a) { return a.indexOf(g) === i; });
      return list.map(function (e) { return groups.length > 1 ? e.group + '-' + e.n : String(e.n); });
    }
    function load() {
      var s = CQ.Store.local.get(key()) || { start: 0, drawn: [] };
      if (s.start && Date.now() - s.start > HOUR) s = { start: 0, drawn: [] };
      var all = entries();
      s.drawn = (s.drawn || []).filter(function (l) { return all.indexOf(l) >= 0; });
      if (all.length && s.drawn.length >= all.length) s = { start: 0, drawn: [] };
      return s;
    }
    function save(s) { CQ.Store.local.set(key(), s); }
    function remaining() {
      var s = load();
      return entries().filter(function (l) { return s.drawn.indexOf(l) < 0; });
    }

    function pt(deg, r) { var a = deg * Math.PI / 180; return (r * Math.sin(a)).toFixed(2) + ' ' + (-r * Math.cos(a)).toFixed(2); }
    /** SVG de la ruleta. El grupo #wheel-rot es el que gira. */
    function svg(labels, big) {
      var n = labels.length, seg = 360 / n, out = '';
      labels.forEach(function (l, i) {
        var a0 = i * seg, a1 = (i + 1) * seg, col = COLORS[i % COLORS.length];
        out += n === 1 ? '<circle r="96" fill="' + col + '"/>' :
          '<path d="M0 0 L' + pt(a0, 96) + ' A96 96 0 ' + (seg > 180 ? 1 : 0) + ' 1 ' + pt(a1, 96) + ' Z" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>';
        var fs = n > 24 ? 9 : (n > 14 ? 12 : 16);
        out += '<text transform="rotate(' + (a0 + seg / 2).toFixed(2) + ') translate(0 -70)" text-anchor="middle" dominant-baseline="middle" font-family="Lexend, sans-serif" font-weight="800" font-size="' + fs + '" fill="#fff">' + l + '</text>';
      });
      return '<svg viewBox="-110 -118 220 228" aria-hidden="true">' +
        '<circle r="104" fill="#23264A"/>' +
        '<g class="wheel-rot" transform="rotate(' + rotation.toFixed(2) + ')">' + out + '</g>' +
        '<circle r="16" fill="#fff" stroke="#23264A" stroke-width="5"/>' +
        '<path d="M-13 -116 L13 -116 L0 -92 Z" fill="#FFC53D" stroke="#23264A" stroke-width="3" stroke-linejoin="round"/>' +
        (big ? '' : '') + '</svg>';
    }

    function mount(root) {
      var old = root.querySelector('.wheel-mini');
      if (old) old.remove();
      var left = remaining();
      if (!entries().length) return;
      root.appendChild(h('button', { class: 'wheel-mini', aria: { label: 'Spin the wheel. ' + left.length + ' students left.' }, onclick: function () { open(root); } },
        h('span', { class: 'wheel-mini-svg', svg: svg(left) }),
        h('span', { class: 'wheel-mini-count' }, left.length + ' left')));
    }

    function resetInfo(s) {
      if (!s.start) return 'The wheel has all the numbers.';
      var t = new Date(s.start + HOUR);
      return 'Resets at ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
    }

    function open(root) {
      var labels = remaining();
      if (!labels.length) return;
      var s0 = load();
      var wheelBox = h('div', { class: 'wheel-big', svg: svg(labels, true) });
      var result = h('div', { class: 'wheel-result', aria: { live: 'assertive' } });
      var info = h('p', { class: 'wheel-info' }, labels.length + ' students left · ' + resetInfo(s0));
      var closeBtn = h('button', { class: 'btn btn-lg', disabled: true, onclick: close }, 'Close');
      var resetBtn = h('button', { class: 'link-btn', onclick: function () { save({ start: 0, drawn: [] }); close(); } }, 'Reset wheel');
      var stage = h('div', { class: 'wheel-stage' }, wheelBox, result, info, h('div', { class: 'row-actions' }, closeBtn), resetBtn);
      var ov = h('div', { class: 'wheel-overlay' }, stage);
      root.appendChild(ov);

      function close() {
        stage.classList.add('out');
        ov.classList.add('out');
        setTimeout(function () { ov.remove(); mount(root); }, 380);
      }

      setTimeout(function () { spin(labels, wheelBox.querySelector('.wheel-rot'), done); }, 750);

      function done(label) {
        var s = load();
        if (!s.start) s.start = Date.now();
        s.drawn.push(label);
        var all = entries();
        var finished = s.drawn.length >= all.length;
        save(finished ? { start: 0, drawn: [] } : s);
        CQ.Sound.ding();
        CQ.Effects.play('fx-confetti');
        U.clear(result);
        result.appendChild(h('div', { class: 'wheel-num pop' }, label));
        result.appendChild(h('div', { class: 'wheel-who' }, 'Number ' + label + ', it’s your turn!'));
        info.textContent = finished ? 'Everyone has played! The wheel starts again with all the numbers.'
          : (all.length - s.drawn.length) + ' students left · ' + resetInfo(s);
        closeBtn.disabled = false;
        closeBtn.focus();
      }
    }

    function spin(labels, rotEl, cb) {
      var n = labels.length, seg = 360 / n;
      var k = Math.floor(Math.random() * n);
      var target = k * seg + seg / 2 + (Math.random() - 0.5) * seg * 0.6;   // ángulo del segmento k
      var from = rotation;
      var end = ((360 - target) % 360 + 360) % 360;
      var delta = 360 * 6 + ((end - (from % 360)) % 360 + 360) % 360;
      var dur = 5200, t0 = null, lastSeg = null;
      function ease(t) { return 1 - Math.pow(1 - t, 4); }
      function frame(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, (t - t0) / dur);
        rotation = from + delta * ease(p);
        rotEl.setAttribute('transform', 'rotate(' + rotation.toFixed(2) + ')');
        var under = Math.floor((((360 - rotation % 360) % 360) + 360) % 360 / seg);
        if (under !== lastSeg) { if (lastSeg !== null) CQ.Sound.tick(); lastSeg = under; }
        if (p < 1) requestAnimationFrame(frame);
        else { rotation = rotation % 360; cb(labels[k]); }
      }
      requestAnimationFrame(frame);
    }

    return { mount: mount };
  })();

    var homeworkOn = CQ.Store.local.get('cq_rw_homework') !== false;

    drawRating();

    /* ── Paso 1: valorar los apartados ── */
    function activeParts() { return RW_PARTS.filter(function (p) { return p.id !== 'homework' || homeworkOn; }); }

    function drawRating() {
      U.clear(panel);
      var toggle = h('button', { class: 'rw-toggle' + (homeworkOn ? ' on' : ''), aria: { pressed: String(homeworkOn) },
        onclick: function () {
          homeworkOn = !homeworkOn;

        h('span', { class: 'rw-toggle-dot' }), 'Homework today: ' + (homeworkOn ? 'YES' : 'NO'));

      var sizes = [42, 52, 62, 74, 88];
      var word = h('span', { class: 'rw-word' }, scores[part.id] ? RW_WORD[scores[part.id]] : ' ');
      var stars = sizes.map(function (s, i) {
        var b = h('button', { class: 'rw-star', style: { width: s + 'px', height: s + 'px' }, aria: { label: part.label + ': ' + (i + 1) + (i ? ' stars' : ' star') },
          onclick: function () { pick(i + 1); } }, h('span', { svg: CQ.Icons.star, style: { display: 'flex' } }));
        b.addEventListener('pointerenter', function () { paint(i + 1, true); });

    function drawFinal(r) {
      U.clear(panel);
      var avg = r.rating;
      var sizes = [86, 104, 124, 146, 170];
      var big = sizes.map(function (s) {
        var fill = h('span', { class: 'fs-fill', svg: CQ.Icons.star, style: { clipPath: 'inset(0 100% 0 0)' } });
        return { el: h('span', { class: 'fill-star', style: { width: s + 'px', height: s + 'px' } }, h('span', { class: 'fs-base', svg: CQ.Icons.star }), fill), fill: fill };
      });
      var num = h('div', { class: 'rw-avg' }, '0.0');
      var title = h('p', { class: 'rw-label' }, ' ');
      var msg = h('p', { class: 'rw-sub' }, ' ');
      var breakdown = h('p', { class: 'rw-breakdown' }, RW_PARTS.map(function (p) {
        var v = r.scores[p.id];
        return p.icon + ' ' + p.label + ' ' + (v ? v + '★' : '—');
      }).join('   ·   '));
      var closeBtn = h('button', { class: 'btn btn-lg', style: { visibility: 'hidden' }, onclick: closeBoard }, 'Close');
      panel.appendChild(h('div', { class: 'rw-kicker' }, (state.board.group ? state.board.group + ' · ' : '') + course.title));
      panel.appendChild(h('h1', {}, 'Our class today'));
      panel.appendChild(h('div', { class: 'rw-stars big' }, big.map(function (b) { return b.el; })));
      panel.appendChild(num);
      panel.appendChild(title);
      panel.appendChild(msg);
      panel.appendChild(breakdown);
      panel.appendChild(h('div', { class: 'row-actions' }, closeBtn));

      var perStar = 700, total = avg * perStar, t0 = null, lastFull = -1;
      function frame(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(avg, (t - t0) / perStar);
        big.forEach(function (b, i) {
          var f = Math.max(0, Math.min(1, p - i));
          b.fill.style.clipPath = 'inset(0 ' + ((1 - f) * 100).toFixed(1) + '% 0 0)';
        });
        var full = Math.floor(p + 1e-6) - 1;
        if (full > lastFull) { for (var k = lastFull + 1; k <= full; k++) { CQ.Sound.rise(k); big[k].el.classList.add('pop'); } lastFull = full; }
        num.textContent = p.toFixed(1);
        if ((t - t0) < total) { requestAnimationFrame(frame); return; }
        num.textContent = avg.toFixed(1);
        title.textContent = rwFinalText(avg);
        title.className = 'rw-label pop';
        if (r.superStars > 0) {
          superCinematic(function () {
            msg.textContent = 'Everyone gets a SUPER STAR! 🌟 Spend it in the Star Shop.';
            CQ.Effects.play('fx-goldrain');
            closeBtn.style.visibility = '';
          });
        } else {
          CQ.Sound.ding();
          if (avg >= 3.5) CQ.Effects.play('fx-stars');
          msg.textContent = 'Get 5 stars in everything to win a super star! 💪';
          closeBtn.style.visibility = '';
        }
        if (r.replaced) breakdown.textContent += '   (updated)';
      }
      requestAnimationFrame(frame);
    }

    /** Cinemática "SUPER CLASS!" (solo con 5 en todo). */
    function superCinematic(done) {
      var reduced = false;
      try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      CQ.Sound.fanfare();
      if (reduced) { done(); return; }
      var cine = h('div', { class: 'rw-cine', aria: { hidden: 'true' }, onclick: function () { end(); } },
        h('div', { class: 'rw-rays' }),
        h('div', { class: 'rw-bigstar', svg: CQ.Icons.star }),
        h('div', { class: 'rw-cine-text' }, 'SUPER CLASS!'),
        h('div', { class: 'rw-cine-sub' }, 'Five stars in everything!'));
      screen.appendChild(cine);
      setTimeout(function () { CQ.Effects.play('fx-stars'); }, 500);
      var timer = setTimeout(end, 3800);
      function end() {
        clearTimeout(timer);
        if (!cine.parentNode) return;
        cine.classList.add('out');
        setTimeout(function () { cine.remove(); done(); }, 450);
      }
    }
  }

  /**
   * Arranque del panel.
   *  · Página del administrador (?view=teacher): role 'admin', arranca sola.
   *  · Página de alumnos → "Teacher login": js_student llama a
   *    CQ.TeacherApp.start({ role: 'teacher', me, onLogout }).

  function start(opts) {
    opts = opts || {};
    state = { role: opts.role || 'admin', me: opts.me || null, group: '', onLogout: opts.onLogout || null,
      tab: 'students', overview: null, filterGroup: '', board: { courseId: '', data: null, teams: 2 }, results: { courseId: '' } };
    CQ.Api.mode = state.role === 'teacher' ? 'teacher' : 'admin';
    document.body.classList.add('t-body');
    document.documentElement.lang = 'es';
    window.scrollTo(0, 0);
    shell();
  }
  CQ.TeacherApp = { start: start };
  if (BOOT.view === 'teacher') start({ role: 'admin' });
})();

<script>

(function () {

  var MAX = 5;

  var MSG = {

    LOCKED: 'Too many tries. Please ask your teacher for help.',
    ACCOUNT_DISABLED: 'Your account is paused. Please ask your teacher.',

    ALREADY_OWNED: 'You already have this!'
  };
  function msgFor(err) { return MSG[(err && err.code) || 'SERVER'] || MSG.SERVER; }

  var SECTIONS = {
    vocabulary: { label: 'Vocabulary', sub: 'Learn the words', icon: CQ.Icons.book },
    grammar: { label: 'Grammar', sub: 'Build your sentences', icon: CQ.Icons.puzzle },
    challenge: { label: 'Challenges', sub: 'Easy · Medium · Hard', icon: CQ.Icons.trophy },
    extra: { label: 'Extra', sub: 'Fun mini-games', icon: CQ.Icons.gamepad },
    homework: { label: 'Homework', sub: 'From your teacher', icon: CQ.Icons.homework },
    videos: { label: 'Videos', sub: 'Watch and learn', icon: CQ.Icons.video },
    lab: { label: '3D Lab', sub: 'Explore in 3D', icon: CQ.Icons.cube }
  };
  // Homework va primero: si el profesor ha publicado deberes, es lo primero que ve el alumno.
  var SECTION_ORDER = ['homework', 'vocabulary', 'grammar', 'challenge', 'extra'];

  /**
   * Science: cada unidad define sus apartados temáticos (Cells, Senses…, Final Review).
   * secInfo → { label, sub, icon(svg), color, custom } del apartado de esa unidad.
   */
  function secInfo(u, id) {
    var s = (u && u.sections || []).filter(function (x) { return x.id === id; })[0];

  /** Las simulaciones 3D no tienen nota: no cuentan para estrellas ni "hechas". */
  function graded(acts) { return acts.filter(function (a) { return a.kind !== 'simulation'; }); }
  var LEVELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  var LEVEL_HINT = { easy: 'A good start', medium: 'Getting harder', hard: 'For experts!' };

  var state = { student: null, home: null, profile: null, catalog: [], courses: {}, runner: null, shopMain: null };

  /* ───────────────────────── cola de envíos pendientes ───────────────────────── */
  var Outbox = {

      l.push({ studentId: studentId, payload: payload, at: Date.now() });
      Outbox.save(l);

    flush: function (studentId) {
      var mine = Outbox.list().filter(function (e) { return e.studentId === studentId; });

      return mine.reduce(function (p, e) {
        return p.then(function () {

  /* ───────────────────────── sesión e inactividad ───────────────────────── */

  function renderWelcome() {

  /** Si la clase ha ganado super estrellas desde la última vez, se celebra al entrar. */
  function celebrateSuperStars(sid, p) {
    if (!p || !p.superEarned) return;
    var key = 'cq_super_' + sid;
    var seen = CQ.Store.local.get(key) || 0;
    if (p.superEarned <= seen) return;
    var gained = p.superEarned - seen;
    CQ.Store.local.set(key, p.superEarned);
    setTimeout(function () {
      CQ.Effects.play('fx-goldrain');
      var m = UI.modal({
        className: 'modal-choice',
        body: [
          h('div', { class: 'unlock-art', svg: CQ.Icons.superstar }),
          h('div', { class: 'kicker kicker-super' }, 'Class rewards'),
          h('h2', {}, 'Your class earned ' + gained + ' super star' + (gained > 1 ? 's' : '') + '!'),
          h('p', {}, 'Great teamwork! Use super stars to get special things in the Star Shop.'),
          h('div', { class: 'row-actions' },
            h('button', { class: 'btn btn-ghost', onclick: function () { m.close(); } }, 'OK'),
            h('button', { class: 'btn btn-super', onclick: function () { m.close(); CQ.Nav.go({ name: 'shop' }); } }, superIcon(), 'Star Shop'))
        ]
      });
    }, 600);
  }

  /* ───────────────────────── COURSE: Unit N - Title + 3 secciones ───────────────────────── */
  function renderCourse(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId, true).then(function (data) {
      U.clear(main);
      var c = data.course;
      var multi = !state.home || state.home.courses.length > 1;
      main.appendChild(hero({
        color: c.color, art: c.icon,
        back: multi ? backButton('My classes', { name: 'home' }) : null,
        title: c.subjectName, sub: 'Year ' + c.year,
        action: h('button', { class: 'btn btn-white', onclick: function () { CQ.Nav.go({ name: 'progress', courseId: c.courseId }); } },
          h('span', { svg: CQ.Icons.chart, style: { display: 'flex' } }), 'My Progress')
      }));

      // Deberes pendientes de este curso (también aquí, porque con una sola clase no se pasa por la portada).
      var pendingHw = [];
      data.units.forEach(function (u) {
        u.activities.forEach(function (a) {
          if (a.section === 'homework' && !(a.progress && a.progress.completed)) {
            pendingHw.push({ activityId: a.activityId, courseId: c.courseId, unitId: u.unitId, title: a.title });
          }
        });
      });
      if (pendingHw.length) main.appendChild(homeworkBanner(pendingHw));

      data.units.forEach(function (u) {
        var gacts = graded(u.activities);
        var done = doneCount(gacts);
        main.appendChild(h('div', { class: 'unit-head' },
          h('div', { class: 'unit-art', svg: CQ.Art.svg(u.icon) }),
          h('h2', {}, unitLabel(u)),
          h('div', { class: 'unit-meta' },
            UI.bar(done, gacts.length),
            h('span', {}, done + '/' + gacts.length),
            h('span', { class: 'stars-count' }, starIcon(), starCount(gacts) + ' / ' + gacts.length * MAX))));
        var grid = h('div', { class: 'grid grid-3' });
        sectionOrder(u).forEach(function (sec, i) {
          var acts = u.activities.filter(function (a) { return a.section === sec; });
          if (!acts.length) return;
          grid.appendChild(sec === 'lab' ? labCard(c.courseId, u, acts, i) : sectionCard(c.courseId, u, sec, acts, i));
        });
        if (u.videos && u.videos.length) grid.appendChild(videosCard(c.courseId, u));
        main.appendChild(grid);
      });
      if (!data.units.length) main.appendChild(h('p', { class: 'empty card' }, 'New activities are coming soon!'));
    }).catch(function (err) { showError(main, err, function () { renderCourse(r); }); });
  }

  /* ───────────────────────── SECTION ───────────────────────── */
  function renderSection(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId).then(function (data) {
      var u = data.units.filter(function (x) { return x.unitId === r.unitId; })[0];
      var S = u && secInfo(u, r.section);
      if (!u || !S) { showError(main, { code: 'NOT_FOUND' }); return; }
      if (r.section === 'videos') { renderVideos(main, data, u, r); return; }
      if (r.section === 'lab') { renderLab(main, data, u, r); return; }
      var acts = u.activities.filter(function (a) { return a.section === r.section; });
      U.clear(main);
      var A = secAttrs(S, r.section, 'hero-sec');
      var hr = hero({
        cls: A.cls, art: u.icon,
        back: backButton(data.course.subjectName, { name: 'course', courseId: r.courseId }),
        kicker: unitLabel(u), title: S.label,
        sub: doneCount(acts) + ' of ' + acts.length + ' activities done'
      });
      Object.keys(A.style).forEach(function (k) { hr.style.setProperty(k, A.style[k]); });
      if (S.custom) {
        // El dibujo del apartado (célula, ojo, cerebro…) en lugar del de la unidad
        var art = hr.querySelector('.hero-art');
        if (art) art.innerHTML = S.icon;
      }
      main.appendChild(hr);
      if (S.custom) {
        // Science: un módulo de aprendizaje → Learn (descubrir) · Practise (entender) · Check (aplicar) · Games
        var STAGES = [['learn', 'Learn', 'Look, listen and discover', ['review']],
          ['practise', 'Practise', 'Understand and connect', ['game', 'practice']],
          ['check', 'Check', 'Show what you know', ['challenge']],
          ['games', 'Games', 'Play with the words', ['extra']]];
        STAGES.forEach(function (st) {
          var list = acts.filter(function (a) { return st[3].indexOf(a.kind) >= 0; });
          if (!list.length) return;
          main.appendChild(h('div', { class: 'level-head stage-head' },
            h('span', { class: 'stage-chip st-' + st[0] }, st[1]), h('span', { class: 'muted' }, st[2])));
          var g = h('div', { class: 'grid' });
          list.forEach(function (a, i) { g.appendChild(activityTile(r, a, i, u)); });
          main.appendChild(g);
        });
        // Si el apartado tiene una simulación 3D relacionada: acceso directo al laboratorio
        var sim = S.sim && u.activities.filter(function (a) { return a.section === 'lab' && a.simId === S.sim; })[0];
        if (sim) {
          main.insertBefore(h('button', { class: 'lab-banner', onclick: function () {
            CQ.Nav.go({ name: 'sim', courseId: r.courseId, unitId: u.unitId, section: 'lab', simId: sim.simId, title: sim.title });
          } },
            h('span', { class: 'lab-banner-icon', svg: CQ.Icons.cube }),
            h('span', { class: 'grow' }, h('b', {}, 'See it in 3D! '), sim.title),
            h('span', { class: 'play' }, 'Explore', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } }))), hr.nextSibling);
        }
      } else if (r.section === 'challenge') {
        LEVEL_ORDER.forEach(function (lv) {
          var list = acts.filter(function (a) { return a.level === lv; });
          if (!list.length) return;
          main.appendChild(h('div', { class: 'level-head' },
            h('span', { class: 'level-chip lv-' + lv }, LEVELS[lv]),
            h('span', { class: 'muted' }, LEVEL_HINT[lv])));
          var g = h('div', { class: 'grid' });
          list.forEach(function (a, i) { g.appendChild(activityTile(r, a, i)); });
          main.appendChild(g);
        });
      } else {
        var grid = h('div', { class: 'grid' });
        acts.forEach(function (a, i) { grid.appendChild(activityTile(r, a, i)); });
        main.appendChild(grid);
      }
    }).catch(function (err) { showError(main, err, function () { renderSection(r); }); });
  }

  function activityTile(r, a, i, u) {
    var p = a.progress;
    var label = a.locked ? 'Locked' : (p ? 'Play again' : 'Play');
    var A = secAttrs(u ? secInfo(u, a.section) : null, a.section, 'tile tile-act' + (a.locked ? ' locked' : ''));
    return h('button', {
      class: A.cls,
      style: Object.assign({ animationDelay: ((i || 0) * 50) + 'ms' }, A.style),
      aria: { label: a.title + '. ' + label + (p ? '. ' + p.bestStars + ' of 5 stars' : '') },
      onclick: function () {
        if (a.locked) { UI.toast(MSG.LOCKED_ACTIVITY); return; }
        CQ.Nav.go({ name: 'play', courseId: r.courseId, unitId: a.unitId, section: a.section, activityId: a.activityId });
      }
    },
      h('div', { class: 'top' },
        h('div', { class: 'tpl-icon', svg: a.kind === 'extra' ? CQ.Icons.gamepad : (a.section === 'homework' ? CQ.Icons.homework : (CQ.Icons.tpl[a.template] || CQ.Icons.tpl.multiple_choice)) }),
        a.section === 'challenge' ? h('span', { class: 'level-chip small lv-' + a.level }, LEVELS[a.level])
          : (a.section === 'homework' ? (p && p.completed ? h('span', { class: 'hw-done' }, '✔ Done') : h('span', { class: 'hw-new' }, 'To do')) : UI.kindBadge(a.kind))),
      h('h3', {}, a.title),
      h('div', { class: 'foot' },
        UI.stars(p ? p.bestStars : 0, MAX),
        h('span', { class: 'play' }, h('span', { svg: a.locked ? CQ.Icons.lock : CQ.Icons.play, style: { display: 'flex' } }), label)));
  }

  /** A dónde vuelve el alumno al salir de una actividad: a la sección desde la que entró. */
  function backOf(r) {
    return r.section ? { name: 'section', courseId: r.courseId, unitId: r.unitId, section: r.section } : { name: 'course', courseId: r.courseId };
  }

  /* ───────────────────────── PLAY ───────────────────────── */
  function renderPlay(r) {
    U.clear(app);
    app.appendChild(UI.loading());
    CQ.Api.student('openActivity', { activityId: r.activityId }).then(function (data) {
      var startedAt = Date.now();
      state.runner = CQ.Engine.run({
        root: app,
        activity: data.activity,
        mode: 'student',
        onExit: function () { state.runner = null; CQ.Nav.go(backOf(r)); },
        onFinish: function (result) {
          state.runner = null;
          submit(r, data, result, Math.round((Date.now() - startedAt) / 1000));
        }
      });
    }).catch(function (err) {
      var main = page();
      showError(main, err, function () { renderPlay(r); });
    });
  }

  function submit(r, opened, result, clientDurationSec) {
    U.clear(app);
    app.appendChild(h('div', { class: 'loading' }, h('div', { style: { textAlign: 'center' } },
      h('div', { class: 'spinner', style: { margin: '0 auto 16px' } }), h('p', { style: { fontSize: '22px', fontWeight: '600' } }, 'Saving your stars…'))));
    var payload = {
      attemptId: opened.attemptId,
      activityId: opened.activity.activityId,
      responses: result.responses,
      clientDurationSec: clientDurationSec
    };
    var sid = state.student && state.student.studentId;
    CQ.Api.student('submitAttempt', payload).then(function (res) {
      if (res.profile) state.profile = res.profile;
      patchProgress(r.courseId, opened.activity.activityId, res);
      renderResults(r, opened.activity, result, res, true);
    }).catch(function (err) {
      if (err && (err.code === 'NETWORK' || err.code === 'SERVER' || err.code === 'SESSION_EXPIRED')) {
        if (sid) Outbox.add(sid, payload);
        if (err.code === 'SESSION_EXPIRED') { endSession('Please log in again. Your answers are safe.'); return; }
        renderResults(r, opened.activity, result, null, false);
      } else {
        showError(page(), err);
      }
    });
  }

  function patchProgress(courseId, activityId, res) {
    state.home = null;
    var c = state.courses[courseId];
    if (!c) return;
    c.units.forEach(function (u) {
      u.activities.forEach(function (a) {
        if (a.activityId !== activityId) return;
        var p = a.progress || { attempts: 0, bestScore: 0, bestStars: 0, lastScore: 0, completed: false };
        p.attempts = res.attemptNumber;
        p.bestScore = Math.max(p.bestScore, res.score);
        p.bestStars = Math.max(p.bestStars, res.stars);
        p.lastScore = res.score;
        p.completed = p.completed || res.status === 'completed';
        a.progress = p;
      });
    });
  }

  /* ───────────────────────── RESULTS ───────────────────────── */
  var TITLES = ['Keep practising!', 'Good try!', 'Nice work!', 'Great job!', 'Super!', 'Amazing!'];

  function renderResults(r, activity, local, res, saved) {
    var main = page();
    var stars, correct, total;
    if (res) { stars = res.stars; correct = res.correct; total = res.total; }
    else {
      total = local.local.total;
      correct = local.local.correct;
      stars = Grading.starsFor(total ? Math.round(correct / total * 100) : 0);
    }
    var cu = state.courses[r.courseId];
    var uu = cu && cu.units.filter(function (x) { return x.unitId === r.unitId; })[0];
    var S = (uu ? secInfo(uu, r.section) : SECTIONS[r.section]) || { label: 'the unit' };
    var box = h('section', { class: 'results card', aria: { live: 'polite' } },
      UI.stars(stars, MAX, 'lg'),
      h('h1', {}, TITLES[stars] || TITLES[0]),
      h('p', { class: 'score' }, 'You got ' + correct + ' out of ' + total + ' right.'),
      res && res.isPersonalBest ? h('span', { class: 'pb' }, '🏆 New personal best!') : null,
      res && res.firstTime ? h('span', { class: 'muted' }, 'First time done!') : null,
      res && !res.firstTime ? h('span', { class: 'muted' }, 'Attempt ' + res.attemptNumber) : null,
      !saved ? h('p', { class: 'pb', style: { background: '#FDECEC', color: '#A4282C' } }, 'We could not save yet. We will try again later.') : null);

    if (saved && state.profile && state.profile.shopBadge) {
      box.appendChild(h('button', { class: 'shop-hint', onclick: function () { CQ.Nav.go({ name: 'shop' }); } },
        h('span', { svg: CQ.Icons.shop, style: { display: 'flex', width: '26px' } }),
        'You can buy something new in the Star Shop!'));
    }

    if (res && activity.config.feedback === 'end') box.appendChild(reviewList(activity, local.responses, res.review));

    // Siguiente actividad de la misma sección
    var next = null;
    var course = state.courses[r.courseId];
    if (course) {
      var unit = course.units.filter(function (u) { return u.unitId === r.unitId; })[0];
      if (unit) {
        var list = unit.activities.filter(function (a) { return !r.section || a.section === r.section; });
        var idx = list.map(function (a) { return a.activityId; }).indexOf(activity.activityId);
        next = list.slice(idx + 1).filter(function (a) { return !a.locked; })[0] || null;
      }
    }
    box.appendChild(h('div', { class: 'row-actions', style: { marginTop: '14px' } },
      h('button', { class: 'btn btn-ghost btn-lg', onclick: function () { CQ.Nav.go(r, true); } }, 'Play again'),
      next ? h('button', { class: 'btn btn-lg', onclick: function () { CQ.Nav.go({ name: 'play', courseId: r.courseId, unitId: r.unitId, section: r.section, activityId: next.activityId }, true); } },
        'Next activity', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } })) : null));
    box.appendChild(h('button', { class: 'back-btn', style: { marginTop: '6px' }, onclick: function () { CQ.Nav.go(backOf(r)); } },
      h('span', { svg: CQ.Icons.back, style: { display: 'flex' } }), 'Back to ' + S.label));
    main.appendChild(box);
    if (stars === MAX) UI.announce('Amazing! Five stars!');
    var fx = state.profile && state.profile.effect;
    if (saved && fx && fx !== 'fx-none') setTimeout(function () { CQ.Effects.play(fx); }, 350);
  }

  function reviewList(activity, responses, review) {
    var byItem = {};
    activity.items.forEach(function (it) { byItem[it.itemId] = it; });
    var mine = {};
    responses.forEach(function (x) { mine[x.itemId] = x.response; });
    var list = h('div', { class: 'review' }, h('h2', { class: 'section-title', style: { margin: '10px 0 4px' } }, 'Let’s check'));
    review.forEach(function (rv, n) {
      var it = byItem[rv.itemId];
      if (!it) return;
      list.appendChild(h('div', { class: 'review-row' },
        h('span', { class: 'mark ' + (rv.correct ? 'ok' : 'no') }, rv.correct ? '✓' : '✗'),
        h('div', { style: { flex: 1 } },
          h('div', { style: { fontWeight: 600 } }, (it.prompt || ('Sentence ' + (n + 1))).replace(/_{2,}/, '…')),
          h('div', { class: 'muted' }, 'You: ' + (mine[rv.itemId] || '—') + (rv.correct ? '' : '  ·  Answer: ' + rv.answer)))));
    });
    return list;
  }

  /* ───────────────────────── MY PROGRESS ───────────────────────── */
  function renderProgress(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId, true).then(function (data) {
      U.clear(main);
      var acts = [];
      data.units.forEach(function (u) { acts = acts.concat(graded(u.activities)); });
      var done = doneCount(acts);
      var stars = starCount(acts);
      var perfect = acts.filter(function (a) { return a.progress && a.progress.bestStars === MAX; }).length;
      var unitDone = data.units.some(function (u) { return graded(u.activities).every(function (a) { return a.progress && a.progress.completed; }); });
      var champ = acts.some(function (a) { return a.section === 'challenge' && a.progress && a.progress.bestStars >= 4; });

      main.appendChild(hero({
        cls: 'hero-progress', art: 'mascot',
        back: backButton(data.course.subjectName, { name: 'course', courseId: r.courseId }),
        kicker: data.course.subjectName + ' · Year ' + data.course.year, title: 'My Progress'
      }));

      main.appendChild(h('div', { class: 'stat-row' },
        stat('st-stars', CQ.Icons.star, stars + ' / ' + acts.length * MAX, 'Stars'),
        stat('st-done', CQ.Icons.check, done + ' / ' + acts.length, 'Activities done'),
        stat('st-perfect', CQ.Icons.sparkle, String(perfect), 'Perfect scores (5 stars)')));

      var medals = [
        ['First steps', 'Finish your first activity', done >= 1, 'trophy'],
        ['Star collector', 'Collect 20 stars', stars >= 20, 'star'],
        ['Perfect!', 'Get 5 stars in an activity', perfect >= 1, 'star'],
        ['Unit master', 'Finish every activity in a unit', unitDone, 'trophy'],
        ['Challenge champion', 'Get 4 stars in a challenge', champ, 'trophy']
      ];
      main.appendChild(h('h2', { class: 'section-title' }, 'My medals'));
      var mg = h('div', { class: 'grid-sm' });
      medals.forEach(function (m) {
        mg.appendChild(h('div', { class: 'medal' + (m[2] ? ' on' : ' off') },
          h('div', { class: 'disc', svg: CQ.Icons[m[3]] }),
          h('b', {}, m[0]),
          h('span', {}, m[2] ? 'Unlocked!' : m[1])));
      });
      main.appendChild(mg);

      data.units.forEach(function (u) {
        var ga = graded(u.activities);
        var ud = doneCount(ga);
        var card = h('div', { class: 'card progress-card' },
          h('div', { class: 'progress-card-head' },
            h('h3', {}, unitLabel(u)), UI.bar(ud, ga.length), h('span', { class: 'muted' }, ud + '/' + ga.length)));
        sectionOrder(u).forEach(function (sec) {
          var list = graded(u.activities).filter(function (a) { return a.section === sec; });
          if (!list.length) return;
          var SI = secInfo(u, sec);
          var A = secAttrs(SI, sec, 'progress-sec');
          card.appendChild(h('div', { class: A.cls, style: A.style }, h('span', { svg: SI.icon, style: { display: 'flex', width: '22px' } }), SI.label));
          list.forEach(function (a) {
            card.appendChild(h('div', { class: 'list-row' },
              h('span', { class: 'name' }, a.title),
              a.section === 'challenge' ? h('span', { class: 'level-chip small lv-' + a.level }, LEVELS[a.level]) : UI.kindBadge(a.kind),
              UI.stars(a.progress ? a.progress.bestStars : 0, MAX)));
          });
        });
        main.appendChild(card);
      });
    }).catch(function (err) { showError(main, err, function () { renderProgress(r); }); });

    function stat(cls, icon, n, l) {
      return h('div', { class: 'stat ' + cls }, h('span', { class: 'stat-icon', svg: icon }), h('div', {}, h('div', { class: 'n' }, n), h('div', { class: 'l' }, l)));
    }
  }

  /* ───────────────────────── PERFIL (ventana) ───────────────────────── */
  function openProfile() {
    var p = state.profile;
    if (!p) return;
    var fresh = (p.newItems || []).slice();
    var m;
    var owned = function (type) {
      return state.catalog.filter(function (i) { return i.type === type && p.owned.indexOf(i.id) >= 0; });
    };
    var avatars = h('div', { class: 'owned-row' }, owned('avatar').map(function (i) {
      return h('button', {
        class: 'mini-av' + (p.avatar === i.id ? ' on' : ''), aria: { label: 'Use avatar ' + i.name, pressed: String(p.avatar === i.id) },
        onclick: function () { equip(i, function () { m.close(); openProfile(); }); }
      }, h('span', { class: 'mini-art', svg: avatarSvg(i.id) }), fresh.indexOf(i.id) >= 0 ? h('span', { class: 'new-tag' }, 'NEW') : null);
    }));
    var effects = h('div', { class: 'owned-row' }, owned('effect').map(function (i) {
      return h('button', {
        class: 'fx-chip' + (p.effect === i.id ? ' on' : ''), aria: { pressed: String(p.effect === i.id) },
        onclick: function () { equip(i, function () { m.close(); openProfile(); }); }
      }, h('span', { class: 'fx-chip-art', svg: CQ.Art.svg(i.id) }), i.name, fresh.indexOf(i.id) >= 0 ? h('span', { class: 'new-tag' }, 'NEW') : null);
    }));
    m = UI.modal({
      className: 'profile-modal',
      body: [
        h('div', { class: 'profile-top' }, h('div', { class: 'profile-avatar', svg: avatarSvg(p.avatar) })),
        h('h2', {}, state.student.displayName),
        h('div', { class: 'profile-stats' },
          h('div', { class: 'pstat' },
            h('div', { class: 'pnum' }, starIcon(), p.starsEarned + ' / ' + p.starsMax),
            h('div', { class: 'plabel' }, 'Stars earned'),
            UI.bar(p.starsEarned, p.starsMax)),
          h('div', { class: 'pstat pstat-gold' },
            h('div', { class: 'pnum' }, starIcon(), String(p.balance)),
            h('div', { class: 'plabel' }, 'Stars to spend')),
          h('div', { class: 'pstat pstat-super' },
            h('div', { class: 'pnum' }, superIcon(), String(p.superBalance || 0)),
            h('div', { class: 'plabel' }, 'Super stars to spend'),
            h('div', { class: 'psmall' }, (p.superEarned || 0) + ' earned by your class'))),
        h('h3', { class: 'profile-sub' }, 'My avatars'),
        avatars,
        h('h3', { class: 'profile-sub' }, 'My celebration'),
        effects,
        h('div', { class: 'row-actions', style: { marginTop: '20px' } },
          h('button', { class: 'btn btn-ghost', onclick: function () { m.close(); } }, 'Close'),
          h('button', { class: 'btn btn-buy', onclick: function () { m.close(); CQ.Nav.go({ name: 'shop' }); } },
            h('span', { svg: CQ.Icons.shop, style: { display: 'flex' } }), 'Star Shop'))
      ]
    });
    if (p.profileBadge) {
      CQ.Api.student('seenProfile', {}).then(function (res) { setProfile(res.profile); }).catch(function () {});
    }
  }

  function equip(item, after) {
    CQ.Api.student('equip', { itemId: item.id }).then(function (res) {
      setProfile(res.profile);
      if (state.shopMain && document.body.contains(state.shopMain)) drawShop(state.shopMain);
      if (item.type === 'effect' && item.id !== 'fx-none') CQ.Effects.play(item.id);
      else UI.toast(item.type === 'avatar' ? 'New look! 😎' : 'No celebration effect.');
      if (after) after();
    }).catch(function (err) { UI.toast(msgFor(err)); });
  }

  /* ───────────────────────── TIENDA ───────────────────────── */
  function renderShop() {
    var main = page();
    state.shopMain = main;
    main.appendChild(UI.loading());
    CQ.Api.student('getShop', {}).then(function (d) {
      setProfile(d.profile, d.catalog);
      drawShop(main);
    }).catch(function (err) { showError(main, err, function () { renderShop(); }); });
  }

  function drawShop(main) {
    var p = state.profile;
    U.clear(main);
    main.appendChild(hero({
      cls: 'hero-shop', art: 'fx-stars',
      back: h('button', { class: 'back-btn', onclick: function () { if (window.history.length > 1) window.history.back(); else CQ.Nav.go({ name: 'home' }); } },
        h('span', { svg: CQ.Icons.back, style: { display: 'flex' } }), 'Back'),
      title: 'Star Shop', sub: 'Use your stars to get new avatars and celebrations!',
      action: h('div', { class: 'balance-pills' },
        h('div', { class: 'balance-pill' }, starIcon(), h('b', {}, String(p.balance)), h('span', {}, 'stars')),
        h('div', { class: 'balance-pill super' }, superIcon(), h('b', {}, String(p.superBalance || 0)), h('span', {}, 'super stars')))
    }));
    main.appendChild(h('p', { class: 'shop-note' }, 'Buying things doesn’t change your progress. You keep all your stars in the activities!'));
    var groups = [
      ['avatar', 'stars', 'Avatars', null],
      ['effect', 'stars', 'Celebrations', null],
      [null, 'super', 'Super Star items', 'Only with super stars. Your class earns them together with Class rewards!']
    ];
    groups.forEach(function (g) {
      var items = state.catalog.filter(function (i) { return (i.currency || 'stars') === g[1] && (!g[0] || i.type === g[0]); });
      if (!items.length) return;
      main.appendChild(h('h2', { class: 'section-title' + (g[1] === 'super' ? ' super-title' : '') },
        g[1] === 'super' ? h('span', { svg: CQ.Icons.superstar, style: { display: 'flex', width: '30px' } }) : null, g[2]));
      if (g[3]) main.appendChild(h('p', { class: 'shop-note super-note' }, g[3]));
      var grid = h('div', { class: 'shop-grid' + (g[1] === 'super' ? ' super-grid' : '') });
      items.forEach(function (i) { grid.appendChild(shopItem(i)); });
      main.appendChild(grid);
    });
  }

  function wallet(i) { var p = state.profile; return (i.currency === 'super' ? p.superBalance : p.balance) || 0; }
  function priceIcon(i) { return i.currency === 'super' ? superIcon() : starIcon(); }

  function shopItem(i) {
    var p = state.profile;
    var owned = p.owned.indexOf(i.id) >= 0;
    var using = (i.type === 'avatar' ? p.avatar : p.effect) === i.id;
    var money = wallet(i);
    var action;
    if (using) {
      action = h('span', { class: 'chip-using' }, h('span', { svg: CQ.Icons.check, style: { display: 'flex', width: '18px' } }), 'Using');
    } else if (owned) {
      action = h('button', { class: 'btn btn-soft btn-sm', onclick: function () { equip(i); } }, 'Use');
    } else if (money >= i.price) {
      action = h('button', { class: 'btn btn-sm ' + (i.currency === 'super' ? 'btn-super' : 'btn-buy'),
        aria: { label: 'Buy ' + i.name + ' for ' + i.price + (i.currency === 'super' ? ' super stars' : ' stars') }, onclick: function () { buy(i); } },
        priceIcon(i), String(i.price));
    } else {
      action = h('div', { class: 'need' },
        h('span', { class: 'price-locked' }, h('span', { svg: CQ.Icons.lock, style: { display: 'flex', width: '16px' } }), priceIcon(i), String(i.price)),
        h('span', { class: 'muted small' }, 'Need ' + (i.price - money) + ' more'));
    }
    return h('div', { class: 'shop-item' + (using ? ' using' : '') + (owned ? ' owned' : '') + (!owned && money < i.price ? ' too-dear' : '') + (i.currency === 'super' ? ' super' : '') },
      h('div', { class: 'shop-art' + (i.type === 'avatar' ? ' round' : ''), svg: CQ.Art.svg(i.id) }),
      h('b', {}, i.name),
      action,
      i.type === 'effect' && i.id !== 'fx-none' ? h('button', { class: 'link-btn', onclick: function () { CQ.Effects.play(i.id); } }, 'Try it') : null);
  }

  function buy(i) {
    var unit = i.currency === 'super' ? ' super stars' : ' stars';
    UI.confirm('Buy ' + i.name + '?', 'It costs ' + i.price + unit + '. You have ' + wallet(i) + '.', 'Buy', 'Not now').then(function (yes) {
      if (!yes) return;
      CQ.Api.student('buyItem', { itemId: i.id }).then(function (res) {
        setProfile(res.profile);
        if (state.shopMain && document.body.contains(state.shopMain)) drawShop(state.shopMain);
        CQ.Sfx.play('win');
        CQ.Effects.play('fx-confetti');
        var isAv = i.type === 'avatar';
        UI.choice(isAv ? 'Do you want to equip this avatar?' : 'Do you want to use this celebration?', null, 'Yes', 'No', {
          kicker: isAv ? 'New avatar unlocked!' : 'New celebration unlocked!',
          art: h('div', { class: 'unlock-art' + (isAv ? ' round' : ''), svg: CQ.Art.svg(i.id) })
        }).then(function (equipNow) { if (equipNow) equip(i); });
      }).catch(function (err) { UI.toast(msgFor(err)); });
    });
  }

  /* ───────────────────────── arranque ───────────────────────── */
  CQ.Nav.start(function (r) { route(r); });
  var tsaved = CQ.Store.session.get('cq_tsession');
  if (tsaved && tsaved.token && CQ.TeacherApp) startTeacher(tsaved);   // profesor que recarga la página
  else CQ.Nav.go(CQ.Api.token ? { name: 'home' } : { name: 'welcome' }, true);
  if (BOOT.apiUrl) {
    CQ.Api.student('config', {}).then(function (c) {
      BOOT.idleMinutes = c.idleMinutes;
      BOOT.appName = c.appName;
      resetIdle();
    }).catch(function () {});
  }
})();
</script>

</body>
</html>
