<script>
/* ==========================================================================
   js_core — utilidades compartidas por la app del alumnado y la del profesor.
   Expone window.CQ = { h, Util, Store, Api, Speech, Sfx, Nav, UI, Icons }
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ = window.CQ || {};

  /* ── DOM ─────────────────────────────────────────────────────────────
     h('button', {class:'btn', onclick: fn, aria:{label:'Close'}}, 'Text', child)
     Los textos se insertan SIEMPRE como texto (nunca innerHTML) → sin XSS.
     Solo `svg:` acepta marcado, y solo para iconos/ilustraciones propios. */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'svg') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') {
        Object.keys(v).forEach(function (p) {
          if (p.indexOf('--') === 0) el.style.setProperty(p, v[p]);   // variables CSS (colores de Science)
          else el.style[p] = v[p];
        });
      }
      else if (k === 'aria') Object.keys(v).forEach(function (a) { el.setAttribute('aria-' + a, v[a]); });
      else if (k === 'data') Object.keys(v).forEach(function (d) { el.dataset[d] = v[d]; });
      else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  CQ.h = h;

  /* ── utilidades ──────────────────────────────────────────────────── */
  CQ.Util = {
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    uid: function () {
      var b = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(b);
      return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    },
    pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    clear: function (el) { while (el.firstChild) el.removeChild(el.firstChild); return el; },
    wait: function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); },
    fmtDate: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d)) return '—';
      return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' ' +
        d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    },
    fmtDuration: function (sec) {
      sec = Number(sec) || 0;
      var m = Math.floor(sec / 60), s = sec % 60;
      return m ? m + ' min ' + s + ' s' : s + ' s';
    }
  };

  /* ── almacenamiento seguro (algunos iframes bloquean storage) ─────── */
  function makeStore(kind) {
    var mem = {};
    var s = null;
    try { s = window[kind]; s.setItem('__t', '1'); s.removeItem('__t'); } catch (e) { s = null; }
    return {
      get: function (k) {
        try { var v = s ? s.getItem(k) : mem[k]; return v === null || v === undefined ? null : JSON.parse(v); }
        catch (e) { return null; }
      },
      set: function (k, v) { var j = JSON.stringify(v); try { if (s) s.setItem(k, j); else mem[k] = j; } catch (e) { mem[k] = j; } },
      remove: function (k) { try { if (s) s.removeItem(k); } catch (e) {} delete mem[k]; }
    };
  }
  CQ.Store = { session: makeStore('sessionStorage'), local: makeStore('localStorage') };

  /* ── API: envuelve google.script.run en promesas ──────────────────
     El servidor responde {ok:true,data} o {ok:false,error:{code}}.      */
  function call(fnName, args) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject({ code: 'NETWORK' });
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) resolve(res.data);
          else reject((res && res.error) || { code: 'SERVER' });
        })
        .withFailureHandler(function (err) {
          reject({ code: 'NETWORK', message: err && err.message });
        });
      runner[fnName].apply(runner, args);
    });

  /* Página alojada fuera de Google (GitHub Pages): API JSON por fetch.
     · Content-Type text/plain → petición "simple", sin preflight CORS.
     · credentials 'omit' → no se envían cookies de Google (evita el error

  function callHttp(action, payload) {

      method: 'POST',
      credentials: 'omit',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },

    }).then(function (r) {
      if (!r.ok) throw { code: 'NETWORK' };
      return r.json();
    }, function () {
      throw { code: 'NETWORK' };
    }).then(function (res) {
      if (res && res.ok) return res.data;
      throw (res && res.error) || { code: 'SERVER' };
    }, function (err) {
      throw err && err.code ? err : { code: 'NETWORK' };
    });
  }

    token: null,
    student: function (action, payload) {
      if (window.BOOT && window.BOOT.apiUrl) return callHttp(action, payload);
      return call('api', [CQ.Api.token, action, payload || {}]);
    },
    /**
     * Panel de profesor. mode 'admin' (propietario, cuenta de Google) → adminApi;
     * mode 'teacher' (otros profesores, con código y contraseña) → api(token, 't.acción'),
     * donde el servidor limita todo a los grupos de ese profesor.
     */
    mode: 'admin',
    admin: function (action, payload) {
      if (CQ.Api.mode === 'teacher') return CQ.Api.student('t.' + action, payload);
      return call('adminApi', [action, payload || {}]);
    }
  };

  /* ── voz (lectura en voz alta; solo al pulsar) ────────────────────── */
  CQ.Speech = {
    supported: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
    speak: function (text) {
      if (!CQ.Speech.supported || !text) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, ' blank '));
        u.lang = 'en-GB';
        u.rate = 0.88;
        var voices = window.speechSynthesis.getVoices() || [];

   Para añadir un efecto: añade un generador a GEN con el mismo id que en
   Shop.gs (SHOP_ITEMS) y su icono en js_art.html.
   ========================================================================== */

  'use strict';
  var CQ = window.CQ;
  var COLORS = ['#FF6F91', '#FFC53D', '#3DDC97', '#4C8DFF', '#9B5DE5', '#FF8A3D'];
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  function star(ctx, x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = rot + Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a));

  };

  /* Exclusivos (super estrellas) */
  GEN['fx-rainbow'] = {
    init: function (W, H) {

      for (var i = 0; i < 60; i++) a.push({ x: rnd(0, W), y: rnd(H * 0.1, H * 0.9), s: rnd(4, 9), t0: rnd(0, 2000), c: pick(['#EF4444', '#F59E0B', '#FACC15', '#22C55E', '#3B82F6', '#8B5CF6']) });

    var W = window.innerWidth, H = window.innerHeight;
    var dpr = Math.min(2, window.devicePixelRatio || 1);

        ctx.save(); gen.draw(ctx, parts[i], el, dur); ctx.restore();

  <!-- client/js_engine -->
<script>
/* ==========================================================================
   js_engine — Motor de actividades.

   Cada PLANTILLA (multiple_choice, match_pairs…) solo sabe dibujar e
   interactuar. El MOTOR se encarga de todo lo común: cabecera, instrucciones,
   barra de progreso, corrección inmediata, intentos, tiempos, sonidos, equipos
   en modo pizarra y el resultado final.

   Contrato de una plantilla:
     CQ.Engine.register('nombre', {
       mount: function (ctx) { ... return { destroy: fn } (opcional) }
     });
   Desde la plantilla:
     ctx.attempt(itemId, response) → { correct: true | false | null }
         (null = modo "end": sin feedback hasta el final)
     ctx.setProgress(done, total)
     ctx.complete()
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ;
  var h = CQ.h;

  var PRAISE = ['Great job!', 'Well done!', 'Brilliant!', 'Super!', 'Fantastic!', 'You got it!', 'Excellent!'];
  var RETRY = ['Try again!', 'Not quite. Try again!', 'Almost! Have another go.'];
  var TEAM_COLORS = ['#6C4BEF', '#FF7A45', '#0E9F87', '#2D8CFF'];

  var templates = {};

  function register(name, def) { templates[name] = def; }

  /**
   * opts = { root, activity, mode:'student'|'board', teams:0..4, onFinish(result), onExit() }
   * result = { responses:[{itemId,response,tries,timeMs}], local:{correct,gradable,total}, teamScores }
   */
  function run(opts) {
    var activity = opts.activity;
    var tpl = templates[activity.template];
    var root = CQ.Util.clear(opts.root);
    if (!tpl) {
      root.appendChild(h('div', { class: 'empty' }, 'This activity is not available yet.'));
      return { destroy: function () {} };
    }
    var cfg = activity.config || {};
    var feedback = cfg.feedback === 'end' ? 'end' : 'instant';
    var items = cfg.shuffleItems === false ? activity.items.slice() : CQ.Util.shuffle(activity.items);
    var itemById = {};
    items.forEach(function (it) { itemById[it.itemId] = it; });

    var records = {};
    var lastAt = Date.now();
    var finished = false;
    var nTeams = opts.mode === 'board' ? Math.max(0, Math.min(4, opts.teams || 0)) : 0;
    var teamScores = [];
    for (var i = 0; i < nTeams; i++) teamScores.push(0);
    var turn = 0;

    /* ── cabecera ── */
    var progressBar = CQ.UI.bar(0, items.length);
    var soundBtn = h('button', {
      class: 'icon-btn' + (CQ.Sfx.enabled ? ' on' : ''),
      aria: { label: 'Sound', pressed: String(CQ.Sfx.enabled) },
      svg: CQ.Sfx.enabled ? CQ.Icons.sound : CQ.Icons.mute,
      onclick: function () {
        var on = CQ.Sfx.toggle();
        soundBtn.className = 'icon-btn' + (on ? ' on' : '');
        soundBtn.innerHTML = on ? CQ.Icons.sound : CQ.Icons.mute;
        soundBtn.setAttribute('aria-pressed', String(on));
      }
    });
    var exitBtn = h('button', { class: 'icon-btn', aria: { label: 'Exit' }, svg: CQ.Icons.close, onclick: askExit });
    var top = h('div', { class: 'player-top' },
      exitBtn,
      h('div', { class: 'title' }, activity.title),
      progressBar,
      soundBtn);

    var teamsEl = nTeams ? h('div', { class: 'teams', aria: { live: 'polite' } }) : null;

    var instr = activity.instructions ? h('div', { class: 'instructions' },
      CQ.Speech.supported ? h('button', {
        class: 'icon-btn', aria: { label: 'Listen to the instructions' }, svg: CQ.Icons.listen,
        onclick: function () { CQ.Speech.speak(activity.instructions); }
      }) : null,
      h('p', {}, activity.instructions)) : null;

    var stage = h('div', { class: 'stage' });
    var player = h('div', { class: 'player' }, top, teamsEl, instr, stage);
    root.appendChild(player);
    renderTeams();

    function renderTeams() {
      if (!teamsEl) return;
      CQ.Util.clear(teamsEl);
      teamScores.forEach(function (pts, t) {
        teamsEl.appendChild(h('div', { class: 'team' + (t === turn ? ' turn' : '') },
          h('span', {}, 'Team ' + (t + 1)),
          h('span', { class: 'pts', style: { background: TEAM_COLORS[t] } }, String(pts)),
          h('button', { class: 'adj', aria: { label: 'Team ' + (t + 1) + ' minus one' }, onclick: function () { teamScores[t] = Math.max(0, teamScores[t] - 1); renderTeams(); } }, '−'),
          h('button', { class: 'adj', aria: { label: 'Team ' + (t + 1) + ' plus one' }, onclick: function () { teamScores[t]++; renderTeams(); } }, '+')));
      });
    }

    function askExit() {
      var text = opts.mode === 'board' ? null : 'Your answers will not be saved.';
      CQ.UI.confirm('Stop playing?', text, 'Stop', 'Keep playing').then(function (yes) {
        if (yes) { destroy(); opts.onExit && opts.onExit(); }
      });
    }

    /* ── contexto para la plantilla ── */
    var ctx = {
      el: stage,
      h: h,
      art: CQ.Art,
      activity: activity,
      config: cfg,
      items: items,
      mode: opts.mode,
      feedback: feedback,
      praise: function () { return CQ.Util.pick(PRAISE); },
      retry: function () { return CQ.Util.pick(RETRY); },
      shuffle: CQ.Util.shuffle,

      /** opts.silent = true → no leer en voz alta la respuesta (las plantillas de listening ya lo hacen). */
      attempt: function (itemId, response, opts) {
        var item = itemById[itemId];
        var silent = !!(opts && opts.silent);
        if (!item || finished) return { correct: null };
        var gradable = feedback === 'instant' && item.answer !== undefined;
        var correct = gradable ? Grading.grade(activity.template, item, response) : null;
        var now = Date.now();
        var rec = records[itemId];
        if (!rec) {
          rec = records[itemId] = { itemId: itemId, response: String(response), tries: 1, timeMs: now - lastAt, correct: correct, solved: false };
        } else if (!rec.solved) {
          rec.tries++;
        }
        if (correct === true) rec.solved = true;
        lastAt = now;

        if (correct === true) {
          CQ.Sfx.play('correct');
          if (CQ.Sfx.enabled && item.say && !silent) setTimeout(function () { CQ.Speech.speak(item.say); }, 250);
        } else if (correct === false) {
          CQ.Sfx.play('wrong');
        } else {
          CQ.Sfx.play('tap');
        }
        if (nTeams && !(opts && opts.noTurn)) {
          if (correct === true) teamScores[turn]++;
          // opts.keepTurn: si acierta, el mismo equipo vuelve a jugar (Memory)
          if (!(opts && opts.keepTurn && correct === true)) turn = (turn + 1) % nTeams;
          renderTeams();
        }
        return { correct: correct, first: rec.tries === 1 };
      },

      /** Pasa el turno al siguiente equipo sin puntuar (fallos en Memory, rondas perdidas…). */
      nextTurn: function () {
        if (!nTeams) return;
        turn = (turn + 1) % nTeams;
        renderTeams();
      },

      setProgress: function (done, total) {
        var pct = total ? Math.round(done / total * 100) : 0;
        progressBar.firstChild.style.width = pct + '%';
        progressBar.setAttribute('aria-valuenow', done);
        progressBar.setAttribute('aria-valuemax', total);
      },

      /** Muestra un mensaje en un elemento de feedback y lo anuncia a lectores de pantalla. */
      say: function (el, text, kind) {
        el.textContent = text;
        el.className = 'feedback' + (kind ? ' ' + kind : '');
        CQ.UI.announce(text);
      },

      complete: function () {
        if (finished) return;
        finished = true;
        ctx.setProgress(items.length, items.length);
        var responses = [];
        var correct = 0;
        var gradable = 0;
        items.forEach(function (it) {
          var r = records[it.itemId];
          if (!r) return;
          responses.push({ itemId: r.itemId, response: r.response, tries: r.tries, timeMs: r.timeMs });
          if (r.correct !== null) { gradable++; if (r.correct) correct++; }
        });
        CQ.Sfx.play('win');
        var result = {
          responses: responses,
          local: { correct: correct, gradable: gradable, total: cfg.sampled ? responses.length : items.length },
          teamScores: teamScores.slice()
        };
        setTimeout(function () { destroy(); opts.onFinish && opts.onFinish(result); }, 700);
      }
    };

    var instance = tpl.mount(ctx) || {};

    function destroy() {
      try { if (CQ.Speech.supported) window.speechSynthesis.cancel(); } catch (e) {}
      if (instance.destroy) instance.destroy();
    }

    return { destroy: destroy };
  }

  /** Utilidad para plantillas: pinta un enunciado con huecos "___". */
  function promptWithBlank(text) {
    var p = h('p', { class: 'prompt' });
    var parts = String(text || '').split(/_{2,}/);
    var blank = null;
    parts.forEach(function (part, i) {
      if (i > 0) { blank = h('span', { class: 'blank', aria: { label: 'blank' } }, ' '); p.appendChild(blank); }
      p.appendChild(document.createTextNode(part));
    });
    return { el: p, blank: blank };
  }

  /**
   * Arrastrar con Pointer Events (dedo, lápiz y ratón; la API nativa no funciona en tabletas).
   * opts = { onDrop(x, y) → true si se colocó, onHover(x, y) }. Devuelve función para desactivar.
   * Un toque sin mover NO es arrastre (se deja pasar como click).
   */
  function draggable(el, opts) {
    var drag = null;
    function down(e) {
      if (el.disabled || (e.button !== undefined && e.button !== 0)) return;
      drag = { x0: e.clientX, y0: e.clientY, id: e.pointerId, ghost: null };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', cancel);
    }
    function move(e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.ghost) {
        if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 10) return;
        drag.ghost = el.cloneNode(true);
        drag.ghost.classList.add('drag-ghost');
        drag.ghost.style.width = el.offsetWidth + 'px';
        document.body.appendChild(drag.ghost);
        el.style.opacity = '.3';
      }
      e.preventDefault();
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      if (opts.onHover) opts.onHover(e.clientX, e.clientY);
    }
    function end() {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', cancel);
      if (drag && drag.ghost) { drag.ghost.remove(); el.style.opacity = ''; }
      if (opts.onHover) opts.onHover(-1, -1);
    }
    function up(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var was = !!drag.ghost;
      end();
      drag = null;
      if (was) {
        el.dataset.dragged = '1';
        setTimeout(function () { el.dataset.dragged = ''; }, 60);
        opts.onDrop(e.clientX, e.clientY);
      }
    }
    function cancel() { end(); drag = null; }
    el.addEventListener('pointerdown', down);
    return function () { end(); el.removeEventListener('pointerdown', down); };
  }

  CQ.Engine = { register: register, run: run, promptWithBlank: promptWithBlank, draggable: draggable, TEAM_COLORS: TEAM_COLORS, templates: templates };
})();
</script>

<script>
/* Plantilla: multiple_choice
   Una pregunta cada vez: imagen opcional + enunciado (admite huecos "___") + opciones.
   Feedback inmediato: si falla, la opción se marca y puede volver a intentarlo.
   Modo "end" (retos): sin feedback; pasa a la siguiente pregunta. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('multiple_choice', {
    mount: function (ctx) {
      var h = ctx.h;
      var i = 0;
      var timer = null;

      function show() {
        if (i >= ctx.items.length) { ctx.complete(); return; }
        var item = ctx.items[i];
        ctx.setProgress(i, ctx.items.length);
        CQ.Util.clear(ctx.el);

        var media = ctx.art.render(item.media);
        var pr = CQ.Engine.promptWithBlank(item.prompt);
        var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
        var why = h('div', { class: 'why-box', hidden: true });
        var options = ctx.config.shuffleOptions === false ? item.options.slice() : ctx.shuffle(item.options);
        var longest = options.reduce(function (m, o) { return Math.max(m, o.length); }, 0);
        var grid = h('div', { class: 'options' + (longest > 18 ? ' one-col' : ''), role: 'group', aria: { label: 'Answers' } });
        var buttons = [];

        options.forEach(function (opt) {
          var b = h('button', { class: 'opt', onclick: function () { choose(b, opt); } }, opt);
          buttons.push(b);
          grid.appendChild(b);
        });

        function lockAll() { buttons.forEach(function (x) { x.disabled = true; }); }

        function choose(btn, opt) {

        var selPic = null;
        var selWord = null;
        var doneInRound = 0;

        round.forEach(function (item) {

          var media = ctx.art.render(item.media);

<script>
/* Plantilla: drag_sort
   Clasificar tarjetas en cajas (config.categories = [{id,label}]).
   Dos formas de jugar, siempre disponibles:
     · Arrastrar (Pointer Events: funciona con dedo, lápiz y ratón).
     · Tocar la tarjeta y después tocar la caja (también con teclado).
   No se usa la API nativa de drag & drop de HTML porque no funciona en tabletas. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('drag_sort', {
    mount: function (ctx) {
      var h = ctx.h;
      var cats = ctx.config.categories || [];
      var placedCount = 0;
      var selected = null;
      var drag = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });

      var boxes = cats.map(function (c) {
        var list = h('div', { class: 'placed' });
        var box = h('div', { class: 'sort-box', role: 'button', tabindex: '0', data: { cat: c.id }, aria: { label: 'Box: ' + c.label } },
          h('h3', {}, c.label), list);
        box.addEventListener('click', function () { if (selected) place(selected, c.id, box); });
        box.addEventListener('keydown', function (e) {
          if ((e.key === 'Enter' || e.key === ' ') && selected) { e.preventDefault(); place(selected, c.id, box); }
        });
        return { cat: c, el: box, list: list };
      });

      var tray = h('div', { class: 'tray', role: 'group', aria: { label: 'Cards' } });
      var cards = ctx.items.map(function (item) {
        var media = ctx.art.render(item.media);
        var card = h('button', { class: 'sort-card', aria: { label: item.prompt, pressed: 'false' } },
          media ? media.firstChild : null, h('span', {}, item.prompt));
        var c = { item: item, el: card };
        card.addEventListener('click', function () {
          if (card.dataset.dragged === '1') { card.dataset.dragged = ''; return; }
          setSelected(selected === c ? null : c);
        });
        card.addEventListener('pointerdown', function (e) { startDrag(e, c); });
        tray.appendChild(card);
        return c;
      });

      function setSelected(c) {
        if (selected) { selected.el.classList.remove('selected'); selected.el.setAttribute('aria-pressed', 'false'); }
        selected = c;
        if (c) { c.el.classList.add('selected'); c.el.setAttribute('aria-pressed', 'true'); CQ.Sfx.play('tap'); }
      }

      function place(c, catId, boxEl) {
        setSelected(null);
        var res = ctx.attempt(c.item.itemId, catId);
        if (res.correct === false) {
          c.el.classList.remove('shake'); void c.el.offsetWidth; c.el.classList.add('shake');
          ctx.say(fb, ctx.retry(), 'bad');
          return;

        var box = boxes.filter(function (b) { return b.cat.id === catId; })[0];
        var media = ctx.art.render(c.item.media);
        box.list.appendChild(h('div', { class: 'mini' }, media ? media.firstChild : null, c.item.prompt));
        // Se oculta sin quitarla para que las demás tarjetas no cambien de sitio.
        c.el.disabled = true;
        c.el.style.visibility = 'hidden';
        c.placed = true;
        placedCount++;
        ctx.setProgress(placedCount, ctx.items.length);
        if (res.correct === true) ctx.say(fb, ctx.praise(), 'good');
        if (placedCount === ctx.items.length) ctx.complete();

      /* ── arrastrar ── */
      function startDrag(e, c) {
        if (e.button !== undefined && e.button !== 0) return;

          drag.ghost.classList.add('drag-ghost');
          drag.ghost.style.width = drag.c.el.offsetWidth + 'px';
          document.body.appendChild(drag.ghost);
          drag.c.el.style.opacity = '.3';

        e.preventDefault();
        drag.ghost.style.left = e.clientX + 'px';
        drag.ghost.style.top = e.clientY + 'px';
        var b = boxAt(e.clientX, e.clientY);
        if (drag.hot && (!b || drag.hot !== b)) drag.hot.el.classList.remove('hot');
        if (b) b.el.classList.add('hot');

      }
      function endDrag() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
        if (drag && drag.ghost) { drag.ghost.remove(); drag.c.el.style.opacity = ''; }
        if (drag && drag.hot) drag.hot.el.classList.remove('hot');

      function onUp(e) {

      function onCancel() { endDrag(); drag = null; }

      CQ.Util.clear(ctx.el);
      ctx.el.appendChild(h('div', { class: 'sort' },
        h('div', { class: 'sort-boxes' }, boxes.map(function (b) { return b.el; })),
        fb,
        tray));
      ctx.setProgress(0, ctx.items.length);

      return { destroy: function () { endDrag(); } };
    }
  });
})();
</script>

<script>

   palabra en inglés. "Hide the words" oculta los textos para practicar en voz
   alta (al tocar una tarjeta se muestra solo esa). Se completa cuando se han

(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('listen_learn', {

      var revealed = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var hideBtn = h('button', { class: 'btn btn-yellow btn-sm', onclick: function () { hidden = !hidden; revealed = null; draw(); } });
      var finishBtn = h('button', { class: 'btn btn-good btn-lg', style: { display: 'none' }, onclick: function () { ctx.complete(); } },
        h('span', { svg: CQ.Icons.check, style: { display: 'flex' } }), 'I know them all!');

<script>
/* Plantilla: listen_point  (Review · "Listen and point")
   Se oye una palabra y el alumno toca su imagen entre todas las de la unidad.

(function () {

  var CQ = window.CQ;

  CQ.Engine.register('listen_point', {
    mount: function (ctx) {
      var h = ctx.h;
      var board = ctx.activity.items.slice();          // posición fija de las tarjetas
      var rounds = ctx.items.slice();                   // orden aleatorio de las palabras
      var r = 0;
      var score = 0;
      var busy = false;
      var timer = null;

      var cards = {};

      function target() { return rounds[r]; }
      function speak() { if (target()) CQ.Speech.speak(target().say || word(target())); }

          h('span', { class: 'vnum' }, String(i + 1)),

        cards[it.itemId] = card;
        grid.appendChild(card);
      });

      function update() {

        scorePill.innerHTML = '';

        if (r >= rounds.length) { ctx.complete(); return; }

<script>
/* Plantilla: memory  (Extra)
   Cartas boca abajo. Hay que encontrar la IMAGEN y su PALABRA en inglés.
   Parejas aleatorias del banco: 6 para el alumno, 8 en la pizarra.
   En pizarra con equipos: si aciertan, el mismo equipo repite turno. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('memory', {
    mount: function (ctx) {
      var h = ctx.h;
      var board = ctx.mode === 'board';
      var n = board ? (ctx.config.boardPairs || 8) : (ctx.config.pairs || 6);
      var chosen = ctx.shuffle(ctx.activity.items).slice(0, Math.min(n, ctx.activity.items.length));
      var cards = [];
      chosen.forEach(function (it) { cards.push({ it: it, kind: 'pic' }, { it: it, kind: 'word' }); });
      cards = ctx.shuffle(cards);
      var open = [], matched = 0, moves = 0, busy = false, timer = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var movesLbl = h('span', { class: 'hm-round' });
      var grid = h('div', { class: 'mem-grid' + (cards.length > 12 ? ' big' : '') });

      function word(it) { return it.word || it.answer || ''; }

      cards.forEach(function (c, i) {
        var media = c.kind === 'pic' ? ctx.art.render(c.it.media) : null;
        var face = c.kind === 'pic'
          ? h('div', { class: 'mem-face pic' }, media ? media.firstChild : null)
          : h('div', { class: 'mem-face word' }, word(c.it));
        c.el = h('button', { class: 'mcard', aria: { label: 'Card ' + (i + 1) }, onclick: function () { flip(c); } },
          h('div', { class: 'mcard-inner' },
            h('div', { class: 'mcard-back', svg: CQ.Icons.gamepad }),
            face));
        grid.appendChild(c.el);
      });

      function update() {
        movesLbl.textContent = 'Pairs: ' + matched + ' / ' + chosen.length + '  ·  Moves: ' + moves;
        ctx.setProgress(matched, chosen.length);
      }

      function flip(c) {
        if (busy || c.done || open.indexOf(c) >= 0) return;
        c.el.classList.add('up');
        c.el.setAttribute('aria-label', c.kind === 'pic' ? 'Picture' : word(c.it));
        CQ.Sfx.play('tap');
        if (c.kind === 'word') CQ.Speech.speak(c.it.say || word(c.it));
        open.push(c);
        if (open.length < 2) return;
        moves++;
        var a = open[0], b = open[1];
        if (a.it === b.it && a.kind !== b.kind) {
          a.done = b.done = true;
          a.el.classList.add('done'); b.el.classList.add('done');
          ctx.attempt(a.it.itemId, word(a.it), { keepTurn: true, silent: true });
          ctx.say(fb, ctx.praise() + ' "' + word(a.it) + '"', 'good');
          open = [];
          matched++;
          update();
          if (matched === chosen.length) timer = setTimeout(function () { ctx.complete(); }, 1100);
        } else {
          busy = true;
          CQ.Sfx.play('wrong');
          ctx.nextTurn();
          ctx.say(fb, ctx.retry(), 'bad');
          timer = setTimeout(function () {
            a.el.classList.remove('up'); b.el.classList.remove('up');
            open = []; busy = false;
          }, 1100);
          update();
        }
      }

      CQ.Util.clear(ctx.el);
      ctx.el.appendChild(h('div', { class: 'listen-bar' }, movesLbl));
      ctx.el.appendChild(grid);
      ctx.el.appendChild(fb);
      update();
      return { destroy: function () { clearTimeout(timer); } };
    }
  });
})();
</script>

<script>
/* Plantilla: whats_missing  (Extra · "What's missing?")
   1. Se ven 6 objetos del banco: "Look carefully!"
   2. "Close your eyes!": una cortina los tapa y desaparece uno.
   3. "What's missing?": hay que elegir la palabra (las opciones trampa NO están
      en la mesa, así que hay que recordar).
   Alumno: 5 rondas. Pizarra: sin límite hasta "Finish". */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('whats_missing', {
    mount: function (ctx) {
      var h = ctx.h;
      var board = ctx.mode === 'board';
      var bank = ctx.activity.items.slice();
      var show = Math.min(ctx.config.show || 6, bank.length - 1);
      var maxRounds = board ? Infinity : (ctx.config.rounds || 5);
      var pool = [];
      var round = 0, won = 0, set = [], missing = null, phase = 'look', timer = null, countdown = null;

      var title = h('p', { class: 'prompt wm-title' });
      var roundLbl = h('span', { class: 'hm-round' });
      var grid = h('div', { class: 'wm-grid' });
      var curtain = h('div', { class: 'wm-curtain' }, h('span', { class: 'wm-eyes' }, '🙈'), h('b', {}, 'Close your eyes!'));
      var stageBox = h('div', { class: 'wm-stage' }, grid, curtain);
      var opts = h('div', { class: 'options' });
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var readyBtn = h('button', { class: 'btn btn-lg', onclick: hide }, 'Ready!');
      var nextBtn = h('button', { class: 'btn btn-lg', onclick: next }, 'Next', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } }));
      var finishBtn = board ? h('button', { class: 'btn btn-good btn-sm', onclick: function () { ctx.complete(); } }, 'Finish') : null;

      function word(it) { return it.word || it.answer || ''; }

      function card(it, empty) {
        if (empty) return h('div', { class: 'wm-card empty' }, h('span', {}, '?'));
        var m = ctx.art.render(it.media);
        return h('div', { class: 'wm-card' }, h('div', { class: 'wm-pic' }, m ? m.firstChild : null), h('b', {}, word(it)));
      }

      function startRound() {
        if (!pool.length) pool = ctx.shuffle(bank.filter(function (b) { return b !== missing; }));
        missing = pool.shift();
        var others = ctx.shuffle(bank.filter(function (b) { return b !== missing; })).slice(0, show - 1);
        set = ctx.shuffle(others.concat([missing]));
        phase = 'look';
        roundLbl.textContent = board ? 'Round ' + (round + 1) : 'Round ' + (round + 1) + ' of ' + maxRounds;
        title.textContent = 'Look carefully!';
        ctx.say(fb, '', '');
        CQ.Util.clear(grid);
        set.forEach(function (it) { grid.appendChild(card(it)); });
        CQ.Util.clear(opts);
        curtain.classList.remove('on');
        readyBtn.style.display = '';
        nextBtn.style.display = 'none';
        if (!board) {
          var left = 10;
          readyBtn.textContent = 'Ready! (' + left + ')';
          clearInterval(countdown);
          countdown = setInterval(function () {
            left--;
            readyBtn.textContent = 'Ready! (' + left + ')';
            if (left <= 0) hide();
          }, 1000);
        } else {
          readyBtn.textContent = 'Ready!';
        }
      }

      function hide() {
        if (phase !== 'look') return;
        clearInterval(countdown);
        phase = 'hide';
        readyBtn.style.display = 'none';
        title.textContent = 'Close your eyes!';
        curtain.classList.add('on');
        CQ.Sound.tick();
        timer = setTimeout(function () {
          CQ.Util.clear(grid);
          set.forEach(function (it) { grid.appendChild(card(it, it === missing)); });
          curtain.classList.remove('on');
          ask();
        }, 1900);
      }

      function ask() {
        phase = 'guess';
        title.textContent = 'What’s missing?';
        var distract = ctx.shuffle(bank.filter(function (b) { return set.indexOf(b) < 0; })).slice(0, 3);
        CQ.Util.clear(opts);
        ctx.shuffle(distract.concat([missing])).forEach(function (it) {
          var b = h('button', { class: 'opt', onclick: function () { choose(b, it); } }, word(it));
          opts.appendChild(b);
        });
        try { opts.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
      }

      function choose(btn, it) {

        var res = ctx.attempt(missing.itemId, word(it), { silent: true });
        if (res.correct === false) {

          ctx.say(fb, ctx.retry(), 'bad');
          return;

        if (res.first) won++;
        btn.classList.add('is-correct', 'pop');
        Array.prototype.forEach.call(opts.querySelectorAll('button'), function (b) { b.disabled = true; });
        CQ.Speech.speak(missing.say || word(missing));
        ctx.say(fb, ctx.praise() + ' The ' + word(missing) + ' was missing!', 'good');
        CQ.Util.clear(grid);
        set.forEach(function (x) { var c = card(x); if (x === missing) c.classList.add('found', 'pop'); grid.appendChild(c); });
        nextBtn.style.display = '';
      }

      function next() {
        round++;
        if (!board) ctx.setProgress(round, maxRounds);
        if (round >= maxRounds) { ctx.complete(); return; }
        startRound();
      }

      CQ.Util.clear(ctx.el);
      ctx.el.appendChild(h('div', { class: 'listen-bar' }, roundLbl, h('span', { class: 'grow' }), finishBtn));
      ctx.el.appendChild(title);
      ctx.el.appendChild(stageBox);
      ctx.el.appendChild(opts);
      ctx.el.appendChild(fb);
      ctx.el.appendChild(readyBtn);
      ctx.el.appendChild(nextBtn);
      if (!board) ctx.setProgress(0, maxRounds);
      startRound();
      return { destroy: function () { clearTimeout(timer); clearInterval(countdown); } };
    }
  });
})();

<script>
/* Plantilla: video_quiz — Actividades DENTRO de un vídeo de YouTube.
   - El vídeo se reproduce con la API de YouTube (dominio sin cookies).
   - En el segundo de cada pregunta (item.at) el vídeo se para y aparece la pregunta
     encima: verdadero/falso, rellenar el hueco o escoger una palabra (item.qtype).
   - Al acertar, el vídeo sigue solo. Si falla, puede volver a intentarlo.
   - Botón "Activities ON/OFF": siempre empieza en ON. Con OFF el vídeo se ve sin pausas
     (y no se guarda nota).
   - No se puede adelantar el vídeo para saltarse una pregunta pendiente.
   - Pantalla completa propia (la de YouTube taparía las preguntas). */
(function () {
  'use strict';
  var CQ = window.CQ;

  /** Carga la API de YouTube una sola vez. */
  var ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise(function (resolve, reject) {
      if (window.YT && window.YT.Player) { resolve(window.YT); return; }
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prev) try { prev(); } catch (e) {} resolve(window.YT); };
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = function () { ytReady = null; reject(new Error('yt')); };
      document.head.appendChild(s);
    });
    return ytReady;
  }

  var TYPE_LABEL = { tf: 'True or false?', gap: 'Fill the gap', choice: 'Choose the right word' };

  CQ.Engine.register('video_quiz', {
    mount: function (ctx) {
      var h = ctx.h;
      var yid = String((ctx.config && ctx.config.youtubeId) || '');
      var qs = ctx.items.slice().sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
      var done = {};            // itemId → true cuando se ha acertado (o respondido, en modo "end")
      var on = true;            // actividades activadas (siempre empieza en ON)
      var player = null, poll = null, current = null, ended = false, destroyed = false, resumeTimer = null;

      var holder = h('div', { class: 'vq-player' });
      var overlay = h('div', { class: 'vq-overlay', hidden: true });
      var wrap = h('div', { class: 'vq-wrap' }, holder, overlay);
      var status = h('span', { class: 'vq-status' });
      var toggle = h('button', { class: 'vq-toggle on', aria: { pressed: 'true' }, onclick: toggleOn },
        h('span', { class: 'vq-dot' }), h('span', { class: 'vq-toggle-text' }, 'Activities: ON'));
      var fsBtn = h('button', { class: 'btn btn-ghost btn-sm', onclick: fullscreen }, '⛶ Full screen');
      var endBox = h('div', { class: 'vq-end', hidden: true });
      ctx.el.appendChild(h('div', { class: 'vq' },
        h('div', { class: 'vq-bar' }, toggle, status, fsBtn), wrap, endBox));
      updateStatus();

      if (!/^[A-Za-z0-9_-]{11}$/.test(yid)) {
        holder.appendChild(h('p', { class: 'empty' }, 'This video is not available.'));
        return {};
      }

      loadYT().then(function (YT) {
        if (destroyed) return;
        var target = h('div');
        holder.appendChild(target);
        player = new YT.Player(target, {
          host: 'https://www.youtube-nocookie.com',
          videoId: yid,
          width: '100%', height: '100%',
          playerVars: { rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3, disablekb: 1 },
          events: {
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.ENDED) onEnded();
              if (e.data === YT.PlayerState.PLAYING) { ended = false; endBox.hidden = true; if (current && on) player.pauseVideo(); }
            }
          }
        });
        poll = setInterval(tick, 250);
      }).catch(function () {
        holder.appendChild(h('p', { class: 'empty' }, 'The video could not load. Check your internet connection.'));
      });

      function pending() { return qs.filter(function (q) { return !done[q.itemId]; }); }

      function updateStatus() {
        var n = qs.length - pending().length;
        status.textContent = on ? '🎯 Questions: ' + n + ' / ' + qs.length : 'Just watching (no stars)';
        ctx.setProgress(n, qs.length);
      }

      /** Cada 250 ms: ¿toca una pregunta? ¿ha adelantado el vídeo sin contestar? */
      function tick() {
        if (!player || !player.getCurrentTime || !on || current) return;
        var t = player.getCurrentTime() || 0;
        var next = pending()[0];
        if (!next) return;
        if (t >= (next.at || 0)) {
          if (t > (next.at || 0) + 2.5) { try { player.seekTo(next.at, true); } catch (e) {} }
          ask(next);
        }
      }

      function ask(q) {
        current = q;
        try { player.pauseVideo(); } catch (e) {}
        CQ.Util.clear(overlay);
        overlay.hidden = false;
        var pr = CQ.Engine.promptWithBlank(q.prompt);
        var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
        var opts = q.qtype === 'tf' ? ['True', 'False'] : ctx.shuffle(q.options || []);
        var btns = [];
        var grid = h('div', { class: 'options vq-options', role: 'group', aria: { label: 'Answers' } });
        opts.forEach(function (o) {
          var b = h('button', { class: 'opt' + (q.qtype === 'tf' ? ' tf-' + o.toLowerCase() : ''), onclick: function () { choose(b, o); } },
            q.qtype === 'tf' ? (o === 'True' ? '👍 True' : '👎 False') : o);
          btns.push(b);
          grid.appendChild(b);
        });
        overlay.appendChild(h('div', { class: 'vq-card pop' },
          h('div', { class: 'vq-type' }, '⏸ ' + (TYPE_LABEL[q.qtype] || 'Question')),
          pr.el, grid, fb));
        if (CQ.Sfx.enabled && q.say) { try { CQ.Speech.speak(q.prompt.replace(/_{2,}/g, '…')); } catch (e) {} }
        if (btns[0]) btns[0].focus({ preventScroll: true });

        function choose(btn, opt) {
          var res = ctx.attempt(q.itemId, opt, { silent: true });
          if (res.correct === false) {
            btn.classList.add('is-wrong');
            btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
            btn.disabled = true;
            ctx.say(fb, ctx.retry(), 'bad');
            return;
          }
          btns.forEach(function (x) { x.disabled = true; });
          btn.classList.add(res.correct === true ? 'is-correct' : 'is-picked', 'pop');
          if (pr.blank) { pr.blank.textContent = opt; pr.blank.classList.add('filled'); }
          if (res.correct === true) ctx.say(fb, ctx.praise(), 'good');
          done[q.itemId] = true;
          updateStatus();
          resumeTimer = setTimeout(resume, 1200);
        }
      }

      function resume() {
        current = null;
        overlay.hidden = true;
        CQ.Util.clear(overlay);
        if (ended) { onEnded(); return; }
        try { player.playVideo(); } catch (e) {}
      }

      function toggleOn() {
        on = !on;
        toggle.classList.toggle('on', on);
        toggle.setAttribute('aria-pressed', String(on));
        toggle.querySelector('.vq-toggle-text').textContent = 'Activities: ' + (on ? 'ON' : 'OFF');
        if (!on && current) { clearTimeout(resumeTimer); current = null; overlay.hidden = true; try { player.playVideo(); } catch (e) {} }
        updateStatus();
      }

      function onEnded() {
        ended = true;
        if (current) return;
        var left = pending();
        if (on && !left.length) { ctx.complete(); return; }
        if (on && left.length) { ask(left[0]); return; }   // preguntas que quedaron atrás
        // Visto sin actividades: no hay nota. Se puede volver a ver con ellas.
        CQ.Util.clear(endBox);
        endBox.hidden = false;
        endBox.appendChild(h('p', {}, 'Great watching! Turn the activities ON to win stars.'));
        endBox.appendChild(h('button', { class: 'btn', onclick: function () {
          if (!on) toggleOn();
          endBox.hidden = true;
          try { player.seekTo(0, true); player.playVideo(); } catch (e) {}
        } }, '🎯 Watch again with activities'));

      ghostGeo.rotateZ(Math.PI / 2);
      var ringGeo = new T.TorusGeometry(0.5, 0.03, 8, 48);
      ringGeo.rotateY(Math.PI / 2);
      var ghosts = SLOTS.map(function (s, i) {
        var g = new T.Group();
        var mat = new T.MeshBasicMaterial({ color: '#38BDF8', transparent: true, opacity: 0.14, depthWrite: false });
        var ringMat = new T.MeshBasicMaterial({ color: '#7DD3FC', transparent: true, opacity: 0.85 });
        var tube = new T.Mesh(ghostGeo, mat);
        var r1 = new T.Mesh(ringGeo, ringMat); r1.position.x = 3.15;
        var r2 = new T.Mesh(ringGeo, ringMat); r2.position.x = -2.95;
        g.add(tube, r1, r2);
        g.position.set(0.15, s[0], s[1]);
        g.userData = { slot: i, mat: mat, ringMat: ringMat, tube: tube };
        g.visible = false;
        bundle.add(g);
        return g;
      });

      /* ── estado ── */
      var placed = [true, false, false, false, false, false, false];
      var built = false;
      var othersOpacity = 0;      // 0 = solo nuestra célula; 1 = tejido completo
      var phase = 0, squeeze = 0; // contracción
      var highlight = null, hlT = 0;
      var drag = null, armed = false, hotGhost = null;

      function setOthers(o, fromTween) {
        if (!fromTween) api.cancelTween('others');
        othersOpacity = o;
        allOther.forEach(function (m) { m.transparent = o < 0.999; m.opacity = o; m.depthWrite = o > 0.6; });
        cells.forEach(function (c, i) { if (i) c.visible = o > 0.01 && placed[i]; });
        api.request();
      }
      function setSheath(o, fromTween) {
        if (!fromTween) api.cancelTween('sheath');
        sheathMat.opacity = 0.26 * o; sheath.visible = o > 0.01; api.request();
      }
      function fadeOthers(to, ms) {
        var from = othersOpacity;
        api.tween(ms || 900, function (k) { setOthers(from + (to - from) * k, true); }, null, null, 'others');
      }
      function fadeSheath(to, ms) {
        var from = sheathMat.opacity / 0.26;
        api.tween(ms || 900, function (k) { setSheath(from + (to - from) * k, true); }, null, null, 'sheath');
      }
      function showGhosts(on) { ghosts.forEach(function (g, i) { g.visible = on && !placed[i]; }); api.request(); }
      function count() { return placed.filter(Boolean).length; }

      function setHighlight(mat) {
        if (highlight && highlight !== mat) { highlight.emissive && highlight.emissive.setRGB(0, 0, 0); }
        highlight = mat; hlT = 0; api.request();
      }

      /* ── puntos interactivos ── */
      var tmp = new T.Vector3();
      function radialNormal(obj) {
        return function (out) { obj.getWorldPosition(out); out.x = 0; return out.lengthSq() ? out.normalize() : out.set(0, 1, 0); };
      }
      function hotspot(n, key, getObj, normal, mat, side) {
        var hs = api.addHotspot({
          n: n, label: PARTS[key].name, side: side,
          get: function (out) { return getObj(out); },
          normal: normal,
          onClick: function () {
            api.showPart(PARTS[key].name, PARTS[key].text, PARTS[key].color);
            api.setHotspotActive(hs);
            setHighlight(mat || null);
          }
        });
        return hs;
      }
      /** Punto fijo de la célula (coordenadas de la célula) + normal hacia fuera (para ocultarlo si queda detrás). */
      function local(cell, x, y, z) { return function (out) { return cell.localToWorld(out.set(x, y, z)); }; }
      function outward(y, z) { return function (out) { return out.set(0, y, z).normalize(); }; }
      function cellHotspots() {
        api.clearHotspots();
        var c = cells[0];
        // Núcleo de delante (x = -1.15), estrías, extremo cortado (miofibrillas) y membrana
        hotspot(1, 'nucleus', local(c, -1.15, 0.17, 0.6), outward(0.26, 0.97), mainMats.CQ_Nucleus, 'left');
        hotspot(2, 'stripes', local(c, 0.6, 0.4, 0.33), outward(0.75, 0.65), mainMats.CQ_Fiber);
        hotspot(3, 'myofibrils', local(c, 3.38, 0.05, 0.12), function (out) { return out.set(1, 0, 0.3).normalize(); }, mainMats.myo);
        hotspot(4, 'membrane', local(c, -2.3, -0.3, 0.4), outward(-0.6, 0.8), mainMats.CQ_Membrane, 'left');
      }
      function tissueHotspots() {
        api.clearHotspots();
        hotspot(1, 'cell', function (out) { return cells[0].localToWorld(out.set(-1.2, 0, 0.5)); }, function (out) { return out.set(0.2, 1, 0.6).normalize(); }, mainMats.CQ_Fiber);
        hotspot(2, 'wrap', function (out) { return sheath.localToWorld(out.set(-1.2, 1.68, 0)); }, function (out) { return out.set(0, 1, 0); });
        hotspot(3, 'ends', function (out) { return bundle.localToWorld(out.set(3.45, -1.05, 0.2)); }, function (out) { return out.set(1, 0, 0); });
      }

      /* ── vistas de cámara (cada paso tiene la suya; "Reset the view" vuelve a ella) ── */
      var VIEWS = {
        cell: [[2.3, 2.3, 8.8], [0.3, 0, 0]],
        contract: [[3.0, 1.5, 6.2], [0.9, 0, 0]],
        build: [[9.6, 3.6, 6.2], [0.7, 0, 0]],
        tissue: [[8.2, 4.6, 9.8], [0.4, 0, 0]]
      };
      /** Encuadre adaptado a la pantalla: si el lienzo es estrecho (tableta en vertical, móvil), la cámara se aleja. */
      function view(name, ms, done) {
        var el = api.el, aspect = (el.clientWidth || 1) / (el.clientHeight || 1);
        var f = Math.max(1, Math.pow(1.5 / aspect, 0.75));
        var p = VIEWS[name][0], t = VIEWS[name][1];
        api.flyTo([t[0] + (p[0] - t[0]) * f, t[1] + (p[1] - t[1]) * f, t[2] + (p[2] - t[2]) * f], t, ms, done);
      }

      /* ── construir el tejido: arrastrar células a los huecos ── */
      var stack = null, counter = null;
      function buildTask() {
        var left = 7 - count();
        counter = h('div', { class: 'sim-counter' }, h('b', {}, String(count())), ' / 7 muscle cells');
        stack = h('button', { class: 'sim-stack' + (armed ? ' armed' : ''), disabled: built, aria: { label: 'Muscle cells to place: ' + left } },
          h('span', { class: 'sim-stack-art', svg: THUMB }),
          h('span', {}, h('b', {}, built ? 'Done!' : 'Muscle cell'), h('small', {}, built ? 'All cells are in place' : left + ' left · drag me!')));
        stack.addEventListener('pointerdown', startDrag);
        stack.addEventListener('click', function () {
          if (stack.dataset.dragged === '1' || built) return;
          armed = !armed;
          stack.classList.toggle('armed', armed);
          if (armed) CQ.Sfx.play('tap');
        });
        var auto = board && !built ? h('button', { class: 'btn btn-ghost', onclick: autoBuild }, '▶ Build it for me') : null;
        return h('div', { class: 'sim-task' }, counter, stack, auto);
      }
      function nextFreeCell() { for (var i = 1; i < 7; i++) if (!placed[i]) return i; return -1; }

      function startDrag(e) {
        if (built || nextFreeCell() < 0) return;
        drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, cell: -1 };
        document.addEventListener('pointermove', onMove, { passive: false });
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      }
      /** Hueco libre más cercano al puntero: distancia en pantalla a TODO el tubo (de un extremo a otro), no solo a su centro. */
      function nearestGhost(x, y) {
        var b = api.renderer.domElement.getBoundingClientRect();
        var px = x - b.left, py = y - b.top;
        var best = null, bd = board ? 70 : 52;
        ghosts.forEach(function (g, i) {
          if (placed[i]) return;
          var a = api.toScreen(g.localToWorld(tmp.set(-2.9, 0, 0)));
          var c = api.toScreen(g.localToWorld(tmp.set(3.1, 0, 0)));
          var vx = c.x - a.x, vy = c.y - a.y, len = vx * vx + vy * vy || 1;
          var t = Math.max(0, Math.min(1, ((px - a.x) * vx + (py - a.y) * vy) / len));
          var d = Math.hypot(a.x + vx * t - px, a.y + vy * t - py);
          if (d < bd) { bd = d; best = g; }
        });
        return best;
      }
      function setHot(g) {
        if (hotGhost === g) return;
        hotGhost = g;
        ghosts.forEach(function (x) { x.userData.mat.opacity = x === g ? 0.4 : 0.14; });
        api.request();
      }
      function onMove(e) {
        if (!drag || e.pointerId !== drag.id) return;
        if (drag.cell < 0) {
          if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 8) return;
          drag.cell = nextFreeCell();
          api.controls.enabled = false;
          var c = cells[drag.cell];
          c.visible = true;
          c.rotation.x = drag.cell * 0.9;
          if (stack) stack.classList.add('dragging');
        }
        e.preventDefault();
        var p = api.pointerOnPlane(e.clientX, e.clientY, new T.Vector3(0.5, 0, 0));
        if (p) { bundle.worldToLocal(p); cells[drag.cell].position.set(p.x - 0.2, p.y, p.z); }
        setHot(nearestGhost(e.clientX, e.clientY));
        api.request();
      }
      function onUp(e) {
        if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.id)) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        api.controls.enabled = true;
        var d = drag; drag = null;
        if (stack) stack.classList.remove('dragging');
        if (d.cell < 0) return;   // fue un toque (lo gestiona el click)
        stack.dataset.dragged = '1';
        setTimeout(function () { if (stack) stack.dataset.dragged = ''; }, 60);
        var g = hotGhost;
        setHot(null);
        if (g) snap(d.cell, g.userData.slot);
        else {
          // No estaba cerca de un hueco: la célula vuelve al montón
          var c = cells[d.cell];
          var from = c.position.clone();
          api.tween(380, function (k) { c.position.lerpVectors(from, new T.Vector3(-8, 4, 6), k); }, function () { c.visible = false; api.request(); });
          CQ.UI.announce('Drop the cell on a glowing space.');
        }
      }
      /** Coloca la célula `ci` en el hueco `slot` (con un pequeño "clic" elástico). */
      function snap(ci, slot, ms) {
        var c = cells[ci];
        // La célula pasa a ocupar ese hueco: intercambiamos el índice para que cells[slot] sea la colocada
        if (ci !== slot) { var t = cells[slot]; cells[slot] = c; cells[ci] = t; }
        placed[slot] = true;
        var from = c.position.clone();
        var to = new T.Vector3((slot % 3 - 1) * 0.12, SLOTS[slot][0], SLOTS[slot][1]);
        c.visible = true;
        ghosts[slot].visible = false;
        api.tween(ms || 420, function (k) { c.position.lerpVectors(from, to, k); }, null, CQ.Sim.util.ease.back);
        CQ.Sfx.play('correct');
        armed = false;
        refreshTask();
        if (count() === 7) setTimeout(finishBuild, (ms || 420) + 150);
      }
      function refreshTask() { api.refreshPanel(); }

      function finishBuild() {
        if (built) return;
        built = true;
        showGhosts(false);
        CQ.Sfx.play('win');
        // La envoltura de tejido conectivo "abraza" el haz de células y la cámara se aleja
        sheath.scale.set(1, 1.25, 1.25);
        api.tween(1100, function (k) { setSheath(k, true); var s = 1.25 - 0.25 * k; sheath.scale.set(1, s, s); }, null, null, 'sheath');
        setTimeout(function () { view('tissue', 1600); }, 500);
        api.refreshPanel();
        api.canNext();
      }

      /** Pizarra: el profesor puede mostrar la construcción animada. */
      function autoBuild() {
        var order = [];
        for (var i = 1; i < 7; i++) if (!placed[i]) order.push(i);
        order.forEach(function (slot, n) {
          setTimeout(function () {
            if (placed[slot] || stepId() !== 'build') return;
            var c = cells[slot];
            c.position.set(-6, 3.5, 5);
            c.visible = true;
            snap(slot, slot, 650);
          }, n * 420);
        });
      }
      function stepId() { return api.stepId(); }

      // Toque en un hueco brillante (modo "tocar el montón y después el hueco")
      function onCanvasTap(e) {
        if (!armed || built || api.stepId() !== 'build') return;
        var hit = api.pick(e.clientX, e.clientY, ghosts.filter(function (g) { return g.visible; }));
        var g = hit && (function (o) { while (o && !o.userData.mat) o = o.parent; return o; })(hit.object);
        if (!g) return;
        var ci = nextFreeCell();
        var c = cells[ci];
        c.position.set(-6, 3.5, 5);
        c.visible = true;
        snap(ci, g.userData.slot, 600);
      }
      api.renderer.domElement.addEventListener('click', onCanvasTap);
      api.cleanup(function () {
        api.renderer.domElement.removeEventListener('click', onCanvasTap);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      });

      function completeInstantly() {
        for (var i = 1; i < 7; i++) {
          placed[i] = true;
          cells[i].position.set((i % 3 - 1) * 0.12, SLOTS[i][0], SLOTS[i][1]);
        }
        built = true;
        showGhosts(false);
      }

      /* ── pasos ── */
      var steps = [
        {
          id: 'cell', level: 'cell', title: 'This is a muscle cell',
          view: function () { view('cell'); },
          enter: function () {
            showGhosts(false);
            var fromTissue = othersOpacity > 0.05;
            fadeOthers(0, 1000); fadeSheath(0, 700);
            view('cell', 1500);
            // Si venimos del tejido, los puntos aparecen cuando ya solo se ve nuestra célula
            api.clearHotspots();
            setTimeout(function () { if (api.stepId() === 'cell') cellHotspots(); }, fromTissue ? 1000 : 0);
          },
          leave: function () { setHighlight(null); },
          panel: function () {
            return {
              kicker: 'Cell',
              text: ['Our body is made of **cells**. The cell is the **smallest unit of life**.',
                'Cells have different shapes, depending on their job. **Muscle cells** are **elongated**: they are long and thin.'],
              boxes: [['tip', 'Drag to turn the cell. Pinch or scroll to zoom. Tap the **numbers** to discover its parts.']],
              vocab: [['muscle cell', 'a long, thin cell that can contract'], ['elongated', 'longer and narrower than usual'], ['nucleus', 'the control centre of a cell']]
            };
          }
        },
        {
          id: 'contract', level: 'cell', title: 'Muscle cells contract', animates: true,
          view: function () { view('contract'); },
          enter: function () {
            showGhosts(false);
            fadeOthers(0, 600); fadeSheath(0, 500);
            view('contract', 1300);
            cellHotspots();
            if (!board) setTimeout(function () { if (api.stepId() === 'contract') api.setPlaying(true); }, 1500);
          },
          leave: function () { setHighlight(null); },
          panel: function () {
            return {
              kicker: 'Cell',
              text: ['Press **Play** and watch the muscle cell.',
                'When it **contracts**, it gets **shorter and fatter**. When it **expands**, it gets long again.',
                'This **allows muscles to move**.'],
              boxes: [['did', 'Look at the **stripes**: they get closer together when the cell contracts!'],
                ['job', 'Muscle cells **expand and contract**.']],
              vocab: [['contract', 'to get shorter'], ['expand', 'to get longer again']]
            };
          }
        },
        {
          id: 'build', level: 'tissue', title: 'Build muscle tissue!',
          done: function () { return built; },
          blocked: 'First, build the muscle tissue!',
          view: function () { view(built ? 'tissue' : 'build'); },
          enter: function () {
            api.clearHotspots();
            api.setPlaying(false);
            setOthers(1);
            cells.forEach(function (c, i) { c.visible = placed[i]; if (placed[i] && i) c.position.set((i % 3 - 1) * 0.12, SLOTS[i][0], SLOTS[i][1]); });
            setSheath(built ? 1 : 0);
            showGhosts(!built);
            view(built ? 'tissue' : 'build', 1500);
          },
          leave: function () { armed = false; setHot(null); showGhosts(false); },
          panel: function () {
            if (built) {
              return {
                kicker: 'Tissue',
                text: ['**Well done!** You have made **muscle tissue**.', 'Many muscle cells of the **same type** are now **together**.'],
                boxes: [['remember', 'Cells of the same type group together to form a **tissue**.']]
              };
            }
            return {
              kicker: 'Tissue',
              text: ['One muscle cell can’t do much on its own. Cells of the **same type** group together.',
                'Drag each **muscle cell** to a **glowing space**. Put them **side by side**.'],
              task: buildTask(),
              boxes: [['tip', 'You can also **tap** the muscle cell and then **tap** a glowing space.']]
            };
          }
        },
        {
          id: 'tissue', level: 'tissue', title: 'This is muscle tissue', animates: true,
          view: function () { view('tissue'); },
          enter: function () {
            if (!built) completeInstantly();   // pizarra: el profesor puede saltar aquí
            setOthers(othersOpacity);
            cells.forEach(function (c) { c.visible = true; });
            fadeOthers(1, 900);
            fadeSheath(1, 900);
            view('tissue', 1500);
            tissueHotspots();
          },
          leave: function () { setHighlight(null); },
          panel: function () {
            return {
              kicker: 'Tissue',
              text: ['A **tissue** is a **set of one type of cells** that do **the same job**.',
                'In **muscle tissue**, lots of muscle cells are side by side. Press **Play**: they all **contract together**, so the tissue gets shorter and **pulls**.'],
              boxes: [['remember', '**cell → tissue → organ → system → organism**. Different tissues together make an **organ**, like the **stomach**.']],
              vocab: [['tissue', 'a set of one type of cells with the same job'], ['set', 'a group of things that belong together']]
            };
          }
        }
      ];

      // El panel del paso "Build" se redibuja al colocar cada célula (contador).
      refreshTask = function () { if (api.stepId() === 'build') api.refreshPanel(); };

      return {
        steps: steps,
        onLevel: function (lv) {
          if (lv === 'cell') return 'cell';
          return built || board ? 'tissue' : 'build';
        },
        reset: function () {
          placed = [true, false, false, false, false, false, false];
          built = false; armed = false;
          cells.forEach(function (c, i) { c.visible = i === 0; c.position.set(0, SLOTS[i][0], SLOTS[i][1]); });
          setOthers(0); setSheath(0); showGhosts(false);
          bundle.scale.set(1, 1, 1); squeeze = 0; phase = 0;
          api.clearHotspots();
        },
        tick: function (dt, t, playing) {
          var busy = false;
          // Contracción: más corta y más gruesa (mismo volumen). Al pausar vuelve suavemente a relajada.
          if (playing) { phase += dt; busy = true; }
          var target = playing ? (0.5 - 0.5 * Math.cos(phase * Math.PI * 2 / 2.6)) : 0;
          var ns = squeeze + (target - squeeze) * Math.min(1, dt * (playing ? 60 : 5));
          if (Math.abs(ns - squeeze) > 0.0005) busy = true;
          squeeze = ns;
          var s = 1 - 0.22 * squeeze;
          bundle.scale.set(s, 1 / Math.sqrt(s), 1 / Math.sqrt(s));
          // Huecos que "respiran" para invitar a colocar células
          if (ghosts.some(function (g) { return g.visible; })) {
            var pulse = 0.55 + 0.45 * Math.sin(t * 3.2);
            ghosts.forEach(function (g) { g.userData.ringMat.opacity = 0.45 + 0.5 * pulse; });
            busy = true;
          }
          // Brillo de la parte seleccionada
          if (highlight && highlight.emissive) {
            hlT += dt;
            highlight.emissive.set(highlight === mainMats.CQ_Nucleus ? '#8B5CF6' : '#F97316');
            highlight.emissiveIntensity = 0.25 + 0.2 * Math.sin(hlT * 5);
            busy = true;
          }
          return busy;
        }
      };
    }
  });
})();
</script>

  <!-- Panel de profesor (Teacher login): se arranca desde js_student -->
  <!-- client/js_teacher -->
<script>
/* ==========================================================================
   js_teacher — Panel del profesor (en español) + Modo pizarra (en inglés,
   porque lo ve la clase en el proyector).
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ, h = CQ.h, U = CQ.Util, UI = CQ.UI;
  var BOOT = window.BOOT || {};
  var app = document.getElementById('app');
  var boardRoot = document.getElementById('board-root');
  var printArea = document.getElementById('print-area');

  var ERR = {
    BAD_GROUP: 'Grupo no válido. Elige uno de la lista (2A, 2B, 3A…). Si no aparece, ejecuta setup.',
    BAD_COURSE: 'Algún curso seleccionado no existe.',
    BAD_REQUEST: 'Datos no válidos.',
    FORBIDDEN: 'Sin permiso para este grupo.',
    NOT_SETUP: 'Falta la configuración inicial: ejecuta setup() en el editor.',
    NOT_FOUND: 'No encontrado.',
    SESSION_EXPIRED: 'Tu sesión ha caducado. Vuelve a entrar.',
    NETWORK: 'Sin conexión con el servidor. Inténtalo de nuevo.',
    SERVER: 'Error del servidor (revisa la pestaña Errors de la hoja).'
  };
  function errMsg(e) {
    if (e && e.code === 'SESSION_EXPIRED' && isTeacherMode()) setTimeout(function () { logout(); }, 1200);
    return ERR[(e && e.code) || 'SERVER'] || ERR.SERVER;
  }

  /**
   * role 'admin'   → el propietario (todo: alumnos, profesores, grupos, PIN…).
   * role 'teacher' → otro profesor: elige uno de SUS grupos y ve solo ese grupo
   *                  (alumnos con super estrellas, deberes, pizarra y resultados).
   */
  var state = { role: 'admin', me: null, group: '', onLogout: null,
    tab: 'students', overview: null, filterGroup: '', board: { courseId: '', data: null, teams: 2 }, results: { courseId: '' } };
  function isTeacherMode() { return state.role === 'teacher'; }

  function logout() {
    if (!isTeacherMode()) return;
    CQ.Api.admin('logout').catch(function () {});
    closeBoard();
    document.body.classList.remove('t-body');
    if (state.onLogout) state.onLogout();
  }

  /* ───────────────────────── estructura ───────────────────────── */
  function shell() {
    U.clear(app);
    var teacher = isTeacherMode();
    // Profesor sin grupo elegido: primero elige el grupo.
    if (teacher && !state.group) { renderGroupPicker(); return; }

    var tabs = teacher
      ? [['students', 'Alumnos'], ['homework', 'Deberes'], ['board', 'Pizarra'], ['results', 'Resultados']]
      : [['students', 'Alumnos'], ['teachers', 'Profesores'], ['homework', 'Deberes'], ['board', 'Pizarra'], ['results', 'Resultados']];
    var tabBar = h('div', { class: 'tabs', role: 'tablist' }, tabs.map(function (t) {
      return h('button', { class: 'tab', role: 'tab', aria: { selected: String(state.tab === t[0]) },
        onclick: function () { state.tab = t[0]; shell(); } }, t[1]);
    }));
    var myGroups = teacher ? ((state.overview && state.overview.me && state.overview.me.groups) || (state.me && state.me.groups) || []) : [];
    app.appendChild(h('header', { class: 'topbar t-topbar' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-mark', svg: CQ.Art.svg('mascot') }),
        h('span', { class: 'brand-name' }, (BOOT.appName || 'ClassQuest') + (teacher ? ' · Teacher' : ' · Admin'))),
      teacher ? h('button', { class: 'g-current', title: 'Cambiar de grupo',
        onclick: function () { if (myGroups.length > 1) { state.group = ''; state.board.data = null; shell(); } } },
        (isJoined(groupInfo(state.group)) ? gLabel(state.group) : 'Grupo ' + state.group), myGroups.length > 1 ? h('span', { class: 'muted' }, ' ▾') : null) : null,
      h('div', { class: 'spacer' }),
      tabBar,
      teacher
        ? h('button', { class: 'icon-btn', aria: { label: 'Salir' }, title: 'Salir', svg: CQ.Icons.logout, onclick: logout })
        : h('button', { class: 'icon-btn', aria: { label: 'Actualizar contenido de la hoja' }, title: 'Actualizar contenido (tras editar la hoja)', svg: CQ.Icons.refresh,
          onclick: function () {

    var main = h('main', { class: 'main', style: { maxWidth: '1280px' } });
    app.appendChild(main);
    if (state.tab === 'students') renderStudents(main);
    else if (state.tab === 'teachers' && !teacher) renderTeachers(main);
    else if (state.tab === 'board') renderBoardPicker(main);
    else if (state.tab === 'homework') renderHomework(main);
    else renderResults(main);
  }

  /** Profesor: "¿Con qué grupo vas a trabajar?" — tarjetas grandes con sus grupos. */
  function renderGroupPicker() {
    var main = h('main', { class: 'main' });
    app.appendChild(h('header', { class: 'topbar t-topbar' },
      h('div', { class: 'brand' }, h('span', { class: 'brand-mark', svg: CQ.Art.svg('mascot') }),
        h('span', { class: 'brand-name' }, (BOOT.appName || 'ClassQuest') + ' · Teacher')),
      h('div', { class: 'spacer' }),
      h('button', { class: 'icon-btn', aria: { label: 'Salir' }, title: 'Salir', svg: CQ.Icons.logout, onclick: logout })));
    app.appendChild(main);
    main.appendChild(UI.loading());
    loadOverview().then(function (ov) {
      U.clear(main);
      var gs = ov.groups || [];

      main.appendChild(h('div', { class: 'page-head' }, h('div', { class: 'grow' },
        h('h1', {}, 'Hola, ' + ((ov.me && ov.me.displayName) || '') + ' 👋'),
        h('p', { class: 'sub' }, gs.length ? '¿Con qué grupo vas a trabajar?' : 'Todavía no tienes grupos asignados. Pídeselo al administrador.'))));
      var grid = h('div', { class: 'grid g-pick' });
      gs.forEach(function (g) {

        grid.appendChild(h('button', { class: 'tile g-tile', onclick: function () { state.group = g.groupId; state.board.data = null; state.tab = 'students'; shell(); } },
          h('span', { class: 'g-tile-id' + (isJoined(g) ? ' sci' : '') }, isJoined(g) ? 'Sci ' + g.groupId.charAt(0) + 'º' : g.groupId),
          h('span', { class: 'g-tile-name' }, g.name),
