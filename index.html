<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ClassQuest</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- client/styles -->
<style>
/* ==========================================================================
   ClassQuest — sistema de diseño
   Variables → base → layout → componentes → plantillas → pizarra → impresión
   ========================================================================== */
:root {
  --ink: #23264A;
  --ink-2: #4C5178;
  --ink-3: #7D82A8;
  --bg: #F4F5FB;
  --surface: #FFFFFF;
  --line: #E3E5F1;
  --brand: #6C4BEF;
  --brand-ink: #FFFFFF;
  --accent: #FFB020;
  --good: #16A06A;
  --good-bg: #E3F7EE;
  --bad: #E5484D;
  --bad-bg: #FDECEC;
  --kind-game: #FF7A45;
  --kind-practice: #2D8CFF;
  --kind-challenge: #E8A100;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 1px 2px rgba(35, 38, 74, .06), 0 8px 24px rgba(35, 38, 74, .08);
  --shadow-lg: 0 2px 4px rgba(35, 38, 74, .06), 0 18px 40px rgba(35, 38, 74, .14);
  --font: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --tap: 56px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  font-size: 18px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; }
p { margin: 0; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 4px solid #FFB020; outline-offset: 3px; border-radius: 10px; }

/* ── layout ─────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px clamp(12px, 3vw, 28px);
  background: rgba(244, 245, 251, .9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; background: none; border: 0; padding: 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; }
.brand-mark svg { width: 24px; height: 24px; }
.topbar .spacer { flex: 1; }
.chip-user { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 16px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #EAE4FF; display: grid; place-items: center; overflow: hidden; }
.avatar svg { width: 34px; height: 34px; }
.main { max-width: 1080px; margin: 0 auto; padding: clamp(16px, 3vw, 32px) clamp(14px, 3vw, 28px) 64px; }
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(26px, 3.4vw, 36px); }
.page-head .sub { color: var(--ink-2); font-size: 18px; margin-top: 4px; }
.page-head .grow { flex: 1; min-width: 200px; }
.section-title { font-size: 22px; margin: 28px 0 14px; display: flex; align-items: center; gap: 10px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.grid-sm { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }

/* ── botones ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--tap); padding: 0 26px; border-radius: 999px; border: 0;
  background: var(--brand); color: var(--brand-ink); font-weight: 600; font-size: 19px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .14);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .2s;
  user-select: none;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .14); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 24px; height: 24px; }
.btn-ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn-soft { background: #ECE8FF; color: var(--brand); box-shadow: none; }
.btn-good { background: var(--good); }
.btn-lg { min-height: 66px; font-size: 22px; padding: 0 34px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--surface); box-shadow: var(--shadow); color: var(--ink); flex: none;
  transition: transform .15s var(--ease);
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn.on { background: var(--brand); color: #fff; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; min-height: 48px; padding: 0 18px 0 12px; font-weight: 600; }
.back-btn svg { width: 22px; height: 22px; }

/* ── tarjetas ───────────────────────────────────────────────────────────── */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 14px; text-align: left;
  background: var(--surface); border: 0; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; min-height: 120px; overflow: hidden;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  animation: rise .45s var(--ease) both;
}
button.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
button.tile:active { transform: translateY(0) scale(.99); }
.tile-course { color: #fff; min-height: 210px; padding: 24px; }
.tile-course .tile-art { position: absolute; right: -8px; bottom: -10px; width: 150px; height: 150px; opacity: .95; }
.tile-course .subject { font-size: 16px; font-weight: 600; opacity: .9; text-transform: uppercase; letter-spacing: .06em; }
.tile-course .year { font-size: 34px; font-weight: 700; }
.tile-course .meta { margin-top: auto; display: flex; gap: 14px; align-items: center; font-weight: 600; position: relative; z-index: 1; }
.tile-course .bar { background: rgba(255, 255, 255, .3); }
.tile-course .bar > i { background: #fff; }
.tile-unit { flex-direction: row; align-items: center; gap: 18px; }
.tile-unit .tile-art { width: 92px; height: 92px; flex: none; border-radius: 18px; background: #F1EEFF; padding: 8px; }
.tile-unit h3 { font-size: 24px; }
.tile-unit .info { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.tile-act { min-height: 210px; }
.tile-act .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tile-act .tpl-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #fff; }
.tile-act .tpl-icon svg { width: 32px; height: 32px; }
.tile-act h3 { font-size: 21px; }
.tile-act .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tile-act .play { font-weight: 700; color: var(--brand); display: flex; align-items: center; gap: 6px; }
.tile-act .play svg { width: 22px; height: 22px; }
.tile.locked { opacity: .6; }
.tile.locked .play { color: var(--ink-3); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.badge-game { background: #FFEDE5; color: #C2410C; }
.badge-practice { background: #E3EFFF; color: #1D5FC2; }
.badge-challenge { background: #FFF3D1; color: #8A5A00; }
.badge-draft { background: #EEE; color: #555; }
.kind-game { background: var(--kind-game); }
.kind-practice { background: var(--kind-practice); }
.kind-challenge { background: var(--kind-challenge); }

.bar { height: 12px; border-radius: 999px; background: #ECEEF6; overflow: hidden; flex: 1; min-width: 80px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--good); transition: width .6s var(--ease); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 24px; height: 24px; }
.stars.lg svg { width: 64px; height: 64px; }
.star-on { color: #FFB020; }
.star-off { color: #DADDEB; }
.muted { color: var(--ink-3); }
.empty { text-align: center; color: var(--ink-2); padding: 40px 20px; }

/* ── login ──────────────────────────────────────────────────────────────── */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background:
  radial-gradient(circle at 15% 20%, #E8E1FF 0, transparent 40%),
  radial-gradient(circle at 85% 80%, #DDF5EF 0, transparent 40%), var(--bg); }
.login-card { width: min(100%, 460px); background: var(--surface); border-radius: 30px; box-shadow: var(--shadow-lg); padding: clamp(24px, 5vw, 40px); animation: rise .5s var(--ease) both; }
.login-card .hero-img { width: 120px; height: 120px; margin: -4px auto 8px; }
.login-card h1 { text-align: center; font-size: clamp(28px, 6vw, 36px); }
.login-card .lead { text-align: center; color: var(--ink-2); margin: 8px 0 24px; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.field label { font-weight: 600; font-size: 18px; }
.input {
  min-height: 62px; border-radius: 16px; border: 3px solid var(--line); background: #FAFBFF;
  padding: 0 18px; font-size: 26px; font-weight: 600; letter-spacing: .08em; width: 100%;
  transition: border-color .2s, box-shadow .2s;
}
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 5px rgba(108, 75, 239, .15); }
.input.small { font-size: 18px; letter-spacing: 0; min-height: 50px; font-weight: 500; }
.form-msg { min-height: 28px; text-align: center; font-weight: 600; margin-bottom: 12px; }
.form-msg.bad { color: var(--bad); }

/* ── reproductor de actividades ────────────────────────────────────────── */
.player { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.player-top { display: flex; align-items: center; gap: 12px; padding: 12px clamp(12px, 3vw, 28px); }
.player-top .title { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-top .bar { height: 16px; }
.instructions { margin: 4px clamp(12px, 3vw, 28px) 0; display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 16px; box-shadow: var(--shadow); font-size: 19px; font-weight: 500; }
.instructions p { flex: 1; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px clamp(12px, 3vw, 28px) 32px; gap: 22px; width: 100%; max-width: 980px; margin: 0 auto; }
.feedback { min-height: 34px; font-size: 22px; font-weight: 700; text-align: center; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.art > svg { width: 100%; height: 100%; }
.media { display: flex; justify-content: center; align-items: center; gap: 10px; }
.media .art { width: clamp(150px, 28vw, 230px); height: clamp(150px, 28vw, 230px); background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 14px; }
.media.duo .art:first-child { width: clamp(100px, 18vw, 150px); height: clamp(100px, 18vw, 150px); background: #FFF6E5; }
.media.duo-mark .art:first-child { width: clamp(150px, 28vw, 230px); height: clamp(150px, 28vw, 230px); background: var(--surface); }
.media.duo-mark .art.mark { width: clamp(70px, 11vw, 100px); height: clamp(70px, 11vw, 100px); background: transparent; box-shadow: none; padding: 0; align-self: flex-end; }
.media img.art { object-fit: contain; }
.prompt { font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; text-align: center; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 4px dashed var(--brand); color: var(--brand); padding: 0 6px; margin: 0 4px; }
.blank.filled { border-bottom-style: solid; color: var(--good); border-color: var(--good); }

.options { display: grid; gap: 14px; width: 100%; max-width: 760px; grid-template-columns: repeat(2, 1fr); }
.options.one-col { grid-template-columns: 1fr; }
.opt {
  min-height: 76px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface);
  font-size: clamp(20px, 2.6vw, 26px); font-weight: 600; padding: 10px 16px; box-shadow: 0 4px 0 var(--line);
  transition: transform .12s var(--ease), border-color .2s, background .2s;
}
.opt:hover:not(:disabled) { border-color: #C9C0FF; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.is-correct { background: var(--good-bg); border-color: var(--good); color: #0B6B45; box-shadow: 0 4px 0 #9ADBBF; }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); color: #A4282C; box-shadow: 0 4px 0 #F2B8BA; }
.opt.is-picked { background: #ECE8FF; border-color: var(--brand); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.is-correct):not(.is-wrong):not(.is-picked) { opacity: .55; }

/* parejas */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 4vw, 48px); width: 100%; max-width: 820px; }
.match-col { display: flex; flex-direction: column; gap: 14px; }
.match-card {
  min-height: 96px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface);
  box-shadow: 0 4px 0 var(--line); display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: clamp(20px, 2.6vw, 26px); font-weight: 600; padding: 8px;
  transition: transform .15s var(--ease), border-color .2s, background .2s, opacity .3s;
}
.match-card .art { width: 80px; height: 80px; }
.match-card.selected { border-color: var(--brand); background: #ECE8FF; transform: scale(1.03); }
.match-card.matched { border-color: var(--good); background: var(--good-bg); opacity: .75; }
.match-card:disabled { cursor: default; }

/* clasificar */
.sort { width: 100%; display: flex; flex-direction: column; gap: 18px; }
.sort-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.sort-box {
  min-height: 190px; border-radius: 24px; border: 4px dashed #C9C0FF; background: #F7F5FF; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; transition: background .2s, border-color .2s, transform .2s;
}
.sort-box h3 { font-size: 24px; text-align: center; color: var(--brand); }
.sort-box.hot { background: #ECE8FF; border-color: var(--brand); transform: scale(1.01); }
.sort-box .placed { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sort-box .placed .mini { width: 74px; text-align: center; font-size: 13px; font-weight: 600; animation: pop .35s var(--ease); }
.sort-box .placed .mini .art { width: 60px; height: 60px; margin: 0 auto; }
.tray { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 130px; }
.sort-card {
  width: 128px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface); box-shadow: 0 4px 0 var(--line);
  padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; font-size: 17px;
  touch-action: none; user-select: none; transition: transform .15s var(--ease), border-color .2s;
}
.sort-card .art { width: 78px; height: 78px; pointer-events: none; }
.sort-card.selected { border-color: var(--brand); background: #ECE8FF; transform: translateY(-4px); }
.drag-ghost { position: fixed; z-index: 1000; pointer-events: none; transform: translate(-50%, -50%) rotate(-4deg) scale(1.06); box-shadow: var(--shadow-lg); }

/* construir frase */
.sentence {
  min-height: 86px; width: 100%; max-width: 820px; border-radius: 20px; border: 3px dashed #C9C0FF; background: #F7F5FF;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px;
  transition: border-color .2s, background .2s;
}
.sentence.good { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.sentence .hint { color: var(--ink-3); font-weight: 500; }
.bank { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 820px; }
.token {
  min-height: 62px; padding: 0 22px; border-radius: 16px; border: 3px solid var(--line); background: var(--surface);
  box-shadow: 0 4px 0 var(--line); font-size: clamp(20px, 2.6vw, 26px); font-weight: 600;
  animation: pop .25s var(--ease);
}
.token.in-line { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 4px 0 #4B2FC4; }
.row-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* resultados */
.results { max-width: 640px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 4vh; }
.results h1 { font-size: clamp(34px, 6vw, 52px); }
.results .score { font-size: 24px; color: var(--ink-2); }
.results .stars.lg svg { animation: starpop .6s var(--ease) both; }
.results .stars.lg svg:nth-child(2) { animation-delay: .15s; }
.results .stars.lg svg:nth-child(3) { animation-delay: .3s; }
.pb { background: #FFF3D1; color: #8A5A00; padding: 8px 18px; border-radius: 999px; font-weight: 700; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.review-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 17px; }
.review-row .mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-weight: 700; }
.review-row .mark.ok { background: var(--good); }
.review-row .mark.no { background: var(--bad); }

/* progreso */
.stat-row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.stat .n { font-size: 36px; font-weight: 700; }
.stat .l { color: var(--ink-2); font-weight: 500; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 18px 12px; }
.medal .disc { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: #FFF3D1; }
.medal .disc svg { width: 46px; height: 46px; }
.medal.off { opacity: .45; filter: grayscale(1); }
.medal b { font-size: 18px; }
.medal span { font-size: 15px; color: var(--ink-2); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.list-row .name { flex: 1; font-weight: 600; }

/* ── modal, toast, carga ───────────────────────────────────────────────── */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(35, 38, 74, .45); display: grid; place-items: center; padding: 20px; animation: fade .2s both; }
.modal { background: var(--surface); border-radius: 26px; padding: 28px; width: min(100%, 440px); text-align: center; box-shadow: var(--shadow-lg); animation: rise .3s var(--ease) both; }
.modal h2 { font-size: 26px; margin-bottom: 10px; }
.modal p { color: var(--ink-2); margin-bottom: 22px; }
.modal .row-actions .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 16px; font-weight: 600; box-shadow: var(--shadow-lg); animation: rise .3s var(--ease) both; max-width: calc(100% - 32px); }
.loading { display: grid; place-items: center; min-height: 50vh; }
.spinner { width: 56px; height: 56px; border-radius: 50%; border: 6px solid #E3DEFF; border-top-color: var(--brand); animation: spin .9s linear infinite; }
.skeleton { border-radius: var(--radius); background: linear-gradient(90deg, #ECEEF6 0, #F7F8FC 50%, #ECEEF6 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; min-height: 160px; }

/* ── animaciones ───────────────────────────────────────────────────────── */
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: -200% 0; } }
.shake { animation: shake .45s ease both; }
.pop { animation: pop .4s var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ── móvil ─────────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  body { font-size: 17px; }
  .brand-name { display: none; }
  .chip-user { padding-right: 10px; }
  .options { grid-template-columns: 1fr; }
  .match-card { min-height: 84px; }
  .match-card .art { width: 64px; height: 64px; }
  .sort-card { width: 104px; }
  .sort-card .art { width: 62px; height: 62px; }
}

/* ── modo pizarra (proyector) ──────────────────────────────────────────── */
.board-mode { position: fixed; inset: 0; z-index: 50; overflow: auto; background: var(--bg); }
.board-mode .player-top .title { font-size: 26px; }
.board-mode .instructions { font-size: 28px; }
.board-mode .prompt { font-size: clamp(32px, 4.4vw, 54px); }
.board-mode .opt { min-height: 100px; font-size: clamp(26px, 3.2vw, 38px); }
.board-mode .media .art { width: clamp(200px, 26vw, 320px); height: clamp(200px, 26vw, 320px); }
.board-mode .match { max-width: 1200px; }
.board-mode .match-card { min-height: 120px; font-size: clamp(26px, 3vw, 36px); }
.board-mode .match-card .art { width: 104px; height: 104px; }
.board-mode .token { min-height: 80px; font-size: clamp(28px, 3vw, 38px); }
.board-mode .sort-card { width: 160px; font-size: 22px; }
.board-mode .sort-card .art { width: 100px; height: 100px; }
.board-mode .stage { max-width: 1300px; }
.teams { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 6px 20px 0; }
.team { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 18px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: 22px; border: 4px solid transparent; transition: border-color .2s, transform .2s; }
.team.turn { border-color: var(--accent); transform: scale(1.06); }
.team .pts { min-width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-size: 22px; padding: 0 10px; }
.team .adj { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #F1F2F8; font-weight: 700; font-size: 20px; }

/* ==========================================================================
   TEMA v2 — más contraste entre fondo y cajas, colores por sección,
   perfil, tienda y avisos.
   ========================================================================== */
:root {
  --bg: #E9ECFA;
  --line: #DCE0F2;
  --card-line: #DFE3F4;
  --card-shadow: 0 5px 0 #D3D9EE, 0 14px 28px rgba(35, 38, 74, .08);
  --card-shadow-hover: 0 8px 0 #CBD2EB, 0 20px 36px rgba(35, 38, 74, .12);
}
body {
  background:
    radial-gradient(circle at 0% 0%, rgba(167, 139, 250, .22) 0, transparent 34%),
    radial-gradient(circle at 100% 100%, rgba(45, 212, 191, .18) 0, transparent 36%),
    radial-gradient(circle at 100% 0%, rgba(251, 191, 36, .14) 0, transparent 28%),
    var(--bg);
  background-attachment: fixed;
}
.topbar { background: rgba(255, 255, 255, .92); border-bottom: 2px solid var(--card-line); box-shadow: 0 2px 10px rgba(35, 38, 74, .05); }
.card, .tile, .stat, .medal, .shop-item, .results.card {
  border: 2px solid var(--card-line);
  box-shadow: var(--card-shadow);
}
button.tile:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-3px); }
button.tile:active { box-shadow: 0 2px 0 #D3D9EE; transform: translateY(3px); }
.btn-ghost, .back-btn, .icon-btn, .chip-user { border: 2px solid var(--card-line); box-shadow: 0 3px 0 #D3D9EE; }
.icon-btn.on { border-color: var(--brand); }
.star-inline { display: inline-flex; width: 1.1em; height: 1.1em; vertical-align: -0.15em; }
.star-inline svg { width: 100%; height: 100%; }
.stars svg { width: 22px; height: 22px; }
.stars.lg svg { width: 54px; height: 54px; }
.stars-count { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.small { font-size: 14px; }
.btn-good { background: #16A34A; box-shadow: 0 4px 0 #0F7A37; }
.btn-bad { background: #E5484D; box-shadow: 0 4px 0 #B4262B; }
.btn-white { background: #fff; color: var(--brand); box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.btn-buy { background: linear-gradient(135deg, #FBBF24, #F59E0B); color: #4A2A00; box-shadow: 0 4px 0 #C27803; }
.btn-sm { min-height: 44px; padding: 0 18px; font-size: 17px; }
.btn-buy .star-on { color: #fff; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .25)); }
.btn-buy .star-inline { width: 20px; height: 20px; }
.link-btn { border: 0; background: none; color: var(--brand); font-weight: 700; text-decoration: underline; padding: 4px; }
.form-msg.info { color: var(--ink-2); }

/* cabecera de color (hero) */
.hero {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  border-radius: 28px; padding: 26px 28px; margin-bottom: 8px; color: #fff;
  background: linear-gradient(135deg, #7C5CFC, #5236C9);
  box-shadow: 0 6px 0 rgba(35, 38, 74, .18), 0 18px 34px rgba(35, 38, 74, .12);
  animation: rise .45s var(--ease) both;
}
.hero .grow { flex: 1; min-width: 200px; position: relative; z-index: 1; }
.hero h1 { color: #fff; font-size: clamp(30px, 4vw, 42px); text-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.hero .sub { color: rgba(255, 255, 255, .92); font-size: 18px; margin-top: 4px; }
.hero-kicker { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; opacity: .9; }
.hero-art { position: absolute; right: -16px; bottom: -26px; width: 160px; height: 160px; opacity: .22; pointer-events: none; }
.hero .back-btn { background: rgba(255, 255, 255, .2); color: #fff; border-color: rgba(255, 255, 255, .35); box-shadow: none; position: relative; z-index: 1; }
.hero .btn, .hero .balance-pill { position: relative; z-index: 1; }
.hero-home { background: linear-gradient(135deg, #7C5CFC, #4F46E5); }
.hero-progress { background: linear-gradient(135deg, #10B981, #0F766E); }
.hero-shop { background: linear-gradient(135deg, #F472B6, #F59E0B); }
.hero-shop .hero-art { opacity: .35; }

/* colores de las secciones */
.sec-vocabulary { --c1: #38BDF8; --c2: #0369A1; --tint: #E0F2FE; --ink-sec: #075985; }
.sec-grammar { --c1: #A78BFA; --c2: #6D28D9; --tint: #EDE9FE; --ink-sec: #5B21B6; }
.sec-challenge { --c1: #FBBF24; --c2: #C2410C; --tint: #FEF3C7; --ink-sec: #92400E; }
.hero.sec-vocabulary, .hero.sec-grammar, .hero.sec-challenge { background: linear-gradient(135deg, var(--c1), var(--c2)); }

/* cabecera de unidad */
.unit-head { display: flex; align-items: center; gap: 14px; margin: 28px 0 14px; flex-wrap: wrap; }
.unit-head h2 { font-size: clamp(24px, 3vw, 30px); flex: 1; min-width: 200px; }
.unit-art { width: 58px; height: 58px; border-radius: 16px; background: #fff; border: 2px solid var(--card-line); padding: 6px; box-shadow: 0 3px 0 #D3D9EE; }
.unit-meta { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--card-line); border-radius: 999px; padding: 8px 16px; font-weight: 600; box-shadow: 0 3px 0 #D3D9EE; }
.unit-meta .bar { width: 120px; flex: none; }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }

/* tarjetas de sección */
.tile-section { padding: 0; gap: 0; min-height: 0; }
.sec-band { display: flex; align-items: center; gap: 14px; padding: 18px 20px; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.sec-band h3 { font-size: 26px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.sec-sub { font-size: 15px; font-weight: 600; opacity: .95; }
.sec-icon { width: 58px; height: 58px; border-radius: 18px; background: rgba(255, 255, 255, .25); display: grid; place-items: center; flex: none; }
.sec-icon svg { width: 34px; height: 34px; }
.sec-body { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, var(--tint), #fff 70%); }
.sec-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.sec-body .bar > i { background: var(--c2); }
.sec-body .play { color: var(--ink-sec); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.sec-body .play svg { width: 20px; height: 20px; }

/* tarjetas de actividad */
.tile-act { border-top: 6px solid var(--c2, var(--brand)); }
.tile-act .tpl-icon { background: linear-gradient(135deg, var(--c1, #8B5CF6), var(--c2, #6D28D9)); }

/* niveles de los retos */
.level-head { display: flex; align-items: center; gap: 12px; margin: 24px 0 12px; }
.level-chip { display: inline-flex; align-items: center; padding: 6px 18px; border-radius: 999px; font-weight: 800; color: #fff; font-size: 18px; letter-spacing: .02em; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
.level-chip.small { padding: 3px 12px; font-size: 14px; box-shadow: none; }
.lv-easy { background: #16A34A; }
.lv-medium { background: #D97706; }
.lv-hard { background: #DC2626; }

/* resultados */
.results.card { padding: 32px 24px; border-radius: 30px; margin-top: 2vh; }
.shop-hint { display: flex; align-items: center; gap: 10px; border: 2px dashed #F59E0B; background: #FFFBEB; color: #92400E; font-weight: 700; border-radius: 16px; padding: 12px 18px; }

/* progreso y medallas */
.stat { display: flex; align-items: center; gap: 14px; }
.stat-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; color: #fff; }
.stat-icon svg { width: 30px; height: 30px; }
.st-stars { background: linear-gradient(135deg, #FFF8DB, #fff 70%); border-color: #F6DC8C; }
.st-stars .stat-icon { background: #F59E0B; }
.st-done { background: linear-gradient(135deg, #E3F7EE, #fff 70%); border-color: #A7E3C6; }
.st-done .stat-icon { background: #16A34A; }
.st-perfect { background: linear-gradient(135deg, #EDE9FE, #fff 70%); border-color: #CBBEFB; }
.st-perfect .stat-icon { background: #7C3AED; }
.medal { background: #fff; border-radius: var(--radius); }
.medal.on { background: linear-gradient(180deg, #FFF6D5 0%, #fff 75%); border-color: #F2CF6B; box-shadow: 0 5px 0 #EBCB6E, 0 14px 28px rgba(35, 38, 74, .08); }
.medal.on .disc { background: radial-gradient(circle at 35% 30%, #FFE58A, #F59E0B); color: #fff; box-shadow: 0 4px 0 #D08A06; }
.medal.off { background: #F3F4FA; border: 2px dashed #C9CFE5; box-shadow: none; opacity: 1; filter: none; }
.medal.off .disc { background: #E4E7F2; color: #A3A9C4; }
.medal.off b, .medal.off span { color: #8A90B0; }
.medal .disc svg { width: 44px; height: 44px; }
.progress-card { margin-top: 18px; }
.progress-card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.progress-card-head h3 { font-size: 22px; }
.progress-sec { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 6px 12px; border-radius: 12px; background: var(--tint); color: var(--ink-sec); font-weight: 700; }

/* topbar: tienda, perfil y burbujas de aviso */
.with-badge { position: relative; }
.notif {
  position: absolute; top: -7px; right: -7px; min-width: 24px; height: 24px; border-radius: 999px;
  background: #EF4444; color: #fff; font-weight: 800; font-size: 15px; line-height: 1;
  display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(239, 68, 68, .45);
  animation: pop .4s var(--ease) both, pulse 2s 1s infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.shop-btn { background: #FEF3C7; color: #B45309; border-color: #F6DC8C; }
.chip-user { border: 2px solid var(--card-line); cursor: pointer; font: inherit; color: inherit; }
.chip-user:hover { border-color: #C9C0FF; }
.chip-stars { display: inline-flex; align-items: center; gap: 4px; background: #FEF3C7; color: #92400E; border-radius: 999px; padding: 2px 10px; font-weight: 800; }
.avatar { background: none; }

/* ventanas */
.modal { border: 2px solid var(--card-line); }
.modal .kicker { color: #16A34A; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.modal-choice .row-actions .btn { min-width: 120px; }
.unlock-art { width: 150px; height: 150px; margin: 0 auto 12px; animation: starpop .7s var(--ease) both; }
.unlock-art.round svg { border-radius: 50%; box-shadow: 0 8px 22px rgba(35, 38, 74, .2); }

/* perfil */
.profile-modal { width: min(100%, 540px); padding-top: 24px; }
.profile-avatar { width: 124px; height: 124px; margin: 0 auto 8px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 0 4px #C4B5FD, 0 10px 24px rgba(35, 38, 74, .18); overflow: hidden; }
.profile-modal h2 { margin-bottom: 14px; }
.profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
.pstat { background: #F4F2FF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.pstat-gold { background: #FFF8DB; }
.pnum { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.plabel { color: var(--ink-2); font-weight: 600; font-size: 15px; }
.pstat .bar { width: 100%; }
.profile-sub { font-size: 18px; margin: 18px 0 10px; color: var(--ink-2); }
.owned-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.mini-av { position: relative; width: 66px; height: 66px; border-radius: 50%; border: 4px solid transparent; padding: 0; background: none; }
.mini-av .mini-art, .mini-av .mini-art svg { width: 100%; height: 100%; display: block; }
.mini-av.on { border-color: var(--brand); box-shadow: 0 0 0 3px #DDD6FE; }
.fx-chip { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--card-line); background: #fff; border-radius: 999px; padding: 4px 14px 4px 4px; font-weight: 700; }
.fx-chip-art { width: 34px; height: 34px; display: flex; }
.fx-chip.on { border-color: var(--brand); background: #F4F2FF; }
.new-tag { position: absolute; top: -8px; right: -8px; background: #EF4444; color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; border: 2px solid #fff; }

/* tienda */
.balance-pill { display: flex; align-items: center; gap: 8px; background: #fff; color: #92400E; border-radius: 20px; padding: 10px 18px; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.balance-pill b { font-size: 32px; }
.balance-pill .star-inline { width: 30px; height: 30px; }
.shop-note { margin: 14px 4px 0; color: var(--ink-2); font-weight: 500; }
.shop-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.shop-item { background: #fff; border-radius: 22px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: rise .45s var(--ease) both; }
.shop-item b { font-size: 19px; }
.shop-art { width: 104px; height: 104px; }
.shop-art.round svg { border-radius: 50%; }
.shop-item.using { border-color: #16A34A; box-shadow: 0 5px 0 #8FD8AE, 0 14px 28px rgba(35, 38, 74, .08); background: linear-gradient(180deg, #ECFDF3, #fff 70%); }
.shop-item.too-dear .shop-art { filter: grayscale(.85); opacity: .6; }
.chip-using { display: inline-flex; align-items: center; gap: 6px; background: #DCFCE7; color: #166534; font-weight: 800; padding: 8px 16px; border-radius: 999px; }
.need { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.price-locked { display: inline-flex; align-items: center; gap: 4px; background: #F1F2F8; color: var(--ink-3); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.fx-canvas { position: fixed; inset: 0; z-index: 400; pointer-events: none; }

/* ==========================================================================
   v3 — Review (listening), super estrellas, ruleta y Class rewards
   ========================================================================== */
.badge-review { background: #DCFCE7; color: #166534; }
.kind-review { background: #10B981; }
.btn-yellow { background: #FFC53D; color: #3B2A00; box-shadow: 0 4px 0 #D99A00; }
.btn-super { background: linear-gradient(135deg, #EC4899, #8B5CF6); color: #fff; box-shadow: 0 4px 0 #6D28D9; }
.btn-super .star-inline { width: 20px; height: 20px; }

/* listening: tarjetas numeradas */
.listen-bar { width: 100%; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.listen-bar .grow { flex: 1; }
.listen-hint, .listen-count { font-weight: 700; font-size: 19px; }
.listen-tip { font-size: 15px; }
.score-pill { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 2px solid var(--card-line); border-radius: 999px; padding: 6px 16px; font-weight: 800; box-shadow: 0 3px 0 #D3D9EE; }
.vocab-grid { width: 100%; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(46%, 170px), 1fr)); }
.vcard {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 22px;
  background: #fff; border: 3px solid var(--card-line); box-shadow: 0 5px 0 #D3D9EE;
  transition: transform .15s var(--ease), border-color .2s, box-shadow .2s;
}
.vcard:hover { transform: translateY(-2px); }
.vcard:active { transform: translateY(2px); box-shadow: 0 2px 0 #D3D9EE; }
.vcard.active { border-color: var(--brand); }
.vcard.heard::after { content: '\2713'; position: absolute; top: 8px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px; }
.vcard.correct { border-color: var(--good); box-shadow: 0 5px 0 #8FD8AE; background: var(--good-bg); }
.vcard.wrong { border-color: var(--bad); background: var(--bad-bg); }
.vnum { position: absolute; top: 4px; left: 4px; z-index: 1; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid #23264A; font-weight: 800; display: grid; place-items: center; font-size: 16px; }
.vtile { border-radius: 16px; aspect-ratio: 4 / 3; display: grid; place-items: center; padding: 8px; }
.vtile .art, .vtile svg { width: 78%; height: 100%; }
.vlabel { font-weight: 800; font-size: clamp(17px, 2vw, 22px); text-align: center; min-height: 1.5em; }
.vlabel.hidden { border-bottom: 3px dashed #B8BED6; margin: 0 12px 6px; }
.board-mode .vocab-grid { grid-template-columns: repeat(4, 1fr); }
.board-mode .vlabel { font-size: 28px; }
.board-mode .vnum { width: 44px; height: 44px; font-size: 20px; }

/* super estrellas */
.chip-super { display: inline-flex; align-items: center; gap: 4px; background: #F5E8FF; color: #7E22CE; border-radius: 999px; padding: 2px 10px; font-weight: 800; }
.balance-pills { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.balance-pill.super { color: #7E22CE; }
.super-title { color: #7E22CE; display: flex; align-items: center; gap: 8px; }
.super-note { margin-top: -6px; margin-bottom: 12px; color: #7E22CE; }
.shop-item.super { background: linear-gradient(180deg, #FAF5FF, #fff 70%); border-color: #E9D5FF; box-shadow: 0 5px 0 #DDC6F7, 0 14px 28px rgba(35, 38, 74, .08); }
.pstat-super { background: #FAF5FF; grid-column: 1 / -1; }
.psmall { font-size: 13px; color: var(--ink-3); }
.kicker-super { color: #9333EA; }

/* pizarra: unidades desplegables */
.unit-block { display: flex; flex-direction: column; gap: 10px; }
.unit-toggle {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border-radius: 18px;
  background: #fff; border: 2px solid var(--card-line); box-shadow: 0 4px 0 #D3D9EE; padding: 10px 16px; font-weight: 700;
}
.unit-toggle:hover { border-color: #C9C0FF; }
.unit-toggle-art { width: 46px; height: 46px; flex: none; }
.unit-toggle-title { font-size: 22px; flex: 1; }
.unit-toggle .chev { width: 26px; height: 26px; display: flex; transform: rotate(-90deg); transition: transform .25s var(--ease); }
.unit-toggle.open .chev { transform: rotate(90deg); }
.unit-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px 12px; border-left: 4px solid #E4E0FF; margin-left: 20px; }
.unit-body[hidden] { display: none; }
.kind-head { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-weight: 600; }
.pill-test { background: #FEF3C7; color: #92400E; margin-left: 8px; }
.super-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.super-cell .t-mini { min-width: 30px; padding-left: 0; padding-right: 0; font-size: 16px; line-height: 1; }
.super-net { min-width: 24px; text-align: center; color: #7E22CE; }
.super-net.neg { color: #DC2626; }
/* ── Homework (verde azulado) ── */
.sec-homework { --c1: #2DD4BF; --c2: #0F766E; --tint: #CCFBF1; --ink-sec: #115E59; }
.hero.sec-homework { background: linear-gradient(135deg, var(--c1), var(--c2)); }
.badge-homework { background: #CCFBF1; color: #115E59; }
.kind-homework { background: linear-gradient(135deg, #2DD4BF, #0F766E); }
.tile-section.sec-homework { overflow: visible; }
.tile-section.sec-homework .sec-band { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
.hw-todo { position: absolute; top: -12px; right: 12px; z-index: 2; background: #EF4444; color: #fff; font-weight: 800; font-size: 14px;
  padding: 5px 12px; border-radius: 999px; box-shadow: 0 3px 0 #B91C1C; animation: hwPulse 1.6s ease-in-out infinite; }
@keyframes hwPulse { 50% { transform: scale(1.08); } }
.hw-new { background: #FEF3C7; color: #92400E; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.hw-done { background: #DCFCE7; color: #166534; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.hw-banner { border: 3px solid #5EEAD4; background: linear-gradient(135deg, #F0FDFA, #CCFBF1); margin-bottom: 20px; padding: 18px 20px; }
.hw-banner-head { display: flex; align-items: center; gap: 14px; }
.hw-banner-head h2 { margin: 0; color: #115E59; }
.hw-banner-head p { margin: 2px 0 0; font-weight: 600; color: #134E4A; }
.hw-banner-icon { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #2DD4BF, #0F766E); color: #fff; display: grid; place-items: center; flex: none; }
.hw-banner-icon svg { width: 30px; height: 30px; }
.hw-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.hw-item { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 14px; padding: 10px 16px; background: #0D9488; color: #fff;
  font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 #115E59; }
.hw-item svg { width: 18px; height: 18px; }

/* ── Vídeos (rosa pastel) ── */
.sec-videos { --c1: #FBCFE8; --c2: #F9A8D4; --tint: #FDF2F8; --ink-sec: #9D174D; }
.sec-videos .sec-band, .hero.sec-videos { background: linear-gradient(135deg, #FCE7F3, #F9A8D4); color: #831843; }
.sec-videos .sec-band h3 { color: #831843; text-shadow: none; }
.sec-videos .sec-icon { background: rgba(255, 255, 255, .6); color: #DB2777; }
.sec-videos .play { color: #BE185D; }
.hero.sec-videos h1, .hero.sec-videos .sub, .hero.sec-videos .hero-kicker { color: #831843; text-shadow: none; }
.hero.sec-videos .back-btn { color: #831843; background: rgba(255, 255, 255, .55); border-color: rgba(131, 24, 67, .2); }
.badge-videos { background: #FCE7F3; color: #9D174D; }
.kind-videos { background: linear-gradient(135deg, #F9A8D4, #EC4899); }
.video-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.video-tile { padding: 0; overflow: hidden; text-align: left; border: 3px solid #FBCFE8; }
.video-tile h3 { padding: 12px 16px 16px; font-size: 18px; }
.video-thumb { position: relative; aspect-ratio: 16 / 9; background: #FCE7F3; }
.video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: rgba(236, 72, 153, .92); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); }
.video-play svg { width: 30px; height: 30px; margin-left: 4px; }
.video-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(20, 10, 30, .85); display: grid; place-items: center; padding: 16px; }
.video-box { width: min(1200px, 100%); background: #FDF2F8; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.video-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; color: #831843; }
.video-wrap { position: relative; aspect-ratio: 16 / 9; max-height: calc(100vh - 110px); background: #000; }
.video-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ── Vídeo con actividades dentro (video_quiz) ── */
.video-quiz-chip { position: absolute; left: 10px; top: 10px; background: #fff; color: #BE185D; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
.video-foot { padding: 0 16px 14px; }
.vq { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 10px; }
.vq:fullscreen { max-width: none; background: #1E1029; padding: 12px; justify-content: center; }
.vq:fullscreen .vq-status { color: #fff; }
.vq-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vq-status { font-weight: 800; color: var(--ink-2); flex: 1; }
.vq-toggle { display: inline-flex; align-items: center; gap: 10px; border: 2px solid #F9A8D4; background: #fff; color: #9D174D; border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 800; font-size: 16px; }
.vq-dot { width: 44px; height: 24px; border-radius: 999px; background: #CBD5E1; position: relative; transition: background .2s; }
.vq-dot::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.vq-toggle.on .vq-dot { background: #EC4899; }
.vq-toggle.on .vq-dot::after { transform: translateX(20px); }
.vq-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 210px); background: #000; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.vq:fullscreen .vq-wrap { max-height: calc(100vh - 80px); border-radius: 0; }
.vq-player, .vq-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vq-overlay { position: absolute; inset: 0; background: rgba(30, 16, 41, .72); display: grid; place-items: center; padding: 16px; z-index: 2; }
.vq-card { background: #fff; border-radius: 24px; padding: 18px 22px; width: min(640px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; border: 4px solid #F9A8D4; }
.vq-type { background: #FCE7F3; color: #9D174D; font-weight: 800; border-radius: 999px; padding: 4px 14px; font-size: 15px; }
.vq-card .prompt { font-size: clamp(20px, 3vw, 30px); }
.vq-options { width: 100%; }
.opt.tf-true { border-color: #86EFAC; }
.opt.tf-false { border-color: #FCA5A5; }
.vq-end { text-align: center; background: #FDF2F8; border: 2px dashed #F9A8D4; border-radius: 18px; padding: 14px; font-weight: 700; color: #9D174D; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.board-mode .vq { max-width: none; }
/* El atributo hidden debe ganar a display:grid/flex (si no, la capa vacía tapa el vídeo y no deja darle a Play). */
.vq-overlay[hidden], .vq-end[hidden] { display: none !important; }

/* ── Panel: pestañas de grupo y deberes ── */
.g-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.g-chip { border: 2px solid var(--card-line); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.g-chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.g-chip.legacy { border-style: dashed; border-color: #F59E0B; }
.g-count { background: rgba(0, 0, 0, .08); border-radius: 999px; padding: 0 8px; font-size: 13px; }
.g-chip.on .g-count { background: rgba(255, 255, 255, .25); }
.t-select-sm { padding: 4px 8px; min-height: 0; font-size: 14px; width: auto; min-width: 84px; }
.t-select-sm.warn { border-color: #F59E0B; background: #FFFBEB; }
.hw-course { margin: 18px 0 6px; }
.hw-unit { font-weight: 800; color: var(--brand); margin: 8px 0; }
.hw-row { border: 1px solid var(--card-line); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.hw-groups { display: flex; flex-wrap: wrap; gap: 10px; }
.hw-chip { display: flex; align-items: center; gap: 10px; border: 2px solid var(--card-line); border-radius: 12px; padding: 6px 8px 6px 12px; background: #fff; }
.hw-chip.on { border-color: #2DD4BF; background: #F0FDFA; }
.hw-state { font-size: 13px; }
.t-super-bar { background: #FAF5FF; border: 1px solid #E9D5FF; border-radius: 14px; padding: 8px 12px; margin: 4px 0 12px; }

/* ruleta */
.wheel-mini {
  position: fixed; right: 22px; bottom: 22px; z-index: 60; width: 150px; height: 168px; border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px; filter: drop-shadow(0 8px 16px rgba(35, 38, 74, .3));
  transition: transform .2s var(--ease); animation: pop .5s var(--ease) both;
}
.wheel-mini:hover { transform: scale(1.06) rotate(-4deg); }
.board-mode:has(.wheel-mini) .stage, .board-mode:has(.wheel-mini) .board-results { padding-bottom: 190px; }
.wheel-mini-svg, .wheel-mini-svg svg { width: 140px; height: 140px; display: block; }
.wheel-mini-count { background: #23264A; color: #fff; border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: 14px; }
.wheel-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(35, 38, 74, .72); display: grid; place-items: center; animation: fade .3s both; }
.wheel-overlay.out { animation: fade .35s reverse both; }
.wheel-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; transform-origin: 100% 100%; animation: wheelZoom .7s var(--ease) both; }
.wheel-stage.out { animation: wheelZoom .38s var(--ease) reverse both; }
@keyframes wheelZoom { from { transform: translate(38vw, 38vh) scale(.18); opacity: .4; } to { transform: none; opacity: 1; } }
.wheel-big, .wheel-big svg { width: min(56vh, 80vw); height: min(56vh, 80vw); display: block; }
.wheel-result { min-height: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
.wheel-num { font-size: clamp(70px, 12vh, 120px); font-weight: 800; line-height: 1; background: #FFC53D; color: #23264A; border-radius: 28px; padding: 6px 34px; box-shadow: 0 8px 0 #C27803; }
.wheel-who { font-size: 30px; font-weight: 800; }
.wheel-info { color: rgba(255, 255, 255, .85); font-weight: 600; }
.wheel-stage .link-btn { color: #fff; }

/* Class rewards */
.rewards-screen { min-height: 100vh; display: grid; place-items: center; padding: 30px; background:
  radial-gradient(circle at 50% 30%, rgba(255, 213, 74, .35) 0, transparent 45%),
  linear-gradient(160deg, #4C1D95, #7C3AED 55%, #DB2777); color: #fff; position: relative; }
.rw-close { position: absolute; top: 20px; left: 20px; }
.rw-panel, .rw-done { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.rw-panel h1, .rw-done h1 { color: #fff; font-size: clamp(40px, 6vw, 72px); text-shadow: 0 4px 0 rgba(0, 0, 0, .2); }
.rw-kicker { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; opacity: .85; }
.rw-sub { font-size: clamp(22px, 3vw, 32px); font-weight: 600; color: #fff; }
.rw-stars { display: flex; align-items: flex-end; gap: clamp(8px, 2vw, 24px); margin: 18px 0 6px; }
.rw-star { border: 0; background: none; padding: 0; color: rgba(255, 255, 255, .28); transition: transform .2s var(--ease), color .2s; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .18)); }
.rw-star svg { width: 100%; height: 100%; }
.rw-star:hover { transform: scale(1.08); }
.rw-star.on { color: #FFD23F; filter: drop-shadow(0 0 18px rgba(255, 210, 63, .7)) drop-shadow(0 6px 0 rgba(0, 0, 0, .18)); }
.rw-star.preview { color: rgba(255, 210, 63, .6); }
.rw-star.bounce { animation: starpop .6s var(--ease) both; }
.rw-star.static { display: inline-block; animation: starpop .6s var(--ease) both; }
.rw-done-stars { display: flex; align-items: flex-end; gap: 10px; }
.rw-label { font-size: clamp(26px, 4vw, 44px); font-weight: 800; min-height: 1.3em; color: #FFE58A; }
.rw-give { font-size: 24px; min-height: 72px; padding: 0 36px; }
.rw-done .muted { color: rgba(255, 255, 255, .8); font-weight: 600; }
.rw-music { position: absolute; top: 20px; right: 20px; }
.rw-hint { font-size: 20px; font-weight: 700; color: rgba(255, 255, 255, .9); margin-top: -6px; }

/* cinemática de 5 estrellas */
.rw-cine {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(circle at 50% 45%, #5B21B6, #1E0B45 70%);
  animation: fade .35s both;
}
.rw-cine.out { animation: fade .45s reverse both; }
.rw-rays {
  position: absolute; width: 170vmax; height: 170vmax; left: 50%; top: 45%; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg, rgba(255, 214, 80, .28) 0deg 8deg, transparent 8deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 55%); mask-image: radial-gradient(circle, #000 0, transparent 55%);
  animation: raysIn .8s ease-out both, raysSpin 9s linear infinite;
}
@keyframes raysIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes raysSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.rw-bigstar {
  position: absolute; top: 45%; left: 50%; width: min(42vh, 60vw); height: min(42vh, 60vw); color: #FFD23F;
  transform: translate(-50%, -50%); filter: drop-shadow(0 0 40px rgba(255, 210, 63, .9)) drop-shadow(0 10px 0 rgba(0, 0, 0, .2));
  animation: bigStar 1.3s cubic-bezier(.2, 1.4, .4, 1) both, bigStarPulse 1.6s 1.3s ease-in-out infinite;
}
.rw-bigstar svg { width: 100%; height: 100%; }
@keyframes bigStar { 0% { transform: translate(-50%, -50%) scale(0) rotate(-540deg); } 70% { transform: translate(-50%, -50%) scale(1.18) rotate(15deg); } 100% { transform: translate(-50%, -50%) scale(1) rotate(0); } }
@keyframes bigStarPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.06); } }
.rw-cine-text {
  position: absolute; top: 76%; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: clamp(46px, 9vw, 120px); font-weight: 800; color: #fff; letter-spacing: .04em;
  text-shadow: 0 6px 0 #B45309, 0 0 30px rgba(255, 210, 63, .9);
  animation: cineText .7s .9s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes cineText { from { opacity: 0; transform: translateX(-50%) scale(.3); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.rw-cine-sub { position: absolute; top: 90%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700; color: #FFE58A; animation: fade .5s 1.4s both; }
@media (prefers-reduced-motion: reduce) { .rw-cine { display: none; } }
.rw-give:disabled { opacity: .5; }

/* ==========================================================================
   v4 — Extra (minijuegos), Class rewards espacial y tarjeta de jugador
   ========================================================================== */
.sec-extra { --c1: #D946EF; --c2: #6B21A8; --tint: #FAE8FF; --ink-sec: #6B21A8; }
.hero.sec-extra { background: linear-gradient(135deg, var(--c1), var(--c2)); }
.badge-extra { background: #F3E8FF; color: #6B21A8; }
.kind-extra { background: linear-gradient(135deg, #D946EF, #6B21A8); }

/* avatar de la barra superior, más visible */
.chip-user .avatar { width: 44px; height: 44px; box-shadow: 0 0 0 3px #FFD23F; }
.chip-user .avatar svg { width: 44px; height: 44px; }
.chip-user { padding: 4px 14px 4px 4px; }

/* teclado y piezas comunes de los minijuegos */
.hm-round { font-weight: 800; font-size: 20px; }
.hm-main { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.hm-left { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hm-draw { width: 190px; height: 200px; background: #fff; border-radius: 22px; border: 2px solid var(--card-line); box-shadow: 0 5px 0 #D3D9EE; padding: 8px; }
.hm-draw svg { width: 100%; height: 100%; }
.hm-lives { display: flex; gap: 5px; }
.hm-life { width: 14px; height: 14px; border-radius: 50%; background: #E4E7F2; }
.hm-life.on { background: #EF4444; }
.hm-right { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hm-pic { width: 130px; height: 130px; border-radius: 22px; background: #FAE8FF; border: 3px dashed #D8B4FE; display: grid; place-items: center; }
.hm-pic svg { width: 88%; height: 88%; }
.hm-q { font-size: 64px; font-weight: 800; color: #C084FC; }
.hm-word { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.hm-slot { width: 48px; height: 60px; border-bottom: 5px solid #23264A; display: grid; place-items: center; font-size: 36px; font-weight: 800; color: #23264A; }
.hm-slot.shown { animation: pop .3s var(--ease); }
.hm-slot.missed { color: #DC2626; }
.hm-gap { width: 26px; }
.hm-keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: 100%; max-width: 720px; }
.hm-key { min-height: 54px; border-radius: 14px; border: 2px solid var(--card-line); background: #fff; font-size: 22px; font-weight: 800; box-shadow: 0 4px 0 #D3D9EE; }
.hm-key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #D3D9EE; }
.hm-key.good { background: #DCFCE7; border-color: #16A34A; color: #166534; }
.hm-key.bad { background: #FEE2E2; border-color: #FCA5A5; color: #B91C1C; opacity: .7; }
.board-mode .hm-draw { width: 260px; height: 270px; }
.board-mode .hm-slot { width: 64px; height: 80px; font-size: 50px; }
.board-mode .hm-pic { width: 170px; height: 170px; }
.board-mode .hm-key { min-height: 66px; font-size: 28px; }

/* memory */
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: min(760px, calc((100vh - 250px) * 4 / 3)); min-width: 280px; margin: 0 auto; }
.mem-grid.big { max-width: min(900px, calc(100vh - 230px)); }
.mcard { border: 0; padding: 0; background: none; aspect-ratio: 1 / 1; perspective: 800px; }
.mcard-inner { position: relative; width: 100%; height: 100%; transition: transform .5s var(--ease); transform-style: preserve-3d; }
.mcard.up .mcard-inner { transform: rotateY(180deg); }
.mcard-back, .mem-face {
  position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0, 0, 0, .15);
}
.mcard-back { background: linear-gradient(135deg, #D946EF, #6B21A8); color: rgba(255, 255, 255, .85); border: 4px solid #fff; }
.mcard-back svg { width: 46%; height: 46%; }
.mem-face { transform: rotateY(180deg); background: #fff; border: 3px solid var(--card-line); padding: 8px; }
.mem-face.pic svg { width: 84%; height: 84%; }
.mem-face.word { font-weight: 800; font-size: clamp(16px, 2.4vw, 26px); text-align: center; color: #6B21A8; }
.mcard.done .mem-face { border-color: #16A34A; background: #ECFDF3; }
.board-mode .mem-face.word { font-size: clamp(22px, 2.6vw, 34px); }

/* what's missing */
.wm-title { margin-bottom: -4px; }
.wm-stage { position: relative; width: 100%; max-width: 820px; }
.wm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.wm-card { background: #fff; border: 3px solid var(--card-line); border-radius: 20px; box-shadow: 0 5px 0 #D3D9EE; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 150px; }
.wm-card b { font-size: 20px; }
.wm-pic { width: 96px; height: 96px; }
.wm-pic svg { width: 100%; height: 100%; }
.wm-card.empty { border: 4px dashed #C084FC; background: #FAF5FF; justify-content: center; }
.wm-card.empty span { font-size: 64px; font-weight: 800; color: #C084FC; }
.wm-card.found { border-color: #16A34A; background: #ECFDF3; }
.wm-curtain {
  position: absolute; inset: -6px; border-radius: 24px; background: linear-gradient(135deg, #6B21A8, #1E1B4B);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 34px;
  transform: scaleY(0); transform-origin: top; transition: transform .45s var(--ease); z-index: 2;
}
.wm-curtain.on { transform: scaleY(1); }
.wm-eyes { font-size: 70px; }
.board-mode .wm-pic { width: 140px; height: 140px; }
.board-mode .wm-card b { font-size: 28px; }

/* ── Class rewards: espacio ── */
.rewards-screen.space { background: radial-gradient(ellipse at 20% 15%, #1B1240 0, transparent 45%), radial-gradient(ellipse at 85% 80%, #0E2340 0, transparent 50%), #04030C; overflow: hidden; }
.space-stars { position: absolute; inset: 0; pointer-events: none; }
.space-stars i { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
.space-nebula { position: absolute; inset: -20%; pointer-events: none; opacity: .55;
  background: radial-gradient(circle at 70% 30%, rgba(139, 92, 246, .35) 0, transparent 30%), radial-gradient(circle at 25% 75%, rgba(236, 72, 153, .22) 0, transparent 28%);
  animation: nebula 30s ease-in-out infinite alternate; }
@keyframes nebula { to { transform: translate(3%, -3%) rotate(6deg); } }
.planet { position: absolute; border-radius: 50%; pointer-events: none; }

  <script>var Grading = (function GradingFactory_() {
  function norm(s) {
    return String(s === null || s === undefined ? '' : s)
      .toLowerCase()
      .replace(/[‘’]/g, "'")
      .replace(/[.,!?;:…"]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** ¿Es correcta la respuesta? Todas las plantillas actuales comparan texto normalizado. */
  function grade(template, item, response) {
    var r = norm(response);
    if (r === '') return false;
    switch (template) {
      case 'multiple_choice':
      case 'match_pairs':
      case 'drag_sort':
      case 'build_sentence':
      case 'listen_learn':
      case 'listen_point':
      case 'hangman':
      case 'memory':
      case 'whats_missing':
      case 'video_quiz':
        return r === norm(item.answer);
      default:
        return false;
    }
  }

  /** "These are my photos." → ["These", "are", "my", "photos"] */
  function sentenceTokens(answer) {
    return String(answer || '').replace(/[.!?]+\s*$/, '').split(/\s+/).filter(function (w) { return w !== ''; });
  }

  /** score 0–100 → 0–5 estrellas según umbrales [1★, 2★, 3★, 4★, 5★]. */
  function starsFor(score, thresholds) {
    var t = (thresholds && thresholds.length) ? thresholds : [20, 40, 60, 80, 95];
    var s = 0;
    for (var i = 0; i < t.length; i++) if (score >= t[i]) s = i + 1;
    return s;
  }

  return { norm: norm, grade: grade, sentenceTokens: sentenceTokens, starsFor: starsFor };

<script>
/* ==========================================================================
   js_effects — Efectos de celebración al terminar una actividad (tienda).
   CQ.Effects.play('fx-confetti')  → animación de ~3 s sobre la página.
   No se reproduce si el dispositivo pide "reducir movimiento".
   Para añadir un efecto: añade un generador a GEN con el mismo id que en
   Shop.gs (SHOP_ITEMS) y su icono en js_art.html.
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ;
  var COLORS = ['#FF6F91', '#FFC53D', '#3DDC97', '#4C8DFF', '#9B5DE5', '#FF8A3D'];
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  function star(ctx, x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = rot + Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
    }
    ctx.closePath();
    ctx.fill();
  }
  function heart(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.3);
    ctx.bezierCurveTo(x - s, y + s * 0.8, x, y + s * 1.1, x, y + s * 1.4);

    ctx.fill();
  }
  var fade = function (el, dur) { return Math.max(0, Math.min(1, (dur - el) / (dur * 0.25))); };

  var GEN = {
    'fx-confetti': {
      init: function (W, H) {
        var a = [];
        for (var i = 0; i < 150; i++) a.push({ x: rnd(0, W), y: rnd(-H * 0.6, -10), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), r: rnd(0, 6), vr: rnd(-0.2, 0.2), w: rnd(6, 11), h: rnd(10, 16), c: pick(COLORS) });
        return a;
      },
      step: function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr; },
      draw: function (ctx, p, el, dur) {
        ctx.save(); ctx.globalAlpha = fade(el, dur); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    },
    'fx-stars': {
      init: function (W, H) {
        var a = [];
        for (var i = 0; i < 70; i++) a.push({ x: W / 2 + rnd(-W * 0.2, W * 0.2), y: H + 20, vx: rnd(-5, 5), vy: rnd(-16, -9), s: rnd(8, 18), r: rnd(0, 6), vr: rnd(-0.15, 0.15), c: pick(['#FBBF24', '#F59E0B', '#FDE047', '#FFC53D']) });

      },
      step: function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.r += p.vr; },

      init: function (W, H) {
        var a = [];
        for (var i = 0; i < 45; i++) a.push({ x: rnd(0, W), y: H + rnd(10, H * 0.5), vy: rnd(-4, -2), ph: rnd(0, 6), s: rnd(8, 16), c: pick(['#F43F5E', '#FB7185', '#EC4899', '#F472B6']) });

      },
      step: function (p, el) { p.y += p.vy; p.x += Math.sin(el / 300 + p.ph) * 1.2; },
      draw: function (ctx, p, el, dur) { ctx.globalAlpha = fade(el, dur); ctx.fillStyle = p.c; heart(ctx, p.x, p.y, p.s); }
    },
    'fx-bubbles': {
      init: function (W, H) {
        var a = [];
        for (var i = 0; i < 55; i++) a.push({ x: rnd(0, W), y: H + rnd(10, H * 0.5), vy: rnd(-3.2, -1.5), ph: rnd(0, 6), r: rnd(8, 24) });

  <!-- client/js_engine -->
<script>
/* ==========================================================================
   js_engine — Motor de actividades.

   Cada PLANTILLA (multiple_choice, match_pairs…) solo sabe dibujar e
   interactuar. El MOTOR se encarga de todo lo común: cabecera, instrucciones,
   barra de progreso, corrección inmediata, intentos, tiempos, sonidos, equipos
   en modo pizarra y el resultado final.

   Contrato de una plantilla:
     CQ.Engine.register('nombre', {
       mount: function (ctx) { ... return { destroy: fn } (opcional) }
     });
   Desde la plantilla:
     ctx.attempt(itemId, response) → { correct: true | false | null }
         (null = modo "end": sin feedback hasta el final)
     ctx.setProgress(done, total)
     ctx.complete()
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ;
  var h = CQ.h;

  var PRAISE = ['Great job!', 'Well done!', 'Brilliant!', 'Super!', 'Fantastic!', 'You got it!', 'Excellent!'];
  var RETRY = ['Try again!', 'Not quite. Try again!', 'Almost! Have another go.'];
  var TEAM_COLORS = ['#6C4BEF', '#FF7A45', '#0E9F87', '#2D8CFF'];

  var templates = {};

  function register(name, def) { templates[name] = def; }

  /**
   * opts = { root, activity, mode:'student'|'board', teams:0..4, onFinish(result), onExit() }
   * result = { responses:[{itemId,response,tries,timeMs}], local:{correct,gradable,total}, teamScores }
   */
  function run(opts) {
    var activity = opts.activity;
    var tpl = templates[activity.template];
    var root = CQ.Util.clear(opts.root);
    if (!tpl) {
      root.appendChild(h('div', { class: 'empty' }, 'This activity is not available yet.'));
      return { destroy: function () {} };
    }
    var cfg = activity.config || {};
    var feedback = cfg.feedback === 'end' ? 'end' : 'instant';
    var items = cfg.shuffleItems === false ? activity.items.slice() : CQ.Util.shuffle(activity.items);
    var itemById = {};
    items.forEach(function (it) { itemById[it.itemId] = it; });

    var records = {};
    var lastAt = Date.now();
    var finished = false;
    var nTeams = opts.mode === 'board' ? Math.max(0, Math.min(4, opts.teams || 0)) : 0;
    var teamScores = [];
    for (var i = 0; i < nTeams; i++) teamScores.push(0);
    var turn = 0;

    /* ── cabecera ── */
    var progressBar = CQ.UI.bar(0, items.length);
    var soundBtn = h('button', {
      class: 'icon-btn' + (CQ.Sfx.enabled ? ' on' : ''),
      aria: { label: 'Sound', pressed: String(CQ.Sfx.enabled) },
      svg: CQ.Sfx.enabled ? CQ.Icons.sound : CQ.Icons.mute,
      onclick: function () {
        var on = CQ.Sfx.toggle();
        soundBtn.className = 'icon-btn' + (on ? ' on' : '');
        soundBtn.innerHTML = on ? CQ.Icons.sound : CQ.Icons.mute;
        soundBtn.setAttribute('aria-pressed', String(on));
      }
    });
    var exitBtn = h('button', { class: 'icon-btn', aria: { label: 'Exit' }, svg: CQ.Icons.close, onclick: askExit });
    var top = h('div', { class: 'player-top' },
      exitBtn,
      h('div', { class: 'title' }, activity.title),
      progressBar,
      soundBtn);

    var teamsEl = nTeams ? h('div', { class: 'teams', aria: { live: 'polite' } }) : null;

    var instr = activity.instructions ? h('div', { class: 'instructions' },
      CQ.Speech.supported ? h('button', {
        class: 'icon-btn', aria: { label: 'Listen to the instructions' }, svg: CQ.Icons.listen,
        onclick: function () { CQ.Speech.speak(activity.instructions); }
      }) : null,
      h('p', {}, activity.instructions)) : null;

    var stage = h('div', { class: 'stage' });
    var player = h('div', { class: 'player' }, top, teamsEl, instr, stage);
    root.appendChild(player);
    renderTeams();

    function renderTeams() {
      if (!teamsEl) return;
      CQ.Util.clear(teamsEl);
      teamScores.forEach(function (pts, t) {
        teamsEl.appendChild(h('div', { class: 'team' + (t === turn ? ' turn' : '') },
          h('span', {}, 'Team ' + (t + 1)),
          h('span', { class: 'pts', style: { background: TEAM_COLORS[t] } }, String(pts)),
          h('button', { class: 'adj', aria: { label: 'Team ' + (t + 1) + ' minus one' }, onclick: function () { teamScores[t] = Math.max(0, teamScores[t] - 1); renderTeams(); } }, '−'),
          h('button', { class: 'adj', aria: { label: 'Team ' + (t + 1) + ' plus one' }, onclick: function () { teamScores[t]++; renderTeams(); } }, '+')));
      });
    }

    function askExit() {
      var text = opts.mode === 'board' ? null : 'Your answers will not be saved.';
      CQ.UI.confirm('Stop playing?', text, 'Stop', 'Keep playing').then(function (yes) {
        if (yes) { destroy(); opts.onExit && opts.onExit(); }
      });
    }

    /* ── contexto para la plantilla ── */
    var ctx = {
      el: stage,
      h: h,
      art: CQ.Art,
      activity: activity,
      config: cfg,
      items: items,
      mode: opts.mode,
      feedback: feedback,
      praise: function () { return CQ.Util.pick(PRAISE); },
      retry: function () { return CQ.Util.pick(RETRY); },
      shuffle: CQ.Util.shuffle,

      /** opts.silent = true → no leer en voz alta la respuesta (las plantillas de listening ya lo hacen). */
      attempt: function (itemId, response, opts) {
        var item = itemById[itemId];
        var silent = !!(opts && opts.silent);
        if (!item || finished) return { correct: null };
        var gradable = feedback === 'instant' && item.answer !== undefined;
        var correct = gradable ? Grading.grade(activity.template, item, response) : null;
        var now = Date.now();
        var rec = records[itemId];
        if (!rec) {
          rec = records[itemId] = { itemId: itemId, response: String(response), tries: 1, timeMs: now - lastAt, correct: correct, solved: false };
        } else if (!rec.solved) {
          rec.tries++;
        }
        if (correct === true) rec.solved = true;
        lastAt = now;

        if (correct === true) {
          CQ.Sfx.play('correct');
          if (CQ.Sfx.enabled && item.say && !silent) setTimeout(function () { CQ.Speech.speak(item.say); }, 250);
        } else if (correct === false) {
          CQ.Sfx.play('wrong');
        } else {
          CQ.Sfx.play('tap');
        }
        if (nTeams && !(opts && opts.noTurn)) {
          if (correct === true) teamScores[turn]++;
          // opts.keepTurn: si acierta, el mismo equipo vuelve a jugar (Memory)
          if (!(opts && opts.keepTurn && correct === true)) turn = (turn + 1) % nTeams;
          renderTeams();
        }
        return { correct: correct, first: rec.tries === 1 };
      },

      /** Pasa el turno al siguiente equipo sin puntuar (fallos en Memory, rondas perdidas…). */
      nextTurn: function () {
        if (!nTeams) return;
        turn = (turn + 1) % nTeams;
        renderTeams();
      },

      setProgress: function (done, total) {
        var pct = total ? Math.round(done / total * 100) : 0;
        progressBar.firstChild.style.width = pct + '%';
        progressBar.setAttribute('aria-valuenow', done);
        progressBar.setAttribute('aria-valuemax', total);
      },

      /** Muestra un mensaje en un elemento de feedback y lo anuncia a lectores de pantalla. */
      say: function (el, text, kind) {
        el.textContent = text;
        el.className = 'feedback' + (kind ? ' ' + kind : '');
        CQ.UI.announce(text);
      },

      complete: function () {
        if (finished) return;
        finished = true;
        ctx.setProgress(items.length, items.length);
        var responses = [];
        var correct = 0;
        var gradable = 0;
        items.forEach(function (it) {
          var r = records[it.itemId];
          if (!r) return;
          responses.push({ itemId: r.itemId, response: r.response, tries: r.tries, timeMs: r.timeMs });
          if (r.correct !== null) { gradable++; if (r.correct) correct++; }
        });
        CQ.Sfx.play('win');
        var result = {
          responses: responses,
          local: { correct: correct, gradable: gradable, total: cfg.sampled ? responses.length : items.length },
          teamScores: teamScores.slice()
        };
        setTimeout(function () { destroy(); opts.onFinish && opts.onFinish(result); }, 700);
      }
    };

    var instance = tpl.mount(ctx) || {};

    function destroy() {
      try { if (CQ.Speech.supported) window.speechSynthesis.cancel(); } catch (e) {}
      if (instance.destroy) instance.destroy();
    }

    return { destroy: destroy };
  }

  /** Utilidad para plantillas: pinta un enunciado con huecos "___". */
  function promptWithBlank(text) {
    var p = h('p', { class: 'prompt' });
    var parts = String(text || '').split(/_{2,}/);
    var blank = null;
    parts.forEach(function (part, i) {
      if (i > 0) { blank = h('span', { class: 'blank', aria: { label: 'blank' } }, ' '); p.appendChild(blank); }
      p.appendChild(document.createTextNode(part));
    });
    return { el: p, blank: blank };
  }

  CQ.Engine = { register: register, run: run, promptWithBlank: promptWithBlank, TEAM_COLORS: TEAM_COLORS, templates: templates };
})();
</script>

<script>
/* Plantilla: multiple_choice
   Una pregunta cada vez: imagen opcional + enunciado (admite huecos "___") + opciones.
   Feedback inmediato: si falla, la opción se marca y puede volver a intentarlo.
   Modo "end" (retos): sin feedback; pasa a la siguiente pregunta. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('multiple_choice', {
    mount: function (ctx) {
      var h = ctx.h;
      var i = 0;
      var timer = null;

      function show() {
        if (i >= ctx.items.length) { ctx.complete(); return; }
        var item = ctx.items[i];
        ctx.setProgress(i, ctx.items.length);
        CQ.Util.clear(ctx.el);

        var media = ctx.art.render(item.media);
        var pr = CQ.Engine.promptWithBlank(item.prompt);
        var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
        var options = ctx.config.shuffleOptions === false ? item.options.slice() : ctx.shuffle(item.options);
        var longest = options.reduce(function (m, o) { return Math.max(m, o.length); }, 0);
        var grid = h('div', { class: 'options' + (longest > 18 ? ' one-col' : ''), role: 'group', aria: { label: 'Answers' } });
        var buttons = [];

        options.forEach(function (opt) {
          var b = h('button', { class: 'opt', onclick: function () { choose(b, opt); } }, opt);
          buttons.push(b);
          grid.appendChild(b);
        });

        function lockAll() { buttons.forEach(function (x) { x.disabled = true; }); }

        function choose(btn, opt) {
          var res = ctx.attempt(item.itemId, opt);
          if (res.correct === true) {
            btn.classList.add('is-correct', 'pop');
            lockAll();
            if (pr.blank) { pr.blank.textContent = opt; pr.blank.classList.add('filled'); }
            ctx.say(fb, ctx.praise(), 'good');
            timer = setTimeout(function () { i++; show(); }, 1300);
          } else if (res.correct === false) {
            btn.classList.add('is-wrong');
            btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
            btn.disabled = true;
            ctx.say(fb, ctx.retry(), 'bad');
          } else {
            btn.classList.add('is-picked');
            lockAll();
            timer = setTimeout(function () { i++; show(); }, 450);
          }
        }

        ctx.el.appendChild(h('div', { class: 'stage-inner', style: { display: 'contents' } },
          media, pr.el, grid, fb));
        if (buttons[0]) buttons[0].focus({ preventScroll: true });
      }

      show();
      return { destroy: function () { clearTimeout(timer); } };
    }
  });
})();
</script>
