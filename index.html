<script>
/* Plantilla: match_pairs
   Rondas de N parejas (config.pairsPerRound). Toca una imagen y después su
   palabra (o al revés). Funciona igual con ratón, dedo y teclado. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('match_pairs', {
    mount: function (ctx) {
      var h = ctx.h;
      var per = ctx.config.pairsPerRound || 4;
      var rounds = [];
      for (var k = 0; k < ctx.items.length; k += per) rounds.push(ctx.items.slice(k, k + per));
      var r = 0;
      var matched = 0;
      var timer = null;

      function showRound() {
        if (r >= rounds.length) { ctx.complete(); return; }
        var round = rounds[r];
        var left = h('div', { class: 'match-col', role: 'group', aria: { label: 'Pictures' } });
        var right = h('div', { class: 'match-col', role: 'group', aria: { label: 'Words' } });
        var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
        var selPic = null;
        var selWord = null;
        var doneInRound = 0;

        round.forEach(function (item) {
          var media = ctx.art.render(item.media);
          var card = h('button', { class: 'match-card', aria: { label: 'Picture', pressed: 'false' }, data: { item: item.itemId } },
            media ? media.firstChild : '?');
          card.addEventListener('click', function () { select('pic', card, item); });
          left.appendChild(card);
        });
        ctx.shuffle(round).forEach(function (item) {
          var card = h('button', { class: 'match-card', aria: { pressed: 'false' } }, item.word);
          card.addEventListener('click', function () { select('word', card, item); });
          right.appendChild(card);
        });

        function mark(card, on) {
          card.classList.toggle('selected', on);
          card.setAttribute('aria-pressed', String(on));
        }

        function select(kind, card, item) {
          if (card.disabled) return;
          CQ.Sfx.play('tap');
          if (kind === 'pic') { if (selPic) mark(selPic.card, false); selPic = { card: card, item: item }; }
          else { if (selWord) mark(selWord.card, false); selWord = { card: card, item: item }; }
          mark(card, true);
          if (selPic && selWord) check();
        }

        function check() {
          var pic = selPic, word = selWord;
          selPic = selWord = null;
          var res = ctx.attempt(pic.item.itemId, word.item.word);
          if (res.correct) {
            [pic.card, word.card].forEach(function (c) { mark(c, false); c.classList.add('matched', 'pop'); c.disabled = true; });
            matched++;
            doneInRound++;
            ctx.setProgress(matched, ctx.items.length);
            ctx.say(fb, ctx.praise(), 'good');
            if (doneInRound === round.length) timer = setTimeout(function () { r++; showRound(); }, 900);
          } else {
            [pic.card, word.card].forEach(function (c) {
              mark(c, false);
              c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
            });
            ctx.say(fb, ctx.retry(), 'bad');
          }
        }

        CQ.Util.clear(ctx.el);
        if (rounds.length > 1) ctx.el.appendChild(h('div', { class: 'muted' }, 'Round ' + (r + 1) + ' of ' + rounds.length));
        ctx.el.appendChild(h('div', { class: 'match' }, left, right));
        ctx.el.appendChild(fb);
      }

      showRound();
      return { destroy: function () { clearTimeout(timer); } };
    }
  });
})();
</script>

<script>
/* Plantilla: drag_sort
   Clasificar tarjetas en cajas (config.categories = [{id,label}]).
   Dos formas de jugar, siempre disponibles:
     · Arrastrar (Pointer Events: funciona con dedo, lápiz y ratón).
     · Tocar la tarjeta y después tocar la caja (también con teclado).
   No se usa la API nativa de drag & drop de HTML porque no funciona en tabletas. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('drag_sort', {
    mount: function (ctx) {
      var h = ctx.h;
      var cats = ctx.config.categories || [];
      var placedCount = 0;
      var selected = null;
      var drag = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });

      var boxes = cats.map(function (c) {
        var list = h('div', { class: 'placed' });
        var box = h('div', { class: 'sort-box', role: 'button', tabindex: '0', data: { cat: c.id }, aria: { label: 'Box: ' + c.label } },
          h('h3', {}, c.label), list);
        box.addEventListener('click', function () { if (selected) place(selected, c.id, box); });
        box.addEventListener('keydown', function (e) {

<script>

   Tarjetas numeradas con el vocabulario de la unidad. Al tocar una, se oye la

   alta (al tocar una tarjeta se muestra solo esa). Se completa cuando se han

(function () {
  'use strict';
  var CQ = window.CQ;
  var TILES = ['#FFE4C7', '#DCE8FF', '#FDE2EC', '#E2F5DF', '#FFF1BF', '#EDE3FF', '#FFE3D6', '#DDF0F7'];

  CQ.Engine.register('listen_learn', {
    mount: function (ctx) {
      var h = ctx.h;
      var items = ctx.activity.items.slice();
      var heard = {};
      var hidden = false;
      var revealed = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var hideBtn = h('button', { class: 'btn btn-yellow btn-sm', onclick: function () { hidden = !hidden; revealed = null; draw(); } });
      var finishBtn = h('button', { class: 'btn btn-good btn-lg', style: { display: 'none' }, onclick: function () { ctx.complete(); } },
        h('span', { svg: CQ.Icons.check, style: { display: 'flex' } }), 'I know them all!');
      var grid = h('div', { class: 'vocab-grid', role: 'group', aria: { label: 'Pictures' } });

<script>
/* Plantilla: hangman  (Extra)
   Cada ronda elige una palabra ALEATORIA del banco (sin repetir hasta agotarlo).

      (lost ? '<path d="M131 60l6 6M137 60l-6 6M143 60l6 6M149 60l-6 6M132 76q8-6 16 0" stroke="#23264A" stroke-width="3" fill="none" stroke-linecap="round"/>'

    if (parts > 1) out += '<path d="M140 86v50" ' + p + '/>';
    if (parts > 2) out += '<path d="M140 100l-24 18" ' + p + '/>';
    if (parts > 3) out += '<path d="M140 100l24 18" ' + p + '/>';
    if (parts > 4) out += '<path d="M140 136l-20 32" ' + p + '/>';

      var hintBtn = h('button', { class: 'btn btn-yellow btn-sm', onclick: function () { hint = true; render(); } }, '💡 Hint');

<script>
/* Plantilla: memory  (Extra)
   Cartas boca abajo. Hay que encontrar la IMAGEN y su PALABRA en inglés.
   Parejas aleatorias del banco: 6 para el alumno, 8 en la pizarra.
   En pizarra con equipos: si aciertan, el mismo equipo repite turno. */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('memory', {
    mount: function (ctx) {
      var h = ctx.h;
      var board = ctx.mode === 'board';
      var n = board ? (ctx.config.boardPairs || 8) : (ctx.config.pairs || 6);
      var chosen = ctx.shuffle(ctx.activity.items).slice(0, Math.min(n, ctx.activity.items.length));
      var cards = [];
      chosen.forEach(function (it) { cards.push({ it: it, kind: 'pic' }, { it: it, kind: 'word' }); });
      cards = ctx.shuffle(cards);
      var open = [], matched = 0, moves = 0, busy = false, timer = null;
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var movesLbl = h('span', { class: 'hm-round' });
      var grid = h('div', { class: 'mem-grid' + (cards.length > 12 ? ' big' : '') });

      function word(it) { return it.word || it.answer || ''; }

      cards.forEach(function (c, i) {
        var media = c.kind === 'pic' ? ctx.art.render(c.it.media) : null;
        var face = c.kind === 'pic'
          ? h('div', { class: 'mem-face pic' }, media ? media.firstChild : null)
          : h('div', { class: 'mem-face word' }, word(c.it));
        c.el = h('button', { class: 'mcard', aria: { label: 'Card ' + (i + 1) }, onclick: function () { flip(c); } },
          h('div', { class: 'mcard-inner' },
            h('div', { class: 'mcard-back', svg: CQ.Icons.gamepad }),
            face));
        grid.appendChild(c.el);
      });

      function update() {
        movesLbl.textContent = 'Pairs: ' + matched + ' / ' + chosen.length + '  ·  Moves: ' + moves;
        ctx.setProgress(matched, chosen.length);
      }

      function flip(c) {
        if (busy || c.done || open.indexOf(c) >= 0) return;
        c.el.classList.add('up');
        c.el.setAttribute('aria-label', c.kind === 'pic' ? 'Picture' : word(c.it));
        CQ.Sfx.play('tap');
        if (c.kind === 'word') CQ.Speech.speak(c.it.say || word(c.it));
        open.push(c);
        if (open.length < 2) return;
        moves++;
        var a = open[0], b = open[1];
        if (a.it === b.it && a.kind !== b.kind) {
          a.done = b.done = true;
          a.el.classList.add('done'); b.el.classList.add('done');
          ctx.attempt(a.it.itemId, word(a.it), { keepTurn: true, silent: true });
          ctx.say(fb, ctx.praise() + ' "' + word(a.it) + '"', 'good');
          open = [];
          matched++;
          update();
          if (matched === chosen.length) timer = setTimeout(function () { ctx.complete(); }, 1100);
        } else {
          busy = true;
          CQ.Sfx.play('wrong');
          ctx.nextTurn();
          ctx.say(fb, ctx.retry(), 'bad');
          timer = setTimeout(function () {
            a.el.classList.remove('up'); b.el.classList.remove('up');
            open = []; busy = false;
          }, 1100);
          update();
        }
      }

      CQ.Util.clear(ctx.el);
      ctx.el.appendChild(h('div', { class: 'listen-bar' }, movesLbl));
      ctx.el.appendChild(grid);
      ctx.el.appendChild(fb);
      update();
      return { destroy: function () { clearTimeout(timer); } };
    }
  });
})();
</script>

<script>
/* Plantilla: whats_missing  (Extra · "What's missing?")
   1. Se ven 6 objetos del banco: "Look carefully!"
   2. "Close your eyes!": una cortina los tapa y desaparece uno.
   3. "What's missing?": hay que elegir la palabra (las opciones trampa NO están
      en la mesa, así que hay que recordar).
   Alumno: 5 rondas. Pizarra: sin límite hasta "Finish". */
(function () {
  'use strict';
  var CQ = window.CQ;

  CQ.Engine.register('whats_missing', {
    mount: function (ctx) {
      var h = ctx.h;
      var board = ctx.mode === 'board';
      var bank = ctx.activity.items.slice();
      var show = Math.min(ctx.config.show || 6, bank.length - 1);
      var maxRounds = board ? Infinity : (ctx.config.rounds || 5);
      var pool = [];
      var round = 0, won = 0, set = [], missing = null, phase = 'look', timer = null, countdown = null;

      var title = h('p', { class: 'prompt wm-title' });
      var roundLbl = h('span', { class: 'hm-round' });
      var grid = h('div', { class: 'wm-grid' });
      var curtain = h('div', { class: 'wm-curtain' }, h('span', { class: 'wm-eyes' }, '🙈'), h('b', {}, 'Close your eyes!'));
      var stageBox = h('div', { class: 'wm-stage' }, grid, curtain);
      var opts = h('div', { class: 'options' });
      var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
      var readyBtn = h('button', { class: 'btn btn-lg', onclick: hide }, 'Ready!');
      var nextBtn = h('button', { class: 'btn btn-lg', onclick: next }, 'Next', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } }));
      var finishBtn = board ? h('button', { class: 'btn btn-good btn-sm', onclick: function () { ctx.complete(); } }, 'Finish') : null;

      function word(it) { return it.word || it.answer || ''; }

      function card(it, empty) {
        if (empty) return h('div', { class: 'wm-card empty' }, h('span', {}, '?'));
        var m = ctx.art.render(it.media);
        return h('div', { class: 'wm-card' }, h('div', { class: 'wm-pic' }, m ? m.firstChild : null), h('b', {}, word(it)));
      }

      function startRound() {
        if (!pool.length) pool = ctx.shuffle(bank.filter(function (b) { return b !== missing; }));
        missing = pool.shift();
        var others = ctx.shuffle(bank.filter(function (b) { return b !== missing; })).slice(0, show - 1);
        set = ctx.shuffle(others.concat([missing]));
        phase = 'look';
        roundLbl.textContent = board ? 'Round ' + (round + 1) : 'Round ' + (round + 1) + ' of ' + maxRounds;
        title.textContent = 'Look carefully!';
        ctx.say(fb, '', '');
        CQ.Util.clear(grid);
        set.forEach(function (it) { grid.appendChild(card(it)); });
        CQ.Util.clear(opts);
        curtain.classList.remove('on');
        readyBtn.style.display = '';
        nextBtn.style.display = 'none';
        if (!board) {
          var left = 10;
          readyBtn.textContent = 'Ready! (' + left + ')';
          clearInterval(countdown);
          countdown = setInterval(function () {
            left--;
            readyBtn.textContent = 'Ready! (' + left + ')';
            if (left <= 0) hide();
          }, 1000);
        } else {
          readyBtn.textContent = 'Ready!';
        }
      }

      function hide() {
        if (phase !== 'look') return;
        clearInterval(countdown);
        phase = 'hide';
        readyBtn.style.display = 'none';
        title.textContent = 'Close your eyes!';
        curtain.classList.add('on');
        CQ.Sound.tick();
        timer = setTimeout(function () {
          CQ.Util.clear(grid);
          set.forEach(function (it) { grid.appendChild(card(it, it === missing)); });
          curtain.classList.remove('on');
          ask();
        }, 1900);
      }

      function ask() {
        phase = 'guess';
        title.textContent = 'What’s missing?';
        var distract = ctx.shuffle(bank.filter(function (b) { return set.indexOf(b) < 0; })).slice(0, 3);
        CQ.Util.clear(opts);
        ctx.shuffle(distract.concat([missing])).forEach(function (it) {
          var b = h('button', { class: 'opt', onclick: function () { choose(b, it); } }, word(it));
          opts.appendChild(b);
        });
        try { opts.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
      }

      function choose(btn, it) {
        if (phase !== 'guess') return;
        var res = ctx.attempt(missing.itemId, word(it), { silent: true });
        if (res.correct === false) {
          btn.classList.add('is-wrong', 'shake'); btn.disabled = true;
          ctx.say(fb, ctx.retry(), 'bad');
          return;
        }
        phase = 'done';
        if (res.first) won++;
        btn.classList.add('is-correct', 'pop');
        Array.prototype.forEach.call(opts.querySelectorAll('button'), function (b) { b.disabled = true; });
        CQ.Speech.speak(missing.say || word(missing));
        ctx.say(fb, ctx.praise() + ' The ' + word(missing) + ' was missing!', 'good');
        CQ.Util.clear(grid);
        set.forEach(function (x) { var c = card(x); if (x === missing) c.classList.add('found', 'pop'); grid.appendChild(c); });
        nextBtn.style.display = '';
      }

      function next() {
        round++;
        if (!board) ctx.setProgress(round, maxRounds);
        if (round >= maxRounds) { ctx.complete(); return; }
        startRound();
      }

      CQ.Util.clear(ctx.el);
      ctx.el.appendChild(h('div', { class: 'listen-bar' }, roundLbl, h('span', { class: 'grow' }), finishBtn));
      ctx.el.appendChild(title);
      ctx.el.appendChild(stageBox);
      ctx.el.appendChild(opts);
      ctx.el.appendChild(fb);
      ctx.el.appendChild(readyBtn);
      ctx.el.appendChild(nextBtn);
      if (!board) ctx.setProgress(0, maxRounds);
      startRound();
      return { destroy: function () { clearTimeout(timer); clearInterval(countdown); } };
    }
  });
})();
</script>

<script>
/* Plantilla: video_quiz — Actividades DENTRO de un vídeo de YouTube.
   - El vídeo se reproduce con la API de YouTube (dominio sin cookies).
   - En el segundo de cada pregunta (item.at) el vídeo se para y aparece la pregunta
     encima: verdadero/falso, rellenar el hueco o escoger una palabra (item.qtype).
   - Al acertar, el vídeo sigue solo. Si falla, puede volver a intentarlo.
   - Botón "Activities ON/OFF": siempre empieza en ON. Con OFF el vídeo se ve sin pausas
     (y no se guarda nota).
   - No se puede adelantar el vídeo para saltarse una pregunta pendiente.
   - Pantalla completa propia (la de YouTube taparía las preguntas). */
(function () {
  'use strict';
  var CQ = window.CQ;

  /** Carga la API de YouTube una sola vez. */
  var ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise(function (resolve, reject) {
      if (window.YT && window.YT.Player) { resolve(window.YT); return; }
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prev) try { prev(); } catch (e) {} resolve(window.YT); };
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = function () { ytReady = null; reject(new Error('yt')); };
      document.head.appendChild(s);
    });
    return ytReady;
  }

  var TYPE_LABEL = { tf: 'True or false?', gap: 'Fill the gap', choice: 'Choose the right word' };

  CQ.Engine.register('video_quiz', {
    mount: function (ctx) {
      var h = ctx.h;
      var yid = String((ctx.config && ctx.config.youtubeId) || '');
      var qs = ctx.items.slice().sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
      var done = {};            // itemId → true cuando se ha acertado (o respondido, en modo "end")
      var on = true;            // actividades activadas (siempre empieza en ON)
      var player = null, poll = null, current = null, ended = false, destroyed = false, resumeTimer = null;

      var holder = h('div', { class: 'vq-player' });
      var overlay = h('div', { class: 'vq-overlay', hidden: true });
      var wrap = h('div', { class: 'vq-wrap' }, holder, overlay);
      var status = h('span', { class: 'vq-status' });
      var toggle = h('button', { class: 'vq-toggle on', aria: { pressed: 'true' }, onclick: toggleOn },
        h('span', { class: 'vq-dot' }), h('span', { class: 'vq-toggle-text' }, 'Activities: ON'));
      var fsBtn = h('button', { class: 'btn btn-ghost btn-sm', onclick: fullscreen }, '⛶ Full screen');
      var endBox = h('div', { class: 'vq-end', hidden: true });
      ctx.el.appendChild(h('div', { class: 'vq' },
        h('div', { class: 'vq-bar' }, toggle, status, fsBtn), wrap, endBox));
      updateStatus();

      if (!/^[A-Za-z0-9_-]{11}$/.test(yid)) {
        holder.appendChild(h('p', { class: 'empty' }, 'This video is not available.'));
        return {};
      }

      loadYT().then(function (YT) {
        if (destroyed) return;
        var target = h('div');
        holder.appendChild(target);
        player = new YT.Player(target, {
          host: 'https://www.youtube-nocookie.com',
          videoId: yid,
          width: '100%', height: '100%',
          playerVars: { rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3, disablekb: 1 },
          events: {
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.ENDED) onEnded();
              if (e.data === YT.PlayerState.PLAYING) { ended = false; endBox.hidden = true; if (current && on) player.pauseVideo(); }
            }
          }
        });
        poll = setInterval(tick, 250);
      }).catch(function () {
        holder.appendChild(h('p', { class: 'empty' }, 'The video could not load. Check your internet connection.'));
      });

      function pending() { return qs.filter(function (q) { return !done[q.itemId]; }); }

      function updateStatus() {
        var n = qs.length - pending().length;
        status.textContent = on ? '🎯 Questions: ' + n + ' / ' + qs.length : 'Just watching (no stars)';
        ctx.setProgress(n, qs.length);
      }

      /** Cada 250 ms: ¿toca una pregunta? ¿ha adelantado el vídeo sin contestar? */
      function tick() {
        if (!player || !player.getCurrentTime || !on || current) return;
        var t = player.getCurrentTime() || 0;
        var next = pending()[0];
        if (!next) return;
        if (t >= (next.at || 0)) {
          if (t > (next.at || 0) + 2.5) { try { player.seekTo(next.at, true); } catch (e) {} }
          ask(next);
        }
      }

      function ask(q) {
        current = q;
        try { player.pauseVideo(); } catch (e) {}
        CQ.Util.clear(overlay);
        overlay.hidden = false;
        var pr = CQ.Engine.promptWithBlank(q.prompt);
        var fb = h('div', { class: 'feedback', aria: { live: 'polite' } });
        var opts = q.qtype === 'tf' ? ['True', 'False'] : ctx.shuffle(q.options || []);
        var btns = [];
        var grid = h('div', { class: 'options vq-options', role: 'group', aria: { label: 'Answers' } });
        opts.forEach(function (o) {
          var b = h('button', { class: 'opt' + (q.qtype === 'tf' ? ' tf-' + o.toLowerCase() : ''), onclick: function () { choose(b, o); } },
            q.qtype === 'tf' ? (o === 'True' ? '👍 True' : '👎 False') : o);
          btns.push(b);
          grid.appendChild(b);
        });
        overlay.appendChild(h('div', { class: 'vq-card pop' },
          h('div', { class: 'vq-type' }, '⏸ ' + (TYPE_LABEL[q.qtype] || 'Question')),
          pr.el, grid, fb));
        if (CQ.Sfx.enabled && q.say) { try { CQ.Speech.speak(q.prompt.replace(/_{2,}/g, '…')); } catch (e) {} }
        if (btns[0]) btns[0].focus({ preventScroll: true });

        function choose(btn, opt) {
          var res = ctx.attempt(q.itemId, opt, { silent: true });
          if (res.correct === false) {
            btn.classList.add('is-wrong');
            btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
            btn.disabled = true;
            ctx.say(fb, ctx.retry(), 'bad');
            return;
          }
          btns.forEach(function (x) { x.disabled = true; });
          btn.classList.add(res.correct === true ? 'is-correct' : 'is-picked', 'pop');
          if (pr.blank) { pr.blank.textContent = opt; pr.blank.classList.add('filled'); }
          if (res.correct === true) ctx.say(fb, ctx.praise(), 'good');
          done[q.itemId] = true;
          updateStatus();
          resumeTimer = setTimeout(resume, 1200);
        }
      }

      function resume() {
        current = null;
        overlay.hidden = true;
        CQ.Util.clear(overlay);
        if (ended) { onEnded(); return; }
        try { player.playVideo(); } catch (e) {}
      }

      function toggleOn() {
        on = !on;
        toggle.classList.toggle('on', on);
        toggle.setAttribute('aria-pressed', String(on));
        toggle.querySelector('.vq-toggle-text').textContent = 'Activities: ' + (on ? 'ON' : 'OFF');
        if (!on && current) { clearTimeout(resumeTimer); current = null; overlay.hidden = true; try { player.playVideo(); } catch (e) {} }
        updateStatus();
      }

      function onEnded() {
        ended = true;
        if (current) return;
        var left = pending();
        if (on && !left.length) { ctx.complete(); return; }
        if (on && left.length) { ask(left[0]); return; }   // preguntas que quedaron atrás
        // Visto sin actividades: no hay nota. Se puede volver a ver con ellas.
        CQ.Util.clear(endBox);
        endBox.hidden = false;
        endBox.appendChild(h('p', {}, 'Great watching! Turn the activities ON to win stars.'));
        endBox.appendChild(h('button', { class: 'btn', onclick: function () {
          if (!on) toggleOn();
          endBox.hidden = true;
          try { player.seekTo(0, true); player.playVideo(); } catch (e) {}
        } }, '🎯 Watch again with activities'));
      }

      function fullscreen() {
        var el = wrap.closest('.vq') || wrap;
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else if (el.requestFullscreen) el.requestFullscreen();
        } catch (e) {}
      }

      return {
        destroy: function () {
          destroyed = true;
          clearInterval(poll);
          clearTimeout(resumeTimer);
          try { if (player && player.destroy) player.destroy(); } catch (e) {}
          try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
        }
      };
    }
  });
})();
</script>

<script>
/* ==========================================================================
   js_student — App del alumnado (todo el texto visible en inglés).

   Pantallas:
     Login → My classes → Course (Unit N - Title)
       → Section (Vocabulary | Grammar | Challenges por nivel) → Activity → Results
     + My Progress · Star Shop · Profile (ventana)
   ========================================================================== */
(function () {
  'use strict';
  var CQ = window.CQ, h = CQ.h, U = CQ.Util, UI = CQ.UI;
  var BOOT = window.BOOT || {};
  var app = document.getElementById('app');
  var MAX = 5;

  var MSG = {
    BAD_LOGIN: 'Oops! Check your code and your PIN.',
    LOCKED: 'Too many tries. Please ask your teacher for help.',
    ACCOUNT_DISABLED: 'Your account is paused. Please ask your teacher.',
    NETWORK: 'No connection. Please try again.',
    SERVER: 'Something went wrong. Please try again.',
    SESSION_EXPIRED: 'Time to log in again.',
    FORBIDDEN: 'You can’t do that.',
    NOT_FOUND: 'We can’t find this activity.',
    LOCKED_ACTIVITY: 'Finish the other activities first!',
    NOT_SETUP: 'The platform is not ready yet. Please ask your teacher.',
    NOT_ENOUGH_STARS: 'You need more stars for this. Keep playing!',
    NOT_ENOUGH_SUPER: 'You need more super stars. Your class can earn them together!',
    ALREADY_OWNED: 'You already have this!'
  };
  function msgFor(err) { return MSG[(err && err.code) || 'SERVER'] || MSG.SERVER; }

  var SECTIONS = {
    vocabulary: { label: 'Vocabulary', sub: 'Learn the words', icon: CQ.Icons.book },
    grammar: { label: 'Grammar', sub: 'Build your sentences', icon: CQ.Icons.puzzle },
    challenge: { label: 'Challenges', sub: 'Easy · Medium · Hard', icon: CQ.Icons.trophy },
    extra: { label: 'Extra', sub: 'Fun mini-games', icon: CQ.Icons.gamepad },
    homework: { label: 'Homework', sub: 'From your teacher', icon: CQ.Icons.homework },
    videos: { label: 'Videos', sub: 'Watch and learn', icon: CQ.Icons.video }
  };
  // Homework va primero: si el profesor ha publicado deberes, es lo primero que ve el alumno.
  var SECTION_ORDER = ['homework', 'vocabulary', 'grammar', 'challenge', 'extra'];
  var LEVELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  var LEVEL_HINT = { easy: 'A good start', medium: 'Getting harder', hard: 'For experts!' };
  var LEVEL_ORDER = ['easy', 'medium', 'hard'];

  var state = { student: null, home: null, profile: null, catalog: [], courses: {}, runner: null, shopMain: null };

  var saved = CQ.Store.session.get('cq_session');
  if (saved && saved.token) { CQ.Api.token = saved.token; state.student = saved.student; }

  /* ───────────────────────── cola de envíos pendientes ───────────────────────── */
  var Outbox = {
    KEY: 'cq_outbox',
    list: function () {
      var week = 7 * 24 * 3600 * 1000;
      return (CQ.Store.local.get(Outbox.KEY) || []).filter(function (e) { return Date.now() - e.at < week; });
    },
    save: function (l) { CQ.Store.local.set(Outbox.KEY, l.slice(-20)); },
    add: function (studentId, payload) {
      var l = Outbox.list().filter(function (e) { return e.payload.attemptId !== payload.attemptId; });
      l.push({ studentId: studentId, payload: payload, at: Date.now() });
      Outbox.save(l);
    },
    flush: function (studentId) {
      var mine = Outbox.list().filter(function (e) { return e.studentId === studentId; });
      if (!mine.length) return Promise.resolve(0);
      var savedCount = 0;
      function drop(e) {
        Outbox.save(Outbox.list().filter(function (x) { return x.payload.attemptId !== e.payload.attemptId; }));
      }
      return mine.reduce(function (p, e) {
        return p.then(function () {
          return CQ.Api.student('submitAttempt', e.payload).then(function (res) {
            savedCount++;
            drop(e);
            if (res && res.profile) setProfile(res.profile);
          }).catch(function (err) {
            if (err && err.code !== 'NETWORK' && err.code !== 'SERVER' && err.code !== 'SESSION_EXPIRED') drop(e);
          });
        });
      }, Promise.resolve()).then(function () {
        if (savedCount) { state.courses = {}; UI.toast('We saved your answers from before!'); }
        return savedCount;
      });
    }
  };

  /* ───────────────────────── sesión e inactividad ───────────────────────── */
  var idleTimer = null;
  function resetIdle() {
    clearTimeout(idleTimer);
    if (!CQ.Api.token) return;
    idleTimer = setTimeout(function () {
      endSession('You were away for a while. Please log in again.');
    }, (BOOT.idleMinutes || 20) * 60000);
  }
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, resetIdle, { passive: true }); });

  function endSession(message) {
    if (CQ.Api.token) CQ.Api.student('logout', {}).catch(function () {});
    CQ.Api.token = null;
    CQ.Store.session.remove('cq_session');
    state = { student: null, home: null, profile: null, catalog: [], courses: {}, runner: null, shopMain: null };
    clearTimeout(idleTimer);
    document.querySelectorAll('.overlay').forEach(function (o) { o.remove(); });
    CQ.Nav.go({ name: 'login', message: message || '' }, true);
  }

  /* ───────────────────────── router ───────────────────────── */
  function route(r) {
    if (state.runner) { state.runner.destroy(); state.runner = null; }
    window.scrollTo(0, 0);
    if (!CQ.Api.token && r.name !== 'login') r = { name: 'login' };
    resetIdle();
    switch (r.name) {
      case 'login': return renderLogin(r);
      case 'home': return renderHome(r);
      case 'course': return renderCourse(r);
      case 'section': return renderSection(r);
      case 'unit': return renderCourse(r);
      case 'play': return renderPlay(r);
      case 'progress': return renderProgress(r);
      case 'shop': return renderShop(r);
      default: return renderHome(r);
    }
  }

  /* ───────────────────────── piezas comunes ───────────────────────── */
  function shade(hex, amt) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    if (isNaN(n)) return hex;
    var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) { return Math.max(0, Math.min(255, v + amt)); });
    return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
  }
  function unitLabel(u) { return u.number ? 'Unit ' + u.number + ' - ' + u.title : u.title; }
  function starIcon() { return h('span', { class: 'star-on star-inline', svg: CQ.Icons.star }); }
  function superIcon() { return h('span', { class: 'star-inline', svg: CQ.Icons.superstar }); }
  function avatarSvg(id) { return CQ.Art.svg(id) || CQ.Art.svg('av-star'); }
  function itemName(id) {
    var it = state.catalog.filter(function (i) { return i.id === id; })[0];
    return it ? it.name : id;
  }
  function sum(list, fn) { return list.reduce(function (s, x) { return s + fn(x); }, 0); }
  function doneCount(acts) { return acts.filter(function (a) { return a.progress && a.progress.completed; }).length; }
  function starCount(acts) { return sum(acts, function (a) { return a.progress ? a.progress.bestStars : 0; }); }

  function setProfile(p, catalog) {
    if (p) state.profile = p;
    if (catalog) state.catalog = catalog;
    var old = document.querySelector('header.topbar');
    if (old) old.replaceWith(topbar());
  }

  function topbar() {
    var p = state.profile;
    var soundBtn = h('button', {
      class: 'icon-btn' + (CQ.Sfx.enabled ? ' on' : ''), aria: { label: 'Sound', pressed: String(CQ.Sfx.enabled) },
      svg: CQ.Sfx.enabled ? CQ.Icons.sound : CQ.Icons.mute,
      onclick: function () {
        var on = CQ.Sfx.toggle();
        soundBtn.className = 'icon-btn' + (on ? ' on' : '');
        soundBtn.innerHTML = on ? CQ.Icons.sound : CQ.Icons.mute;
        soundBtn.setAttribute('aria-pressed', String(on));
      }
    });
    var shopBtn = h('button', {
      class: 'icon-btn shop-btn with-badge',
      aria: { label: 'Star shop' + (p && p.shopBadge ? ': you can buy something new!' : '') },
      title: 'Star shop',
      onclick: function () { CQ.Nav.go({ name: 'shop' }); }
    }, h('span', { svg: CQ.Icons.shop, style: { display: 'flex' } }), p && p.shopBadge ? UI.notif() : null);
    var chip = state.student ? h('button', {
      class: 'chip-user with-badge', aria: { label: 'My profile' + (p && p.profileBadge ? ': something new!' : '') },
      onclick: openProfile
    },
      h('span', { class: 'avatar', svg: avatarSvg(p && p.avatar) }),
      h('span', { class: 'chip-name' }, state.student.displayName),
      p ? h('span', { class: 'chip-stars' }, starIcon(), String(p.balance)) : null,
      p && p.superEarned ? h('span', { class: 'chip-super' }, superIcon(), String(p.superBalance)) : null,
      p && p.profileBadge ? UI.notif() : null) : null;

    return h('header', { class: 'topbar' },
      h('button', { class: 'brand', aria: { label: 'Home' }, onclick: function () { CQ.Nav.go({ name: 'home' }); } },
        h('span', { class: 'brand-mark', svg: CQ.Art.svg('mascot') }),
        h('span', { class: 'brand-name' }, BOOT.appName || 'ClassQuest')),
      h('div', { class: 'spacer' }),
      soundBtn,
      state.student ? shopBtn : null,
      chip,
      h('button', { class: 'icon-btn', aria: { label: 'Log out' }, title: 'Log out', svg: CQ.Icons.logout, onclick: function () { endSession(''); } }));
  }

  function page() {
    U.clear(app);
    var main = h('main', { class: 'main', id: 'main' });
    app.appendChild(topbar());
    app.appendChild(main);
    return main;
  }

  function backButton(label, r) {
    return h('button', { class: 'back-btn', onclick: function () { CQ.Nav.go(r); } },
      h('span', { svg: CQ.Icons.back, style: { display: 'flex' } }), label);
  }

  /** Cabecera de color de cada página. */
  function hero(o) {
    var style = o.color ? { background: 'linear-gradient(135deg, ' + o.color + ', ' + shade(o.color, -50) + ')' } : null;
    return h('section', { class: 'hero ' + (o.cls || ''), style: style },
      o.art ? h('div', { class: 'hero-art', svg: CQ.Art.svg(o.art) }) : null,
      o.back || null,
      h('div', { class: 'grow' },
        o.kicker ? h('div', { class: 'hero-kicker' }, o.kicker) : null,
        h('h1', {}, o.title),
        o.sub ? h('p', { class: 'sub' }, o.sub) : null),
      o.action || null);
  }

  function showError(main, err, retry) {
    if (err && err.code === 'SESSION_EXPIRED') { endSession(MSG.SESSION_EXPIRED); return; }
    U.clear(main).appendChild(h('div', { class: 'empty card' },
      h('p', { style: { fontSize: '22px', marginBottom: '18px' } }, msgFor(err)),
      retry ? h('button', { class: 'btn', onclick: retry }, 'Try again') : null,
      ' ',
      h('button', { class: 'btn btn-ghost', onclick: function () { CQ.Nav.go({ name: 'home' }); } }, 'My classes')));
  }

  function loadCourse(courseId, force) {
    var c = state.courses[courseId];
    if (c && !force) return Promise.resolve(c);
    return CQ.Api.student('getCourse', { courseId: courseId }).then(function (data) {
      state.courses[courseId] = data;
      setProfile(data.profile, data.catalog);
      return data;
    });
  }

  /* ───────────────────────── LOGIN ───────────────────────── */
  function renderLogin(r) {
    U.clear(app);
    var msg = h('div', { class: 'form-msg' + (r.message ? ' info' : ''), role: 'alert' }, r.message || '');
    var code = h('input', { class: 'input', id: 'code', name: 'code', autocomplete: 'off', autocapitalize: 'characters',
      spellcheck: 'false', maxlength: '16', required: true });
    var pin = h('input', { class: 'input', id: 'pin', name: 'pin', type: 'password', inputmode: 'numeric', pattern: '[0-9]*',
      maxlength: '6', autocomplete: 'off', required: true });
    var btn = h('button', { class: 'btn btn-lg btn-block', type: 'submit' }, 'Let’s go!');
    code.addEventListener('input', function () { code.value = code.value.toUpperCase(); });

    var form = h('form', { class: 'login-card', novalidate: true },
      h('div', { class: 'hero-img', svg: CQ.Art.svg('mascot') }),
      h('h1', {}, 'Welcome to ' + (BOOT.appName || 'ClassQuest') + '!'),
      h('p', { class: 'lead' }, 'Type your code and your PIN.'),
      h('div', { class: 'field' }, h('label', { for: 'code' }, 'Your code'), code),
      h('div', { class: 'field' }, h('label', { for: 'pin' }, 'Your PIN'), pin),
      msg,
      btn);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!code.value.trim() || !pin.value.trim()) {
        msg.className = 'form-msg bad';
        msg.textContent = 'Please type your code and your PIN.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Checking…';
      CQ.Api.student('login', { code: code.value, pin: pin.value }).then(function (data) {
        CQ.Api.token = data.token;
        state.student = data.student;
        CQ.Store.session.set('cq_session', { token: data.token, student: data.student });
        CQ.Nav.go({ name: 'home', fromLogin: true }, true);
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Let’s go!';
        msg.className = 'form-msg bad';
        msg.textContent = msgFor(err);
        pin.value = '';
        pin.focus();
      });
    });

    app.appendChild(h('div', { class: 'login-wrap' }, form));
    code.focus();
  }

  /* ───────────────────────── MY CLASSES ───────────────────────── */
  function renderHome(r) {
    var main = page();
    main.appendChild(UI.loading());
    CQ.Api.student('getHome', {}).then(function (data) {
      state.home = data;
      state.student = data.student;
      setProfile(data.profile, data.catalog);
      Outbox.flush(data.student.studentId);
      celebrateSuperStars(data.student.studentId, data.profile);
      if (r.fromLogin && data.courses.length === 1) {
        CQ.Nav.go({ name: 'course', courseId: data.courses[0].courseId });
        return;
      }
      U.clear(main);
      main.appendChild(hero({
        cls: 'hero-home', art: 'mascot',
        title: 'Hi, ' + data.student.displayName + '! 👋',
        sub: data.courses.length ? 'Choose your class.' : 'You don’t have any classes yet. Ask your teacher.'
      }));
      if (data.homework && data.homework.length) main.appendChild(homeworkBanner(data.homework));
      var grid = h('div', { class: 'grid' });
      data.courses.forEach(function (c, i) {
        grid.appendChild(h('button', {
          class: 'tile tile-course',
          style: { background: 'linear-gradient(135deg, ' + c.color + ', ' + shade(c.color, -50) + ')', animationDelay: (i * 60) + 'ms' },
          onclick: function () { CQ.Nav.go({ name: 'course', courseId: c.courseId }); }
        },
          h('div', { class: 'tile-art', svg: CQ.Art.svg(c.icon) }),
          h('span', { class: 'subject' }, c.subjectName),
          h('span', { class: 'year' }, 'Year ' + c.year),
          h('div', { class: 'meta' },
            UI.bar(c.done, c.total),
            h('span', {}, c.done + '/' + c.total),
            h('span', { class: 'stars-count' }, starIcon(), c.stars + ' / ' + c.maxStars))));
      });
      main.appendChild(grid);
    }).catch(function (err) { showError(main, err, function () { renderHome(r); }); });
  }

  /** Aviso de deberes pendientes en la portada: cada uno abre su actividad directamente. */
  function homeworkBanner(list) {
    return h('section', { class: 'hw-banner card', aria: { label: 'Homework' } },
      h('div', { class: 'hw-banner-head' },
        h('span', { class: 'hw-banner-icon', svg: CQ.Icons.homework }),
        h('div', {}, h('h2', {}, 'Homework'),
          h('p', {}, 'You have ' + list.length + ' task' + (list.length > 1 ? 's' : '') + ' to do. Let’s go!'))),
      h('div', { class: 'hw-list' }, list.map(function (x) {
        return h('button', { class: 'hw-item', onclick: function () {
          CQ.Nav.go({ name: 'play', courseId: x.courseId, unitId: x.unitId, section: 'homework', activityId: x.activityId });
        } }, h('span', { svg: CQ.Icons.play, style: { display: 'flex' } }), x.title);
      })));
  }

  /** Si la clase ha ganado super estrellas desde la última vez, se celebra al entrar. */
  function celebrateSuperStars(sid, p) {
    if (!p || !p.superEarned) return;
    var key = 'cq_super_' + sid;
    var seen = CQ.Store.local.get(key) || 0;
    if (p.superEarned <= seen) return;
    var gained = p.superEarned - seen;
    CQ.Store.local.set(key, p.superEarned);
    setTimeout(function () {
      CQ.Effects.play('fx-goldrain');
      var m = UI.modal({
        className: 'modal-choice',
        body: [
          h('div', { class: 'unlock-art', svg: CQ.Icons.superstar }),
          h('div', { class: 'kicker kicker-super' }, 'Class rewards'),
          h('h2', {}, 'Your class earned ' + gained + ' super star' + (gained > 1 ? 's' : '') + '!'),
          h('p', {}, 'Great teamwork! Use super stars to get special things in the Star Shop.'),
          h('div', { class: 'row-actions' },
            h('button', { class: 'btn btn-ghost', onclick: function () { m.close(); } }, 'OK'),
            h('button', { class: 'btn btn-super', onclick: function () { m.close(); CQ.Nav.go({ name: 'shop' }); } }, superIcon(), 'Star Shop'))
        ]
      });
    }, 600);
  }

  /* ───────────────────────── COURSE: Unit N - Title + 3 secciones ───────────────────────── */
  function renderCourse(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId, true).then(function (data) {
      U.clear(main);
      var c = data.course;
      var multi = !state.home || state.home.courses.length > 1;
      main.appendChild(hero({
        color: c.color, art: c.icon,
        back: multi ? backButton('My classes', { name: 'home' }) : null,
        title: c.subjectName, sub: 'Year ' + c.year,
        action: h('button', { class: 'btn btn-white', onclick: function () { CQ.Nav.go({ name: 'progress', courseId: c.courseId }); } },
          h('span', { svg: CQ.Icons.chart, style: { display: 'flex' } }), 'My Progress')
      }));

      // Deberes pendientes de este curso (también aquí, porque con una sola clase no se pasa por la portada).
      var pendingHw = [];
      data.units.forEach(function (u) {
        u.activities.forEach(function (a) {
          if (a.section === 'homework' && !(a.progress && a.progress.completed)) {
            pendingHw.push({ activityId: a.activityId, courseId: c.courseId, unitId: u.unitId, title: a.title });
          }
        });
      });
      if (pendingHw.length) main.appendChild(homeworkBanner(pendingHw));

      data.units.forEach(function (u) {
        var done = doneCount(u.activities);
        main.appendChild(h('div', { class: 'unit-head' },
          h('div', { class: 'unit-art', svg: CQ.Art.svg(u.icon) }),
          h('h2', {}, unitLabel(u)),
          h('div', { class: 'unit-meta' },
            UI.bar(done, u.activities.length),
            h('span', {}, done + '/' + u.activities.length),
            h('span', { class: 'stars-count' }, starIcon(), starCount(u.activities) + ' / ' + u.activities.length * MAX))));
        var grid = h('div', { class: 'grid grid-3' });
        SECTION_ORDER.forEach(function (sec, i) {
          var acts = u.activities.filter(function (a) { return a.section === sec; });
          if (acts.length) grid.appendChild(sectionCard(c.courseId, u, sec, acts, i));
        });
        if (u.videos && u.videos.length) grid.appendChild(videosCard(c.courseId, u));
        main.appendChild(grid);
      });
      if (!data.units.length) main.appendChild(h('p', { class: 'empty card' }, 'New activities are coming soon!'));
    }).catch(function (err) { showError(main, err, function () { renderCourse(r); }); });
  }

  function sectionCard(courseId, u, sec, acts, i) {
    var S = SECTIONS[sec];
    var done = doneCount(acts);
    var todo = sec === 'homework' ? acts.length - done : 0;
    return h('button', {
      class: 'tile tile-section with-badge sec-' + sec, style: { animationDelay: (i * 70) + 'ms' },
      aria: { label: S.label + '. ' + done + ' of ' + acts.length + ' done.' + (todo ? ' ' + todo + ' to do!' : '') },
      onclick: function () { CQ.Nav.go({ name: 'section', courseId: courseId, unitId: u.unitId, section: sec }); }
    },
      todo ? h('span', { class: 'hw-todo' }, todo + ' to do!') : null,
      h('div', { class: 'sec-band' },
        h('span', { class: 'sec-icon', svg: S.icon }),
        h('div', {}, h('h3', {}, S.label), h('span', { class: 'sec-sub' }, S.sub))),
      h('div', { class: 'sec-body' },
        h('div', { class: 'sec-row' }, UI.bar(done, acts.length), h('span', { class: 'muted' }, done + '/' + acts.length)),
        h('div', { class: 'sec-row' },
          h('span', { class: 'stars-count' }, starIcon(), starCount(acts) + ' / ' + acts.length * MAX),
          h('span', { class: 'play' }, 'Open', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } })))));
  }

  /** Tarjeta "Videos" (rosa pastel) de una unidad. */
  function videosCard(courseId, u) {
    var S = SECTIONS.videos;
    var n = u.videos.length;
    return h('button', {
      class: 'tile tile-section sec-videos',
      aria: { label: S.label + '. ' + n + (n > 1 ? ' videos' : ' video') + '.' },
      onclick: function () { CQ.Nav.go({ name: 'section', courseId: courseId, unitId: u.unitId, section: 'videos' }); }
    },
      h('div', { class: 'sec-band' },
        h('span', { class: 'sec-icon', svg: S.icon }),
        h('div', {}, h('h3', {}, S.label), h('span', { class: 'sec-sub' }, S.sub))),
      h('div', { class: 'sec-body' },
        h('div', { class: 'sec-row' }, h('span', { class: 'muted' }, n + (n > 1 ? ' videos' : ' video'))),
        h('div', { class: 'sec-row' }, h('span', {}, ''),
          h('span', { class: 'play' }, 'Watch', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } })))));
  }

  /** Lista de vídeos de una unidad: miniatura + título; al tocar, se abre el reproductor. */
  function renderVideos(main, data, u, r) {
    U.clear(main);
    main.appendChild(hero({
      cls: 'sec-videos', art: u.icon,
      back: backButton(data.course.subjectName, { name: 'course', courseId: r.courseId }),
      kicker: unitLabel(u), title: 'Videos', sub: 'Watch, listen and sing!'
    }));
    var grid = h('div', { class: 'grid video-grid' });
    u.videos.forEach(function (v, i) {
      // ¿Tiene actividades dentro? Entonces se abre como actividad (con nota y estrellas).
      var quiz = u.activities.filter(function (a) { return a.template === 'video_quiz' && a.videoId === v.videoId; })[0];
      var p = quiz && quiz.progress;
      grid.appendChild(h('button', { class: 'tile video-tile', style: { animationDelay: (i * 60) + 'ms' },
        aria: { label: 'Watch: ' + v.title + (quiz ? '. With activities.' : '') },
        onclick: function () {
          if (quiz) CQ.Nav.go({ name: 'play', courseId: r.courseId, unitId: u.unitId, section: 'videos', activityId: quiz.activityId });
          else UI.videoPlayer(v);
        } },
        h('div', { class: 'video-thumb' },
          h('img', { src: 'https://i.ytimg.com/vi/' + v.youtubeId + '/hqdefault.jpg', alt: '', loading: 'lazy' }),
          h('span', { class: 'video-play', svg: CQ.Icons.play }),
          quiz ? h('span', { class: 'video-quiz-chip' }, '🎯 With activities') : null),
        h('h3', {}, v.title),
        quiz ? h('div', { class: 'video-foot' }, UI.stars(p ? p.bestStars : 0, MAX)) : null));
    });
    main.appendChild(grid);
  }

  /* ───────────────────────── SECTION ───────────────────────── */
  function renderSection(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId).then(function (data) {
      var u = data.units.filter(function (x) { return x.unitId === r.unitId; })[0];
      var S = SECTIONS[r.section];
      if (!u || !S) { showError(main, { code: 'NOT_FOUND' }); return; }
      if (r.section === 'videos') { renderVideos(main, data, u, r); return; }
      var acts = u.activities.filter(function (a) { return a.section === r.section; });
      U.clear(main);
      main.appendChild(hero({
        cls: 'sec-' + r.section, art: u.icon,
        back: backButton(data.course.subjectName, { name: 'course', courseId: r.courseId }),
        kicker: unitLabel(u), title: S.label,
        sub: doneCount(acts) + ' of ' + acts.length + ' activities done'
      }));
      if (r.section === 'challenge') {
        LEVEL_ORDER.forEach(function (lv) {
          var list = acts.filter(function (a) { return a.level === lv; });
          if (!list.length) return;
          main.appendChild(h('div', { class: 'level-head' },
            h('span', { class: 'level-chip lv-' + lv }, LEVELS[lv]),
            h('span', { class: 'muted' }, LEVEL_HINT[lv])));
          var g = h('div', { class: 'grid' });
          list.forEach(function (a, i) { g.appendChild(activityTile(r, a, i)); });
          main.appendChild(g);
        });
      } else {
        var grid = h('div', { class: 'grid' });
        acts.forEach(function (a, i) { grid.appendChild(activityTile(r, a, i)); });
        main.appendChild(grid);
      }
    }).catch(function (err) { showError(main, err, function () { renderSection(r); }); });
  }

  function activityTile(r, a, i) {
    var p = a.progress;
    var label = a.locked ? 'Locked' : (p ? 'Play again' : 'Play');
    return h('button', {
      class: 'tile tile-act sec-' + a.section + (a.locked ? ' locked' : ''),
      style: { animationDelay: ((i || 0) * 50) + 'ms' },
      aria: { label: a.title + '. ' + label + (p ? '. ' + p.bestStars + ' of 5 stars' : '') },
      onclick: function () {
        if (a.locked) { UI.toast(MSG.LOCKED_ACTIVITY); return; }
        CQ.Nav.go({ name: 'play', courseId: r.courseId, unitId: a.unitId, section: a.section, activityId: a.activityId });
      }
    },
      h('div', { class: 'top' },
        h('div', { class: 'tpl-icon', svg: a.kind === 'extra' ? CQ.Icons.gamepad : (a.section === 'homework' ? CQ.Icons.homework : (CQ.Icons.tpl[a.template] || CQ.Icons.tpl.multiple_choice)) }),
        a.section === 'challenge' ? h('span', { class: 'level-chip small lv-' + a.level }, LEVELS[a.level])
          : (a.section === 'homework' ? (p && p.completed ? h('span', { class: 'hw-done' }, '✔ Done') : h('span', { class: 'hw-new' }, 'To do')) : UI.kindBadge(a.kind))),
      h('h3', {}, a.title),
      h('div', { class: 'foot' },
        UI.stars(p ? p.bestStars : 0, MAX),
        h('span', { class: 'play' }, h('span', { svg: a.locked ? CQ.Icons.lock : CQ.Icons.play, style: { display: 'flex' } }), label)));
  }

  /** A dónde vuelve el alumno al salir de una actividad: a la sección desde la que entró. */
  function backOf(r) {
    return r.section ? { name: 'section', courseId: r.courseId, unitId: r.unitId, section: r.section } : { name: 'course', courseId: r.courseId };
  }

  /* ───────────────────────── PLAY ───────────────────────── */
  function renderPlay(r) {
    U.clear(app);
    app.appendChild(UI.loading());
    CQ.Api.student('openActivity', { activityId: r.activityId }).then(function (data) {
      var startedAt = Date.now();
      state.runner = CQ.Engine.run({
        root: app,
        activity: data.activity,
        mode: 'student',
        onExit: function () { state.runner = null; CQ.Nav.go(backOf(r)); },
        onFinish: function (result) {
          state.runner = null;
          submit(r, data, result, Math.round((Date.now() - startedAt) / 1000));
        }
      });
    }).catch(function (err) {
      var main = page();
      showError(main, err, function () { renderPlay(r); });
    });
  }

  function submit(r, opened, result, clientDurationSec) {
    U.clear(app);
    app.appendChild(h('div', { class: 'loading' }, h('div', { style: { textAlign: 'center' } },
      h('div', { class: 'spinner', style: { margin: '0 auto 16px' } }), h('p', { style: { fontSize: '22px', fontWeight: '600' } }, 'Saving your stars…'))));
    var payload = {
      attemptId: opened.attemptId,
      activityId: opened.activity.activityId,
      responses: result.responses,
      clientDurationSec: clientDurationSec
    };
    var sid = state.student && state.student.studentId;
    CQ.Api.student('submitAttempt', payload).then(function (res) {
      if (res.profile) state.profile = res.profile;
      patchProgress(r.courseId, opened.activity.activityId, res);
      renderResults(r, opened.activity, result, res, true);
    }).catch(function (err) {
      if (err && (err.code === 'NETWORK' || err.code === 'SERVER' || err.code === 'SESSION_EXPIRED')) {
        if (sid) Outbox.add(sid, payload);
        if (err.code === 'SESSION_EXPIRED') { endSession('Please log in again. Your answers are safe.'); return; }
        renderResults(r, opened.activity, result, null, false);
      } else {
        showError(page(), err);
      }
    });
  }

  function patchProgress(courseId, activityId, res) {
    state.home = null;
    var c = state.courses[courseId];
    if (!c) return;
    c.units.forEach(function (u) {
      u.activities.forEach(function (a) {
        if (a.activityId !== activityId) return;
        var p = a.progress || { attempts: 0, bestScore: 0, bestStars: 0, lastScore: 0, completed: false };
        p.attempts = res.attemptNumber;
        p.bestScore = Math.max(p.bestScore, res.score);
        p.bestStars = Math.max(p.bestStars, res.stars);
        p.lastScore = res.score;
        p.completed = p.completed || res.status === 'completed';
        a.progress = p;
      });
    });
  }

  /* ───────────────────────── RESULTS ───────────────────────── */
  var TITLES = ['Keep practising!', 'Good try!', 'Nice work!', 'Great job!', 'Super!', 'Amazing!'];

  function renderResults(r, activity, local, res, saved) {
    var main = page();
    var stars, correct, total;
    if (res) { stars = res.stars; correct = res.correct; total = res.total; }
    else {
      total = local.local.total;
      correct = local.local.correct;
      stars = Grading.starsFor(total ? Math.round(correct / total * 100) : 0);
    }
    var S = SECTIONS[r.section] || { label: 'the unit' };
    var box = h('section', { class: 'results card', aria: { live: 'polite' } },
      UI.stars(stars, MAX, 'lg'),
      h('h1', {}, TITLES[stars] || TITLES[0]),
      h('p', { class: 'score' }, 'You got ' + correct + ' out of ' + total + ' right.'),
      res && res.isPersonalBest ? h('span', { class: 'pb' }, '🏆 New personal best!') : null,
      res && res.firstTime ? h('span', { class: 'muted' }, 'First time done!') : null,
      res && !res.firstTime ? h('span', { class: 'muted' }, 'Attempt ' + res.attemptNumber) : null,
      !saved ? h('p', { class: 'pb', style: { background: '#FDECEC', color: '#A4282C' } }, 'We could not save yet. We will try again later.') : null);

    if (saved && state.profile && state.profile.shopBadge) {
      box.appendChild(h('button', { class: 'shop-hint', onclick: function () { CQ.Nav.go({ name: 'shop' }); } },
        h('span', { svg: CQ.Icons.shop, style: { display: 'flex', width: '26px' } }),
        'You can buy something new in the Star Shop!'));
    }

    if (res && activity.config.feedback === 'end') box.appendChild(reviewList(activity, local.responses, res.review));

    // Siguiente actividad de la misma sección
    var next = null;
    var course = state.courses[r.courseId];
    if (course) {
      var unit = course.units.filter(function (u) { return u.unitId === r.unitId; })[0];
      if (unit) {
        var list = unit.activities.filter(function (a) { return !r.section || a.section === r.section; });
        var idx = list.map(function (a) { return a.activityId; }).indexOf(activity.activityId);
        next = list.slice(idx + 1).filter(function (a) { return !a.locked; })[0] || null;
      }
    }
    box.appendChild(h('div', { class: 'row-actions', style: { marginTop: '14px' } },
      h('button', { class: 'btn btn-ghost btn-lg', onclick: function () { CQ.Nav.go(r, true); } }, 'Play again'),
      next ? h('button', { class: 'btn btn-lg', onclick: function () { CQ.Nav.go({ name: 'play', courseId: r.courseId, unitId: r.unitId, section: r.section, activityId: next.activityId }, true); } },
        'Next activity', h('span', { svg: CQ.Icons.play, style: { display: 'flex' } })) : null));
    box.appendChild(h('button', { class: 'back-btn', style: { marginTop: '6px' }, onclick: function () { CQ.Nav.go(backOf(r)); } },
      h('span', { svg: CQ.Icons.back, style: { display: 'flex' } }), 'Back to ' + S.label));
    main.appendChild(box);
    if (stars === MAX) UI.announce('Amazing! Five stars!');
    var fx = state.profile && state.profile.effect;
    if (saved && fx && fx !== 'fx-none') setTimeout(function () { CQ.Effects.play(fx); }, 350);
  }

  function reviewList(activity, responses, review) {
    var byItem = {};
    activity.items.forEach(function (it) { byItem[it.itemId] = it; });
    var mine = {};
    responses.forEach(function (x) { mine[x.itemId] = x.response; });
    var list = h('div', { class: 'review' }, h('h2', { class: 'section-title', style: { margin: '10px 0 4px' } }, 'Let’s check'));
    review.forEach(function (rv, n) {
      var it = byItem[rv.itemId];
      if (!it) return;
      list.appendChild(h('div', { class: 'review-row' },
        h('span', { class: 'mark ' + (rv.correct ? 'ok' : 'no') }, rv.correct ? '✓' : '✗'),
        h('div', { style: { flex: 1 } },
          h('div', { style: { fontWeight: 600 } }, (it.prompt || ('Sentence ' + (n + 1))).replace(/_{2,}/, '…')),
          h('div', { class: 'muted' }, 'You: ' + (mine[rv.itemId] || '—') + (rv.correct ? '' : '  ·  Answer: ' + rv.answer)))));
    });
    return list;
  }

  /* ───────────────────────── MY PROGRESS ───────────────────────── */
  function renderProgress(r) {
    var main = page();
    main.appendChild(UI.loading());
    loadCourse(r.courseId, true).then(function (data) {
      U.clear(main);
      var acts = [];
      data.units.forEach(function (u) { acts = acts.concat(u.activities); });
      var done = doneCount(acts);
      var stars = starCount(acts);
      var perfect = acts.filter(function (a) { return a.progress && a.progress.bestStars === MAX; }).length;
      var unitDone = data.units.some(function (u) { return u.activities.every(function (a) { return a.progress && a.progress.completed; }); });
      var champ = acts.some(function (a) { return a.section === 'challenge' && a.progress && a.progress.bestStars >= 4; });

      main.appendChild(hero({
        cls: 'hero-progress', art: 'mascot',
        back: backButton(data.course.subjectName, { name: 'course', courseId: r.courseId }),
        kicker: data.course.subjectName + ' · Year ' + data.course.year, title: 'My Progress'
      }));

      main.appendChild(h('div', { class: 'stat-row' },
        stat('st-stars', CQ.Icons.star, stars + ' / ' + acts.length * MAX, 'Stars'),
        stat('st-done', CQ.Icons.check, done + ' / ' + acts.length, 'Activities done'),
        stat('st-perfect', CQ.Icons.sparkle, String(perfect), 'Perfect scores (5 stars)')));

      var medals = [
        ['First steps', 'Finish your first activity', done >= 1, 'trophy'],
        ['Star collector', 'Collect 20 stars', stars >= 20, 'star'],
        ['Perfect!', 'Get 5 stars in an activity', perfect >= 1, 'star'],
        ['Unit master', 'Finish every activity in a unit', unitDone, 'trophy'],
        ['Challenge champion', 'Get 4 stars in a challenge', champ, 'trophy']
      ];
      main.appendChild(h('h2', { class: 'section-title' }, 'My medals'));
      var mg = h('div', { class: 'grid-sm' });
      medals.forEach(function (m) {
        mg.appendChild(h('div', { class: 'medal' + (m[2] ? ' on' : ' off') },
          h('div', { class: 'disc', svg: CQ.Icons[m[3]] }),
          h('b', {}, m[0]),
          h('span', {}, m[2] ? 'Unlocked!' : m[1])));
      });
      main.appendChild(mg);

      data.units.forEach(function (u) {
        var ud = doneCount(u.activities);
        var card = h('div', { class: 'card progress-card' },
          h('div', { class: 'progress-card-head' },
            h('h3', {}, unitLabel(u)), UI.bar(ud, u.activities.length), h('span', { class: 'muted' }, ud + '/' + u.activities.length)));
        SECTION_ORDER.forEach(function (sec) {
          var list = u.activities.filter(function (a) { return a.section === sec; });
          if (!list.length) return;
          card.appendChild(h('div', { class: 'progress-sec sec-' + sec }, h('span', { svg: SECTIONS[sec].icon, style: { display: 'flex', width: '22px' } }), SECTIONS[sec].label));
          list.forEach(function (a) {
            card.appendChild(h('div', { class: 'list-row' },
              h('span', { class: 'name' }, a.title),
              a.section === 'challenge' ? h('span', { class: 'level-chip small lv-' + a.level }, LEVELS[a.level]) : UI.kindBadge(a.kind),
              UI.stars(a.progress ? a.progress.bestStars : 0, MAX)));
          });
        });
        main.appendChild(card);
      });
    }).catch(function (err) { showError(main, err, function () { renderProgress(r); }); });

    function stat(cls, icon, n, l) {
      return h('div', { class: 'stat ' + cls }, h('span', { class: 'stat-icon', svg: icon }), h('div', {}, h('div', { class: 'n' }, n), h('div', { class: 'l' }, l)));
    }
  }

  /* ───────────────────────── PERFIL (ventana) ───────────────────────── */
  function openProfile() {
    var p = state.profile;
    if (!p) return;
    var fresh = (p.newItems || []).slice();
    var m;
    var owned = function (type) {
      return state.catalog.filter(function (i) { return i.type === type && p.owned.indexOf(i.id) >= 0; });
    };
    var avatars = h('div', { class: 'owned-row' }, owned('avatar').map(function (i) {
      return h('button', {
        class: 'mini-av' + (p.avatar === i.id ? ' on' : ''), aria: { label: 'Use avatar ' + i.name, pressed: String(p.avatar === i.id) },
        onclick: function () { equip(i, function () { m.close(); openProfile(); }); }
      }, h('span', { class: 'mini-art', svg: avatarSvg(i.id) }), fresh.indexOf(i.id) >= 0 ? h('span', { class: 'new-tag' }, 'NEW') : null);
    }));
    var effects = h('div', { class: 'owned-row' }, owned('effect').map(function (i) {
      return h('button', {
        class: 'fx-chip' + (p.effect === i.id ? ' on' : ''), aria: { pressed: String(p.effect === i.id) },
        onclick: function () { equip(i, function () { m.close(); openProfile(); }); }
      }, h('span', { class: 'fx-chip-art', svg: CQ.Art.svg(i.id) }), i.name, fresh.indexOf(i.id) >= 0 ? h('span', { class: 'new-tag' }, 'NEW') : null);
    }));
    m = UI.modal({
      className: 'profile-modal',
      body: [
        h('div', { class: 'profile-top' }, h('div', { class: 'profile-avatar', svg: avatarSvg(p.avatar) })),
        h('h2', {}, state.student.displayName),
        h('div', { class: 'profile-stats' },
          h('div', { class: 'pstat' },
            h('div', { class: 'pnum' }, starIcon(), p.starsEarned + ' / ' + p.starsMax),
            h('div', { class: 'plabel' }, 'Stars earned'),
            UI.bar(p.starsEarned, p.starsMax)),
          h('div', { class: 'pstat pstat-gold' },
            h('div', { class: 'pnum' }, starIcon(), String(p.balance)),
            h('div', { class: 'plabel' }, 'Stars to spend')),
          h('div', { class: 'pstat pstat-super' },
            h('div', { class: 'pnum' }, superIcon(), String(p.superBalance || 0)),
            h('div', { class: 'plabel' }, 'Super stars to spend'),
            h('div', { class: 'psmall' }, (p.superEarned || 0) + ' earned by your class'))),
        h('h3', { class: 'profile-sub' }, 'My avatars'),
        avatars,
        h('h3', { class: 'profile-sub' }, 'My celebration'),
        effects,
        h('div', { class: 'row-actions', style: { marginTop: '20px' } },
          h('button', { class: 'btn btn-ghost', onclick: function () { m.close(); } }, 'Close'),
          h('button', { class: 'btn btn-buy', onclick: function () { m.close(); CQ.Nav.go({ name: 'shop' }); } },
            h('span', { svg: CQ.Icons.shop, style: { display: 'flex' } }), 'Star Shop'))
      ]
    });
    if (p.profileBadge) {
      CQ.Api.student('seenProfile', {}).then(function (res) { setProfile(res.profile); }).catch(function () {});
    }
  }

  function equip(item, after) {
    CQ.Api.student('equip', { itemId: item.id }).then(function (res) {
      setProfile(res.profile);
      if (state.shopMain && document.body.contains(state.shopMain)) drawShop(state.shopMain);
      if (item.type === 'effect' && item.id !== 'fx-none') CQ.Effects.play(item.id);
      else UI.toast(item.type === 'avatar' ? 'New look! 😎' : 'No celebration effect.');
      if (after) after();
    }).catch(function (err) { UI.toast(msgFor(err)); });
  }

  /* ───────────────────────── TIENDA ───────────────────────── */
  function renderShop() {
    var main = page();
    state.shopMain = main;
    main.appendChild(UI.loading());
    CQ.Api.student('getShop', {}).then(function (d) {
      setProfile(d.profile, d.catalog);
      drawShop(main);
    }).catch(function (err) { showError(main, err, function () { renderShop(); }); });
  }

  function drawShop(main) {
    var p = state.profile;
    U.clear(main);
    main.appendChild(hero({
      cls: 'hero-shop', art: 'fx-stars',
      back: h('button', { class: 'back-btn', onclick: function () { if (window.history.length > 1) window.history.back(); else CQ.Nav.go({ name: 'home' }); } },
        h('span', { svg: CQ.Icons.back, style: { display: 'flex' } }), 'Back'),
      title: 'Star Shop', sub: 'Use your stars to get new avatars and celebrations!',
      action: h('div', { class: 'balance-pills' },
        h('div', { class: 'balance-pill' }, starIcon(), h('b', {}, String(p.balance)), h('span', {}, 'stars')),
        h('div', { class: 'balance-pill super' }, superIcon(), h('b', {}, String(p.superBalance || 0)), h('span', {}, 'super stars')))
    }));
    main.appendChild(h('p', { class: 'shop-note' }, 'Buying things doesn’t change your progress. You keep all your stars in the activities!'));
    var groups = [
      ['avatar', 'stars', 'Avatars', null],
      ['effect', 'stars', 'Celebrations', null],
      [null, 'super', 'Super Star items', 'Only with super stars. Your class earns them together with Class rewards!']
    ];
    groups.forEach(function (g) {
      var items = state.catalog.filter(function (i) { return (i.currency || 'stars') === g[1] && (!g[0] || i.type === g[0]); });
      if (!items.length) return;
      main.appendChild(h('h2', { class: 'section-title' + (g[1] === 'super' ? ' super-title' : '') },
        g[1] === 'super' ? h('span', { svg: CQ.Icons.superstar, style: { display: 'flex', width: '30px' } }) : null, g[2]));
      if (g[3]) main.appendChild(h('p', { class: 'shop-note super-note' }, g[3]));
      var grid = h('div', { class: 'shop-grid' + (g[1] === 'super' ? ' super-grid' : '') });
      items.forEach(function (i) { grid.appendChild(shopItem(i)); });
      main.appendChild(grid);
    });
  }

  function wallet(i) { var p = state.profile; return (i.currency === 'super' ? p.superBalance : p.balance) || 0; }
  function priceIcon(i) { return i.currency === 'super' ? superIcon() : starIcon(); }

  function shopItem(i) {
    var p = state.profile;
    var owned = p.owned.indexOf(i.id) >= 0;
    var using = (i.type === 'avatar' ? p.avatar : p.effect) === i.id;
    var money = wallet(i);
    var action;
    if (using) {
      action = h('span', { class: 'chip-using' }, h('span', { svg: CQ.Icons.check, style: { display: 'flex', width: '18px' } }), 'Using');
    } else if (owned) {
      action = h('button', { class: 'btn btn-soft btn-sm', onclick: function () { equip(i); } }, 'Use');
    } else if (money >= i.price) {
      action = h('button', { class: 'btn btn-sm ' + (i.currency === 'super' ? 'btn-super' : 'btn-buy'),
        aria: { label: 'Buy ' + i.name + ' for ' + i.price + (i.currency === 'super' ? ' super stars' : ' stars') }, onclick: function () { buy(i); } },
        priceIcon(i), String(i.price));
    } else {
      action = h('div', { class: 'need' },
        h('span', { class: 'price-locked' }, h('span', { svg: CQ.Icons.lock, style: { display: 'flex', width: '16px' } }), priceIcon(i), String(i.price)),
        h('span', { class: 'muted small' }, 'Need ' + (i.price - money) + ' more'));
    }
    return h('div', { class: 'shop-item' + (using ? ' using' : '') + (owned ? ' owned' : '') + (!owned && money < i.price ? ' too-dear' : '') + (i.currency === 'super' ? ' super' : '') },
      h('div', { class: 'shop-art' + (i.type === 'avatar' ? ' round' : ''), svg: CQ.Art.svg(i.id) }),
      h('b', {}, i.name),
      action,
      i.type === 'effect' && i.id !== 'fx-none' ? h('button', { class: 'link-btn', onclick: function () { CQ.Effects.play(i.id); } }, 'Try it') : null);
  }

  function buy(i) {
    var unit = i.currency === 'super' ? ' super stars' : ' stars';
    UI.confirm('Buy ' + i.name + '?', 'It costs ' + i.price + unit + '. You have ' + wallet(i) + '.', 'Buy', 'Not now').then(function (yes) {
      if (!yes) return;
      CQ.Api.student('buyItem', { itemId: i.id }).then(function (res) {
        setProfile(res.profile);
        if (state.shopMain && document.body.contains(state.shopMain)) drawShop(state.shopMain);
        CQ.Sfx.play('win');
        CQ.Effects.play('fx-confetti');
        var isAv = i.type === 'avatar';
        UI.choice(isAv ? 'Do you want to equip this avatar?' : 'Do you want to use this celebration?', null, 'Yes', 'No', {
          kicker: isAv ? 'New avatar unlocked!' : 'New celebration unlocked!',
          art: h('div', { class: 'unlock-art' + (isAv ? ' round' : ''), svg: CQ.Art.svg(i.id) })
        }).then(function (equipNow) { if (equipNow) equip(i); });
      }).catch(function (err) { UI.toast(msgFor(err)); });
    });
  }

  /* ───────────────────────── arranque ───────────────────────── */
  CQ.Nav.start(function (r) { route(r); });
  CQ.Nav.go(CQ.Api.token ? { name: 'home' } : { name: 'login' }, true);
  if (BOOT.apiUrl) {
    CQ.Api.student('config', {}).then(function (c) {
      BOOT.idleMinutes = c.idleMinutes;
      BOOT.appName = c.appName;
      resetIdle();
    }).catch(function () {});
  }
})();
</script>

</body>
</html>
